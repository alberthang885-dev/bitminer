<script>
"use strict";
var C=document.getElementById('c'),X=C.getContext('2d');
var W=792,H=564;
var TS=32,GW=24,GH=14,OX=12,OY=44;
var SPR=TS/32;
var BOT=72;
var DX=[1,0,-1,0],DY=[0,1,0,-1];
var COL={dark:'#211f36',grass:'#54a64a',grass2:'#43873c',sand:'#d6ba7d',sand2:'#bd9a60',
  sea:'#15637f',sea2:'#2b8dab',foam:'#86c2d2',bit:'#3fc0e6',bit2:'#a4e6f5',
  gold:'#e0b530',pink:'#e05585',purple:'#7f49c4',coral:'#e0724a',cream:'#f2e5c4',
  mant:'#26b389',mant2:'#1e9c76',mantD:'#0e3a30',wood:'#a8723d',wood2:'#8a5a2c',
  sup:'#a464db',sup2:'#cfaae8',anom:'#5a4a66',anom2:'#e04a68',
  shell:'#e09aa9',shell2:'#e0c6cc',pearl:'#ddd8e8'};

/* ---------- helpers ---------- */
function hash(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);}
function fill(c){X.fillStyle=c;X.fill();}
function line(c,w){X.strokeStyle=c;X.lineWidth=w||3;X.stroke();}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function txt(s,x,y,size,col,align,bold){X.font=(bold===false?'':'bold ')+size+'px Verdana,Geneva,sans-serif';
  X.fillStyle=col;X.textAlign=align||'left';X.textBaseline='middle';X.fillText(s,x,y);}
function cx(x){return OX+x*TS;}
function cy(y){return OY+y*TS;}

/* ---------- bit kinds ---------- */
var MULT={mini:0.5,bit:1,large:4,sup:12,shell:2,pearl:8,ultra:30,lsup:40,lultra:100};
var PTS={mini:1,bit:2,large:6,sup:15,anom:4,shell:3,pearl:10,ultra:35,lsup:45,lultra:110,tranq:20};
var KINDNAME={mini:'MINI BIT',bit:'BIT',large:'LARGE BIT',sup:'SUPER BIT',anom:'ANOMALY',shell:'SEASHELL',pearl:'PEARL',ultra:'ULTRA BIT',lsup:'LARGE SUPER BIT',lultra:'LARGE ULTRA BIT',tranq:'TRANQUIL ORE'};
var PARTNAME={ucore:'UNSTABLE CORE',score:'STABLE CORE',ustar:'UNSTABLE STAR',sstar:'STABLE STAR'};
var PARTKEYS=['ucore','score','ustar','sstar'];
function matName(k){return PARTNAME[k]||KINDNAME[k]||k;}
function matHave(k){return PARTNAME[k]?S.parts[k]:S.bag[k];}
function matTake(k,n){if(PARTNAME[k])S.parts[k]-=n;else S.bag[k]-=n;}
var CURS=['mini','bit','shell','large','pearl','sup','lsup','ultra','lultra'];

/* ---------- machine catalogue ---------- */
var SIZES={belt:1,mini:1,scan:1,gate:1,sep:1,dredge:1,gen:2,lgen:3,miner:2,seller:2,sup:2,ult:2,comp:2,craft:2,kiln:2,aqua:2,crab:2,gw:3,dyson:3,lgminer:2,lgsup:2,lgult:2};
var TERRAIN={belt:'both',scan:'both',gate:'both',sep:'both',gw:'both',crab:'land',gen:'land',lgen:'both',
  miner:'land',mini:'land',sup:'land',ult:'land',seller:'land',comp:'land',craft:'land',kiln:'land',dyson:'land',
  lgminer:'land',lgsup:'land',lgult:'land',
  aqua:'water',dredge:'water'};
var PRICES={belt:25,mini:150,miner:480,seller:400,scan:120,gate:120,sep:200,gen:0,lgen:0,comp:900,craft:1200,kiln:5000,sup:9000,gw:15000,aqua:1400,dredge:450,crab:1500,ult:30000,dyson:0,
  lgminer:4200,lgsup:26000,lgult:88000};
function sizeOf(t){return SIZES[t]||1;}
/* only the LARGE miners can switch between chunky and quick */
var BIGKIND={lgminer:1,lgsup:1,lgult:1};
var BIGREQ={lgminer:6500,lgsup:20000,lgult:70000};
var BIGNAME={lgminer:'LARGE BITMINER',lgsup:'LARGE SUPER MINER',lgult:'LARGE ULTRA MINER'};
function canSwitch(t){return !!BIGKIND[t];}
function bigOpen(t){return S.pts>=(BIGREQ[t]||0);}
var CADENCE={mini:5.0,miner:6.5,sup:9.0,ult:12.0,aqua:7.0,dredge:8.0,
             lgminer:5.4,lgsup:7.6,lgult:10.2};
function isMiner(t){return CADENCE[t]!==undefined;}
var SIZEW={gen:2,lgen:2},SIZEH={gen:3,lgen:3};   /* anything not listed is square */
function sizeW(t){return SIZEW[t]||sizeOf(t);}
function sizeH(t){return SIZEH[t]||sizeOf(t);}
function sellback(t){return Math.floor((PRICES[t]||0)*0.6);}
/* ---------- electricity ---------- */
var POWER={belt:1,scan:1,gate:1,sep:2,mini:3,dredge:4,seller:5,miner:6,comp:8,craft:8,kiln:16,
           aqua:10,sup:14,gw:20,ult:30,dyson:120,crab:0,gen:0,lgen:0,
           lgminer:14,lgsup:30,lgult:62};
var BURN=0.0028;            /* fuel units per watt per second */
var FUEL_OF={mini:0.5,bit:1,large:4,sup:12,ult:25,shell:1.5,pearl:5,anom:2,tranq:20};
function genOf(I){
  for(var i=0;i<I.structs.length;i++)if(I.structs[i].t==='gen'||I.structs[i].t==='lgen')return I.structs[i];
  return null;
}
function drawOf(I){
  var w=0;
  for(var i=0;i<I.structs.length;i++)w+=(POWER[I.structs[i].t]||0);
  for(var q=0;q<GW*GH;q++){var c=I.cells[q];if(c&&c.t==='belt')w+=POWER.belt;}
  return w;
}
function freeW(g){return g?(g.t==='lgen'?30:15):0;}
function billedW(I){var g=genOf(I);return Math.max(0,drawOf(I)-freeW(g));}
function genCap(g){return g.t==='lgen'?900:400;}
function feedGen(g,kind,n){
  var v=(FUEL_OF[kind]||1)*(n===undefined?1:n);
  if(!(v>0))return 0;
  g.fuel=Math.min(genCap(g),(g.fuel||0)+v);
  g.feed=1;
  return v;
}
function isPowered(I){
  var g=genOf(I);
  /* No generator used to mean "nothing to pay", which let you run an entire
     island for free by simply picking the generator up. */
  if(!g)return drawOf(I)<=0;
  return billedW(I)<=0||(g.fuel||0)>0;
}
var RECIPES=[['belt',9],['scan',36],['gate',36],['sep',60],['mini',48],['dredge',140],['seller',125],
             ['miner',200],['aqua',440],['comp',290],['craft',380],['kiln',900]];

/* ---------- Ferro's workshop, up in Portside ---------- */
var WORKS=[
 {k:'kiln',name:'TRANQUIL KILN',type:'machine',coins:5000,mats:{bit:150},
  desc:'Belt bits in, tranquil ore comes out. Twelve bits of ore value make one.'},
 {k:'ucore',name:'UNSTABLE CORE',type:'part',coins:40000,mats:{tranq:60,anom:20,sup:80},
  desc:'A knot of matter that will not sit still. Two of them make an unstable star.'},
 {k:'score',name:'STABLE CORE',type:'part',coins:40000,mats:{tranq:60,pearl:25,large:200},
  desc:'Heavy, calm, perfectly quiet. Two of them make a stable star.'},
 {k:'dyson',name:'DYSON SPHERE',type:'machine',coins:250000,mats:{tranq:400,ultra:150,lsup:40},
  desc:'Three by three. The pinnacle of engineering - and useless until it holds a star. One per island.'},
 {k:'ustar',name:'UNSTABLE STAR',type:'part',coins:150000,mats:{ucore:2,tranq:250,lultra:60,sup:200},
  desc:'Feed it to a sphere and it prints whichever currency you point it at, fast.'},
 {k:'sstar',name:'STABLE STAR',type:'part',coins:150000,mats:{score:2,tranq:250,lultra:60,pearl:80},
  desc:'Feed it to a sphere and every machine on that island runs better.'}
];
function workOf(k){for(var i=0;i<WORKS.length;i++)if(WORKS[i].k===k)return WORKS[i];return null;}
function canCraft(r){
  if(S.coins<r.coins)return false;
  for(var m in r.mats)if(matHave(m)<r.mats[m])return false;
  return true;
}
/* the fusion sequence: two cores brought together and lit */
function startFuse(k){
  S.fuse={k:k,t:0};
  var seq=[[180,0],[240,140],[320,280],[430,420],[560,520],[740,600],[990,680]];
  seq.forEach(function(n){setTimeout(function(){beep(n[0],0.16,'sawtooth',0.05);},n[1]);});
  setTimeout(function(){
    beep(1320,0.5,'sine',0.09);beep(660,0.6,'triangle',0.07);
    if(k==='ustar')beep(110,0.7,'sawtooth',0.06);
  },1150);
}
function drawFusion(){
  var f=S.fuse;if(!f)return;
  var t=f.t,k=f.k,un=(k==='ustar'),P=starPal(k),i;
  var cx0=W/2,cy0=H/2-10;
  /* the room darkens as they come together */
  var dim=clamp(t/0.5,0,1)*0.78*(t>2.9?clamp((3.5-t)/0.6,0,1):1);
  X.fillStyle='rgba(12,10,26,'+dim.toFixed(3)+')';X.fillRect(0,0,W,H);
  X.save();X.translate(cx0,cy0);
  if(t<1.05){
    /* two cores swing in, spinning faster and faster */
    var u=clamp(t/1.05,0,1),ease=u*u,gap=190*(1-ease)+14;
    for(i=0;i<2;i++){
      var sx=(i?1:-1)*gap,sy=Math.sin(u*3.14)*(i?-34:34)*(1-ease);
      /* the trail they drag behind them, tapering away */
      X.save();X.translate(sx,sy);X.rotate(Math.atan2(sy,sx));
      X.globalAlpha=0.40*(1-ease);
      var gtr=X.createLinearGradient(0,0,90,0);
      gtr.addColorStop(0,P.ray);gtr.addColorStop(1,'rgba(255,255,255,0)');
      X.fillStyle=gtr;
      X.beginPath();X.moveTo(0,-9);X.lineTo(92,-1.5);X.lineTo(92,1.5);X.lineTo(0,9);X.closePath();X.fill();
      X.globalAlpha=1;X.restore();
      X.save();X.translate(sx,sy);X.rotate((i?-1:1)*u*u*14);
      X.scale(2.2-0.5*ease,2.2-0.5*ease);
      drawCoreArt(un?'ucore':'score',13);
      X.restore();
    }
    /* the seam of light growing between them */
    X.globalAlpha=ease;
    var gseam=X.createRadialGradient(0,0,2,0,0,60*ease+6);
    gseam.addColorStop(0,'#ffffff');gseam.addColorStop(1,'rgba(255,255,255,0)');
    X.fillStyle=gseam;X.beginPath();X.arc(0,0,60*ease+6,0,6.3);X.fill();
    X.globalAlpha=1;
    txt(un?'FUSING TWO UNSTABLE CORES':'FUSING TWO STABLE CORES',
        0,150,12,COL.cream,'center');
  }
  else if(t<1.35){
    /* the flash */
    var fu=(t-1.05)/0.30,rad=40+520*fu;
    X.globalAlpha=1-fu;
    var gfl=X.createRadialGradient(0,0,0,0,0,rad);
    gfl.addColorStop(0,'#ffffff');gfl.addColorStop(0.35,P.hot);
    gfl.addColorStop(1,'rgba(255,255,255,0)');
    X.fillStyle=gfl;X.beginPath();X.arc(0,0,rad,0,6.3);X.fill();
    X.globalAlpha=1;
  }
  else {
    /* the star, arriving */
    var su=clamp((t-1.35)/0.75,0,1),pop2=su<1?(1+0.45*Math.sin(su*3.14)):1;
    /* shockwave rings */
    for(i=0;i<3;i++){
      var ru=clamp((t-1.35-i*0.16)/1.0,0,1);
      if(ru<=0||ru>=1)continue;
      X.globalAlpha=(1-ru)*0.5;
      X.strokeStyle=P.ray;X.lineWidth=5*(1-ru)+1;
      X.beginPath();X.arc(0,0,40+ru*330,0,6.3);X.stroke();
    }
    X.globalAlpha=1;
    X.save();X.scale(pop2*3.0,pop2*3.0);drawStarArt(k,15);X.restore();
    if(t>1.7){
      X.globalAlpha=clamp((t-1.7)/0.35,0,1);
      txt(un?'UNSTABLE STAR FORGED':'STABLE STAR FORGED',0,152,16,P.ray,'center');
      txt(un?'"Do not hold it for long." - Ferro':'"Hold it as long as you like." - Ferro',
          0,174,9,'#cfd4e0','center',false);
      X.globalAlpha=1;
    }
  }
  X.restore();
  if(t>1.9){
    var pw=110,px2=W/2-pw/2,py2=cy0+196;
    X.globalAlpha=0.75;rr(px2,py2,pw,20,9);fill('#171430');X.globalAlpha=1;
    txt('click to continue',W/2,py2+11,9,'#b9b3d8','center',false);
  }
}
function doCraft(r){
  if(!canCraft(r)){S.hint='Not enough for that yet';S.hintT=2.5;beep(150,0.12,'sawtooth',0.045);return;}
  S.coins-=r.coins;
  for(var m in r.mats)matTake(m,r.mats[m]);
  if(r.type==='machine'){S.stock[r.k]=(S.stock[r.k]||0)+1;S.tool=r.k;}
  else S.parts[r.k]=(S.parts[r.k]||0)+1;
  S.hint=r.name+' finished! '+(r.type==='machine'?'It is in your inventory.':'Ferro wraps it carefully.');
  S.hintT=4.5;S.pts+=Math.floor(r.coins/500);
  if(r.k==='ustar'||r.k==='sstar'){startFuse(r.k);save();return;}
  pop(W/2,H/2-40,r.name+' CRAFTED',COL.gold);
  chaChing(true);save();
}
/* the stars only ever help the island they sit on */
function dysonOf(I){
  for(var i=0;i<I.structs.length;i++)if(I.structs[i].t==='dyson')return I.structs[i];
  return null;
}
function isleStable(I){var d=dysonOf(I);return !!(d&&d.star==='sstar');}

/* ---------- island generation ---------- */
var ICX=OX+GW*TS/2, ICY=OY+GH*TS/2, IAX0=GW*TS/2-10, IAY0=GH*TS/2-6;
function tilePath(I,grass,r){
  var p=new Path2D();
  function m(x,y){if(x<0||y<0||x>=GW||y>=GH)return false;
    return grass?(I.LAND[y*GW+x]&&!I.SAND[y*GW+x]):I.LAND[y*GW+x];}
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    if(!m(x,y))continue;
    var L=m(x-1,y),R=m(x+1,y),U=m(x,y-1),D=m(x,y+1);
    p.roundRect(cx(x),cy(y),TS,TS,[(!L&&!U)?r:0,(!R&&!U)?r:0,(!R&&!D)?r:0,(!L&&!D)?r:0]);
  }
  return p;
}
function genIsle(cfg){
  var I={cat:cfg.key,name:cfg.name,type:cfg.type,scale:cfg.scale||1,seed:cfg.seed||0,rich:!!cfg.rich,
    home:!!cfg.home,owned:true,cells:[],structs:[],items:[],loose:[],palms:[],LAND:[],SAND:[]};
  for(var i=0;i<GW*GH;i++){I.cells[i]=null;I.LAND[i]=false;I.SAND[i]=false;}
  if(cfg.type==='land'){
    var sd=cfg.seed||0,iax=IAX0*I.scale,iay=IAY0*I.scale;
    function noise(x,y){
      return 0.62*(hash(Math.floor(x/4)+sd,Math.floor(y/4)+sd)-0.5)
            +0.30*(hash(Math.floor(x/3)+7+sd,Math.floor(y/3)+3+sd)-0.5)
            +0.22*(hash(Math.floor(x/2)+31+sd,Math.floor(y/2)+17+sd)-0.5);
    }
    for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
      var dx=(cx(x)+TS/2-ICX)/iax,dy=(cy(y)+TS/2-ICY)/iay;
      var d=Math.sqrt(dx*dx+dy*dy);
      I.LAND[y*GW+x]=(d+0.26*noise(x,y))<0.95;
    }
    for(var y2=0;y2<GH;y2++)for(var x2=0;x2<GW;x2++){
      if(!I.LAND[y2*GW+x2])continue;
      var n=0;
      if(x2>0&&I.LAND[y2*GW+x2-1])n++;
      if(x2<GW-1&&I.LAND[y2*GW+x2+1])n++;
      if(y2>0&&I.LAND[(y2-1)*GW+x2])n++;
      if(y2<GH-1&&I.LAND[(y2+1)*GW+x2])n++;
      if(n===0)I.LAND[y2*GW+x2]=false;
    }
    for(var y3=0;y3<GH;y3++)for(var x3=0;x3<GW;x3++){
      if(!I.LAND[y3*GW+x3])continue;
      var wet=false;
      for(var j=-2;j<=2&&!wet;j++)for(var i2=-2;i2<=2;i2++){
        var nx=x3+i2,ny=y3+j;
        if(nx<0||ny<0||nx>=GW||ny>=GH||!I.LAND[ny*GW+nx]){wet=true;break;}}
      I.SAND[y3*GW+x3]=wet;
    }
    I.pland=tilePath(I,false,9);I.pgrass=tilePath(I,true,8);
    /* palms */
    var cand=[];
    for(var yy=0;yy<GH;yy++)for(var xx=0;xx<GW;xx++){
      if(!I.LAND[yy*GW+xx]||!I.SAND[yy*GW+xx])continue;
      cand.push([xx,yy,hash(xx*7+3+sd,yy*11+5+sd)]);
    }
    cand.sort(function(a,b){return a[2]-b[2];});
    var pmax=Math.round(11*I.scale);
    for(var ci=0;ci<cand.length&&I.palms.length<pmax;ci++){
      var px=cand[ci][0],py=cand[ci][1],ok=true;
      for(var k=0;k<I.palms.length;k++){
        if(Math.abs(I.palms[k].x-px)<4&&Math.abs(I.palms[k].y-py)<4){ok=false;break;}}
      if(!ok)continue;
      I.cells[py*GW+px]={t:'deco'};
      I.palms.push({x:px,y:py,s:0.80+hash(px,py)*0.42,ph:hash(px,py+5)*6.3});
    }
  }
  return I;
}

(function(){

  var SUF=[' Atoll',' Key',' Cay',' Reef',' Rock',' Haven',' Hollow',' Shoal',' Rise',' Cove',' Bank',' Spit'];
  for(var i=0;i<28;i++){

function catByKey(k){for(var i=0;i<CATALOG.length;i++)if(CATALOG[i].key===k)return CATALOG[i];return null;}
/* neighbour NPCs with their own half-built factories and stories */
/* ---------- Portside: the big town island everyone sails to ---------- */
var TOWN_CAT={key:'town',name:'Portside',type:'land',scale:1.34,seed:4242};
var TOWNFOLK=[
 {n:'Mayor Pomp',c1:'#ffd23f',c2:'#ff6b9d',l:['Portside welcomes every islander, however small their factory.','We built the harbour before the bit rush. Now look at us.','Taxes? Never heard of them. Ask the crab.']},
 {n:'Nib the Clerk',c1:'#bfeaff',c2:'#2f7fe0',l:['The bank pays interest while you are away mining.','Coins in the vault are safe from anomalies. Probably.','I count the same drawer nine times a day. It soothes me.']},

  if(BIGKIND[t])s.big=true;                 /* you bought it for the big ones */

function findRegionSpot(I,w,h,tx,ty,needSand){
  var best=null,bs=1e9;
  for(var y=1;y<GH-h;y++)for(var x=1;x<GW-w;x++){
    var ok=true,near=false;
    for(var j=0;j<h&&ok;j++)for(var i=0;i<w;i++){
      if(!I.LAND[(y+j)*GW+x+i]||I.cells[(y+j)*GW+x+i]){ok=false;break;}
      if(I.SAND[(y+j)*GW+x+i])near=true;}
    if(!ok||(needSand&&!near))continue;
    var sc=Math.abs(cx(x)+w*TS/2-tx)+Math.abs(cy(y)+h*TS/2-ty);
    if(sc<bs){bs=sc;best={x:x,y:y};}
  }
  return best;
}

  var others=[[STALL.x+2,STALL.y+1],[PARROT.x,PARROT.y],[LORD.x,LORD.y]];
  function clearance(x,y){
    var m=1e9;
    for(var i=0;i<others.length;i++){
      var d=Math.abs(others[i][0]-x)+Math.abs(others[i][1]-y);
      if(d<m)m=d;
    }
    return m;
  }
  var best=null,bs=-1;
  for(var y=1;y<GH-4;y++)for(var x=1;x<GW-3;x++){
    if(!canPlace('gen',x,y))continue;
    if(!isLand(x,y+3)||HOME.cells[(y+3)*GW+x])continue;   /* room for Volt below it */
    if(HOME.SAND[(y+1)*GW+x])continue;                      /* keep the yard off the beach */
    var sc=clearance(x+1,y+1);
    if(sc>bs){bs=sc;best={x:x,y:y};}
  }
  if(!best){
    for(var y2=1;y2<GH-3&&!best;y2++)for(var x2=1;x2<GW-2&&!best;x2++)
      if(canPlace('gen',x2,y2))best={x:x2,y:y2};

  if(!best)return null;
  var g=place('gen',best.x,best.y,0);
  var spot={x:g.x,y:g.y+3};

/* ---------- picking up and re-siting the islanders ---------- */
var NPCFOOT={stall:[4,2],parrot:[1,1],lord:[1,1],volt:[1,1],emp:[1,1]};
function npcHere(x,y){
  if(CURI.home){
    if(x>=STALL.x&&x<STALL.x+4&&y>=STALL.y&&y<STALL.y+2)return 'stall';
    if(PARROT.x===x&&PARROT.y===y)return 'parrot';
    if(LORD.x===x&&LORD.y===y)return 'lord';
    if(VOLT&&VOLT.x===x&&VOLT.y===y)return 'volt';
  }
  if(CURI.emp&&CURI.emp.x===x&&CURI.emp.y===y)return 'emp';
  return null;
}
function npcCells(key,x,y,val){
  var f=NPCFOOT[key],mark=key==='stall'?'stall':'npc';
  for(var j=0;j<f[1];j++)for(var i=0;i<f[0];i++)
    CURI.cells[(y+j)*GW+(x+i)]=val?{t:mark}:null;
}
function npcOrigin(key){
  if(key==='stall')return [STALL.x,STALL.y];
  if(key==='parrot')return [PARROT.x,PARROT.y];
  if(key==='lord')return [LORD.x,LORD.y];
  if(key==='volt')return [VOLT.x,VOLT.y];
  if(key==='emp')return [CURI.emp.x,CURI.emp.y];
  return null;
}
function npcCanSit(key,x,y){
  var f=NPCFOOT[key];
  for(var j=0;j<f[1];j++)for(var i=0;i<f[0];i++){
    if(!isLand(x+i,y+j))return false;
    if(CURI.cells[(y+j)*GW+(x+i)])return false;
  }
  return true;
}
function npcPlace(key,x,y){
  npcCells(key,x,y,true);
  if(key==='stall'){
    STALL.x=x;STALL.y=y;STALL.wx=cx(x)+TS*2;STALL.wy=cy(y)+TS*2-4;
    M.x=STALL.wx+8*SPR;M.y=STALL.wy-14*SPR;
  }
  else if(key==='parrot'){PARROT.x=x;PARROT.y=y;PARROT.wx=cx(x)+TS/2;PARROT.wy=cy(y)+TS-2;}
  else if(key==='lord'){LORD.x=x;LORD.y=y;LORD.wx=cx(x)+TS/2;LORD.wy=cy(y)+TS-2;}
  else if(key==='volt'){VOLT.x=x;VOLT.y=y;VOLT.wx=cx(x)+TS/2;VOLT.wy=cy(y)+TS-2;}
  else if(key==='emp'){CURI.emp.x=x;CURI.emp.y=y;CURI.emp.wx=cx(x)+TS/2;CURI.emp.wy=cy(y)+TS-2;}
}
function npcPickUp(key){
  var o=npcOrigin(key);
  npcCells(key,o[0],o[1],false);
  S.moveNpc={key:key,ox:o[0],oy:o[1]};
  S.hint='Carrying '+npcLabel(key)+' - left-click to set them down (Esc to cancel)';S.hintT=4;
  beep(520,0.06,'triangle',0.05);
}
function npcLabel(key){
  return key==='stall'?'the mantis stall':key==='parrot'?'the parrot':
         key==='lord'?'the crab landlord':key==='volt'?'Volt':'your island staff';
}
function npcDrop(x,y){
  var mv=S.moveNpc;if(!mv)return false;
  if(!npcCanSit(mv.key,x,y)){S.hint='They will not fit there';S.hintT=2;beep(180,0.08,'sawtooth',0.035);return true;}
  npcPlace(mv.key,x,y);
  S.moveNpc=null;S.hint=npcLabel(mv.key)+' settled in';S.hintT=2.5;
  sparkle(cx(x)+TS/2,cy(y)+TS/2,COL.gold,8);beep(760,0.07,'triangle',0.05);save();
  return true;
}
function npcCancelMove(){
  var mv=S.moveNpc;if(!mv)return;
  npcPlace(mv.key,mv.ox,mv.oy);S.moveNpc=null;
  S.hint='Put them back';S.hintT=2;
}

/* ---------- audio & fx (silenced for background islands) ---------- */
var AC=null;
function beep(f,d,type,vol){
  if(A!==CURI)return;
  try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';
    o.frequency.setValueAtTime(f,AC.currentTime);
    g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.07,AC.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+0.02);}catch(e){}}
function pop(x,y,t,c){if(A!==CURI)return;S.pops.push({x:x,y:y,t:t,c:c||COL.cream,a:1,vy:-26});}
function sparkle(x,y,c,n){if(A!==CURI)return;
  for(var i=0;i<(n||6);i++){var a=Math.random()*6.28,s=20+Math.random()*45;
  S.spark.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,l:0.5+Math.random()*0.4,t:0,c:c||COL.bit});}}

function priceOf(k){return S.price*MULT[k];}

/* ---------- mining ---------- */
function outlets(m){var o=[],wN=sizeW(m.t),hN=sizeH(m.t),i;
  for(i=0;i<wN;i++){o.push([m.x+i,m.y-1,0,-1]);o.push([m.x+i,m.y+hN,0,1]);}
  for(i=0;i<hN;i++){o.push([m.x-1,m.y+i,-1,0]);o.push([m.x+wN,m.y+i,1,0]);}
  return o;}
var TILE_CAP=2;     /* how many items one belt square will hold */
function beltFree(x,y,p){
  var n=0;
  for(var i=0;i<A.items.length;i++){var it=A.items[i];
    if(it.cx!==x||it.cy!==y)continue;
    if(Math.abs(it.p-p)<0.34)return false;
    /* a stopped item parks at p=1, far from the entry point, so the proximity
       test alone let a blocked square swallow items for ever */
    if(++n>=TILE_CAP)return false;
  }
  return true;}
function mineKind(t,big){
  var r=Math.random(),rich=A.rich;
  if(t==='miner')return r<0.07?'anom':(r<0.14?'large':'bit');   /* still the rare large drop */
  if(t==='mini')return r<0.07?'anom':'mini';
  if(t==='sup')return r<0.07?'anom':'sup';
  if(t==='ult')return r<0.07?'anom':'ultra';
  if(t==='lgminer')return r<0.07?'anom':(big?'large':'bit');
  if(t==='lgsup')return r<0.07?'anom':(big?'lsup':'sup');
  if(t==='lgult')return r<0.07?'anom':(big?'lultra':'ultra');
  if(t==='aqua'){
    if(r<0.05)return 'coin';
    if(r<(rich?0.20:0.13))return 'pearl';
    if(r<0.32)return 'shell';
    if(r<0.39)return 'anom';
    if(r<0.50)return 'mini';
    return 'bit';
  }
  /* dredge */
  if(r<0.06)return 'coin';
  if(r<(rich?0.15:0.10))return 'pearl';
  if(r<0.55)return 'shell';
  if(r<0.62)return 'anom';
  return 'mini';
}
var OUT_BUF=8;      /* how much a machine will hold back while its belt is busy */
/* Sort a machine's neighbours into: belts with room right now, belts that exist
   but are momentarily occupied, and bare ground. */
function outletScan(m){
  var o=outlets(m),res={free:[],lane:[],spots:[],all:o};
  for(var i=0;i<o.length;i++){
    var q=o[i],c=cell(q[0],q[1]),takes=false;
    if(c&&c.t==='occ'&&(c.s.t==='sep'||c.s.t==='gen'||c.s.t==='lgen'))takes=true;
    else if(c&&c.t==='belt'&&!(DX[c.dir]===-q[2]&&DY[c.dir]===-q[3]))takes=true;
    if(takes){
      res.lane.push(q);
      if(beltFree(q[0],q[1],0.2))res.free.push(q);
    }
    else if(inGrid(q[0],q[1])&&!c)res.spots.push(q);
  }
  return res;
}
/* put one item straight onto a belt; false if every lane is busy this instant */
function emitNow(m,kind,sc){
  sc=sc||outletScan(m);
  if(!sc.free.length)return false;
  var b=sc.free[(m.k++)%sc.free.length];
  A.items.push({cx:b[0],cy:b[1],p:0.15,kind:kind});
  sparkle(cx(b[0])+TS/2,cy(b[1])+TS/2,kind==='sup'?COL.sup:COL.bit,4);
  return true;
}
/* drain whatever a machine was holding, as soon as a gap comes past */
function flushOut(m){
  if(!m.buf||!m.buf.length)return;
  var sc=outletScan(m),guard=0;
  while(m.buf.length&&sc.free.length&&guard++<8){
    if(!emitNow(m,m.buf[0],sc))break;
    m.buf.shift();
    sc=outletScan(m);
  }
}
function emit(m,kind){
  var sc=outletScan(m);
  if(emitNow(m,kind,sc))return;
  /* A belt IS there, it is just occupied for a moment. Hold the item back and
     drop it in when a gap arrives - miners used to fling it on the floor here,
     which on a busy line meant losing a fifth of everything they dug. */
  if(sc.lane.length){
    if(!m.buf)m.buf=[];
    if(m.buf.length<OUT_BUF){m.buf.push(kind);return;}
  }
  var mx=cx(m.x)+TS*sizeW(m.t)/2,my=cy(m.y)+TS*sizeH(m.t)/2;
  var t=sc.spots.length?sc.spots[Math.floor(Math.random()*sc.spots.length)]
                       :sc.all[Math.floor(Math.random()*sc.all.length)];
  if(A.loose.length<70)A.loose.push({x0:mx,y0:my,
    x1:cx(t[0])+TS/2+(Math.random()*10-5),y1:cy(t[1])+TS/2+(Math.random()*10-5),
    t:0,dur:0.55,land:false,bob:Math.random()*6,x:mx,y:my,z:0,kind:kind});
}
function produce(m){
  m.pop=1;m.puff=1;S.mined++;
  var kind=mineKind(m.t,m.big);
  if(kind==='coin'){
    var v=3+Math.floor(Math.random()*7);
    S.coins+=v;S.pts+=2;
    pop(cx(m.x)+TS*sizeOf(m.t)/2,cy(m.y),'+'+v+'c',COL.gold);
    sparkle(cx(m.x)+TS*sizeOf(m.t)/2,cy(m.y)+TS,COL.gold,5);
    beep(880,0.06,'sine',0.04);return;
  }
  S.pts+=PTS[kind];
  emit(m,kind);beep(700,0.04,'triangle',0.025);
}
function beltInfo(x,y){
  var c=cell(x,y);if(!c)return null;
  if(c.t==='belt')return {dir:c.dir};
  if(c.t==='occ'&&c.s.t==='gate')return {dir:c.s.dir,g:c.s};
  if(c.t==='occ'&&c.s.t==='sep')return {dir:sepPlan(c.s,-1),sep:c.s};
  return null;
}
/* a square that will take an item handed to it from direction d */
function acceptsFrom(x,y,d){
  var c=cell(x,y);
  if(!c)return false;
  if(c.t==='belt')return c.dir!==((d+2)%4);         /* not pointing straight back at us */
  if(c.t==='occ'){
    var k=c.s.t;
    if(k==='sep')return true;
    if(k==='gate')return c.s.dir!==((d+2)%4)||c.s.rdir!==((d+2)%4);
    return k==='seller'||k==='comp'||k==='craft'||k==='kiln'||k==='gw'||k==='gen'||k==='lgen';
  }
  return false;
}
function sepOuts(sp,fromRev){
  var outs=[];
  for(var d=0;d<4;d++){
    if(d===fromRev)continue;                        /* never straight back where it came from */
    if(acceptsFrom(sp.x+DX[d],sp.y+DY[d],d))outs.push(d);
  }
  return outs;
}
/* which way the separator intends to send the item it is holding */
function sepPlan(sp,fromRev){
  var outs=sepOuts(sp,fromRev);
  if(!outs.length){outs=sepOuts(sp,-1);}
  if(!outs.length)return sp.lastOut>=0?sp.lastOut:0;
  return outs[sp.k%outs.length];
}
var SELLER_COOL=1.7,SELLER_LIMIT=6,SELLER_GRACE=8;   /* seconds of safety after a repair */
function sellerTake(se,kind,nx,ny){
  if(se.brk)return false;
  se.heat=(se.heat||0)+1;
  /* Straight after a repair the whole backed-up line arrives at once, which used
     to re-jam it within a second or two - you paid 45c for nothing. Give it a
     grace window to clear the queue and to let you re-plumb the line. */
  if(se.cool>0)se.heat=Math.min(se.heat,SELLER_LIMIT*(A.stab?2:1));
  if(se.cool<=0&&se.heat>SELLER_LIMIT*(A.stab?2:1)){
    se.brk=true;se.why='overload';
    S.hint='An auto seller jammed - too much arriving at once! Split the flow with a SEPARATOR';S.hintT=5;
    sparkle(cx(nx)+TS/2,cy(ny)+TS/2,'#ffb347',10);
    beep(140,0.35,'sawtooth',0.08);
    return false;
  }
  if(kind==='tranq'){
    se.heat=Math.max(0,se.heat-1);
    S.hint='Tranquil ore is a material, not a currency - take it to Ferro in Portside';S.hintT=3.5;
    return false;
  }
  if(kind==='anom'){
    se.dmg++;sparkle(cx(nx)+TS/2,cy(ny)+TS/2,COL.anom2,8);
    if(se.dmg>=se.thr){se.brk=true;se.why='anomaly';S.hint='An anomaly broke an auto seller! Click it to repair (45c)';S.hintT=4;
      beep(120,0.3,'sawtooth',0.07);}
    else beep(200,0.15,'sawtooth',0.05);
    return true;
  }
  var v=Math.max(1,Math.round(priceOf(kind)));
  S.coins+=v;S.sold++;se.lid=1;unlock(kind);
  pop(cx(nx)+TS/2,cy(ny),'+'+v+'c',COL.gold);
  sparkle(cx(nx)+TS/2,cy(ny)+TS/2,COL.gold,5);beep(1180,0.06,'sine',0.05);
  return true;
}
function allGateways(){
  var out=[];
  for(var i=0;i<ISLES.length;i++){var I=ISLES[i];
    if(!I.owned)continue;
    for(var j=0;j<I.structs.length;j++)if(I.structs[j].t==='gw')out.push({s:I.structs[j],isle:I});}
  return out;
}
function handOff(it,idx,nx,ny,d){
  var nb=beltInfo(nx,ny),nc=cell(nx,ny);
  if(nb){it.cx=nx;it.cy=ny;it.p=0;return true;}
  if(nc&&nc.t==='occ'&&nc.s.t==='seller'){
    if(sellerTake(nc.s,it.kind,nx,ny)){A.items.splice(idx,1);return true;}
    it.p=1;return false;
  }
  if(nc&&nc.t==='occ'&&(nc.s.t==='comp'||nc.s.t==='craft'||nc.s.t==='kiln'||nc.s.t==='gw'||nc.s.t==='gen'||nc.s.t==='lgen')){
    it.cx=nx;it.cy=ny;it.p=1;return true;    /* let the normal machine code eat it next tick */
  }
  it.p=1;return false;
}
function updateItems(dt){
  var sp=2.3*(A.stab?1.6:1);
  for(var i=A.items.length-1;i>=0;i--){
    var it=A.items[i],bi=beltInfo(it.cx,it.cy);
    if(!bi){
      var c0=cell(it.cx,it.cy);
      if(c0&&c0.t==='occ'&&c0.s.t==='gate')continue;
      A.items.splice(i,1);continue;
    }
    it.p+=sp*dt;
    if(it.p>=1){
      /* a redirector only ever sends the item the scanner picked out */
      var useDir=bi.dir;
      if(bi.g){
        var mi=it.mk?it.mk.indexOf(bi.g):-1;
        if(mi>=0){useDir=bi.g.rdir;bi.g.flash=1;it.mk.splice(mi,1);}
      }
      if(bi.sep){
        /* NB: do not name anything 'sp' here - that is the belt speed in this scope */
        var sepS=bi.sep,rev=(it.from===undefined)?-1:((it.from+2)%4);
        var outs=sepOuts(sepS,rev);
        if(!outs.length)outs=sepOuts(sepS,-1);
        if(!outs.length){it.p=1;continue;}
        var moved=false;
        for(var o=0;o<outs.length;o++){
          var d2=outs[(sepS.k+o)%outs.length];
          var tx=sepS.x+DX[d2],ty=sepS.y+DY[d2];
          if(beltInfo(tx,ty)&&!beltFree(tx,ty,0))continue;   /* that lane is busy right now */
          sepS.k=(sepS.k+o+1)%Math.max(1,outs.length);
          sepS.lastOut=d2;sepS.pulse=1;sepS.spin+=1.2;
          it.from=d2;
          handOff(it,i,tx,ty,d2);
          moved=true;break;
        }
        if(!moved)it.p=1;
        continue;
      }
      var nx=it.cx+DX[useDir],ny=it.cy+DY[useDir],nb=beltInfo(nx,ny),nc=cell(nx,ny);
      if(nb){ if(beltFree(nx,ny,0)){it.cx=nx;it.cy=ny;it.p-=1;it.from=useDir;} else it.p=1; }
      else if(nc&&nc.t==='occ'&&nc.s.t==='seller'){
        if(sellerTake(nc.s,it.kind,nx,ny))A.items.splice(i,1);
        else it.p=1;
      }
      else if(nc&&nc.t==='occ'&&nc.s.t==='gw'){
        var gws=allGateways(),gi=-1;
        for(var g2=0;g2<gws.length;g2++)if(gws[g2].s===nc.s){gi=g2;break;}
        var pt=gws.length>1?gws[(gi+1)%gws.length]:null;
        A.items.splice(i,1);
        sparkle(cx(nc.s.x)+TS*1.5,cy(nc.s.y)+TS*1.5,COL.bit,6);
        if(pt){
          var back=A;A=pt.isle;
          emit(pt.s,it.kind);
          sparkle(cx(pt.s.x)+TS*1.5,cy(pt.s.y)+TS*1.5,COL.bit2,6);
          A=back;
          beep(980,0.07,'sine',0.04);
        }
        else emit(nc.s,it.kind);
      }
      else if(nc&&nc.t==='occ'&&(nc.s.t==='gen'||nc.s.t==='lgen')){
        var gg=nc.s;A.items.splice(i,1);
        var got=feedGen(gg,it.kind,1);
        pop(cx(nx)+TS/2,cy(ny),'+'+got.toFixed(1)+' fuel','#ffd23f');
        sparkle(cx(nx)+TS/2,cy(ny)+TS/2,'#ffb347',4);
        beep(300+got*20,0.06,'square',0.04);
      }
      else if(nc&&nc.t==='occ'&&nc.s.t==='comp'){
        var cs=nc.s;A.items.splice(i,1);
        if(it.kind==='mini'){cs.buf.mini++;
          if(cs.buf.mini>=4){cs.buf.mini-=4;cs.press=1;emit(cs,'bit');
            pop(cx(cs.x)+TS,cy(cs.y),'+1 bit',COL.bit2);beep(520,0.08,'square',0.05);}}
        else if(it.kind==='bit'){cs.buf.bit++;
          if(cs.buf.bit>=9){cs.buf.bit-=9;cs.press=1;emit(cs,'sup');
            pop(cx(cs.x)+TS,cy(cs.y),'+1 SUPER BIT',COL.sup2);
            sparkle(cx(cs.x)+TS,cy(cs.y)+TS,COL.sup,10);beep(660,0.1,'square',0.06);}}
        else emit(cs,it.kind);
      }
      else if(nc&&nc.t==='occ'&&nc.s.t==='kiln'){
        var kl=nc.s;A.items.splice(i,1);
        if(it.kind==='anom'||it.kind==='tranq')emit(kl,it.kind);
        else{kl.prog+=(MULT[it.kind]||0);kl.heat2=1;
          if(kl.prog>=KILN_COST){kl.prog-=KILN_COST;kl.made=1;emit(kl,'tranq');
            pop(cx(kl.x)+TS,cy(kl.y),'+1 TRANQUIL ORE','#7fe8d8');
            sparkle(cx(kl.x)+TS,cy(kl.y)+TS,'#7fe8d8',10);beep(430,0.13,'triangle',0.06);}}
      }
      else if(nc&&nc.t==='occ'&&nc.s.t==='craft'){
        var cf=nc.s;A.items.splice(i,1);
        if(it.kind==='anom')emit(cf,'anom');
        else{cf.prog+=MULT[it.kind];
          var rc=RECIPES[cf.ri];
          if(cf.prog>=rc[1]){cf.prog-=rc[1];S.stock[rc[0]]++;cf.made=1;
            pop(cx(cf.x)+TS,cy(cf.y),itemName(rc[0])+' crafted!',COL.gold);
            sparkle(cx(cf.x)+TS,cy(cf.y)+TS,COL.gold,10);beep(760,0.09,'triangle',0.06);}}
      }
      else if(nc){it.p=1;}
      else{
        A.items.splice(i,1);
        if(A.loose.length<70){var lx=cx(it.cx)+TS/2,ly=cy(it.cy)+TS/2;
          A.loose.push({x0:lx,y0:ly,x1:lx+DX[useDir]*18,y1:ly+DY[useDir]*18,t:0,dur:0.35,
            land:false,bob:0,x:lx,y:ly,z:0,kind:it.kind});}
      }
    }
  }
}
function updateLoose(dt){
  for(var i=A.loose.length-1;i>=0;i--){var l=A.loose[i];
    if(!l.land){l.t+=dt;var u=clamp(l.t/l.dur,0,1);
      l.x=l.x0+(l.x1-l.x0)*u;l.y=l.y0+(l.y1-l.y0)*u;l.z=Math.sin(u*Math.PI)*22;
      if(u>=1){l.land=true;l.z=0;
        var gx=Math.floor((l.x-OX)/TS),gy=Math.floor((l.y-OY)/TS);
        if(beltInfo(gx,gy)){A.items.push({cx:gx,cy:gy,p:0.5,kind:l.kind});A.loose.splice(i,1);continue;}
        sparkle(l.x,l.y,l.kind==='sup'?COL.sup:COL.bit,3);}
    } else {l.bob+=dt*3;l.z=Math.abs(Math.sin(l.bob))*1.5;}
  }
}
function kindMatch(filt,k){return filt==='any'||filt===k;}
/* Tag the exact item the scanner is looking at, for each redirector it drives.
   A bare armed flag used to be claimed by whichever item reached the gate first,
   so on a busy belt the wrong thing got pulled aside - usually a plain bit while
   the anomaly you were filtering for sailed straight through. */
function scanDetect(sc){
  var fx=sc.x+DX[sc.dir],fy=sc.y+DY[sc.dir],i,g,gs,found=false;
  for(i=0;i<A.items.length;i++){
    var it=A.items[i];
    if(it.cx!==fx||it.cy!==fy||!kindMatch(sc.filt,it.kind))continue;
    found=true;
    for(g=0;g<sc.gates.length;g++){
      gs=structAt(sc.gates[g][0],sc.gates[g][1]);
      if(!gs||gs.t!=='gate')continue;
      if(!it.mk)it.mk=[];
      if(it.mk.indexOf(gs)<0)it.mk.push(gs);
    }
  }
  for(i=0;i<A.loose.length;i++){var l=A.loose[i];
    if(l.land&&Math.floor((l.x-OX)/TS)===fx&&Math.floor((l.y-OY)/TS)===fy&&kindMatch(sc.filt,l.kind))found=true;}
  return found;
}
function updateScanners(dt){
  var i,j;
  for(j=0;j<A.structs.length;j++){var g0=A.structs[j];
    if(g0.t==='gate'){g0.flash=Math.max(0,(g0.flash||0)-dt*2);g0.armed=false;}
  }
  /* tag on every tick - a solid stream of items used to give one rising edge
     and then nothing, so only the first item of a run was ever redirected */
  for(i=0;i<A.structs.length;i++){var sc=A.structs[i];
    if(sc.t==='scan'){sc.det=scanDetect(sc);sc.wasDet=sc.det;}
  }
  /* a redirector reads as armed while something is on its way to it */
  for(i=0;i<A.items.length;i++){
    var mk=A.items[i].mk;
    if(!mk)continue;
    for(j=0;j<mk.length;j++)mk[j].armed=true;
  }
}

/* ---------- share codes: islands + gifts (works over any chat app) ---------- */
function encodeCode(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/=+$/,'');}
function decodeCode(str){try{return JSON.parse(decodeURIComponent(escape(atob(str.trim()))));}catch(e){return null;}}
function isleCode(I){
  var belts=[];
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var c=I.cells[y*GW+x];
    if(c&&c.t==='belt')belts.push([x,y,c.dir]);}
  return encodeCode({t:'isle',n:I.name,c:I.cat,b:belts,
    s:I.structs.map(function(o){return [o.t,o.x,o.y,o.dir];}),
    p:I.palms.map(function(a){return [a.x,a.y];})});
}
function dropTempIsles(){
  for(var i=ISLES.length-1;i>=1;i--)if(!ISLES[i].owned)ISLES.splice(i,1);
  if(S.isle>=ISLES.length)gotoIsle(0);
}
function visitCode(code){
  var d=decodeCode(code);
  if(!d||d.t!=='isle'){S.hint='That is not an island code';S.hintT=3;beep(160,0.1,'sawtooth',0.04);return;}
  var cat=catByKey(d.c)||{key:'home',name:'Friend Island',type:'land',scale:1,seed:0};
  var I=genIsle(cat);I.owned=false;I.guest=true;I.name=(d.n||'Friend')+' (visiting)';
  var back=A;A=I;
  for(var q=0;q<GW*GH;q++){var cq=I.cells[q];if(cq&&(cq.t==='belt'||cq.t==='occ'))I.cells[q]=null;}
  I.structs=[];
  if(d.p){var keep={};d.p.forEach(function(a){keep[a[0]+','+a[1]]=1;});
    for(var pi=I.palms.length-1;pi>=0;pi--){var pp=I.palms[pi];
      if(!keep[pp.x+','+pp.y]){I.cells[pp.y*GW+pp.x]=null;I.palms.splice(pi,1);}}}
  (d.s||[]).forEach(function(a){if(canPlace(a[0],a[1],a[2]))place(a[0],a[1],a[2],a[3]||0);});
  (d.b||[]).forEach(function(a){if(inGrid(a[0],a[1])&&!I.cells[a[1]*GW+a[0]])I.cells[a[1]*GW+a[0]]={t:'belt',dir:a[2]};});
  A=back;
  dropTempIsles();ISLES.push(I);gotoIsle(ISLES.length-1);
  S.land=false;S.hint='Visiting '+(d.n||'a friend')+"'s island - look, don't touch!";S.hintT=4;
  beep(760,0.08,'triangle',0.05);
}
function giftCode(kind,amt){
  return encodeCode({t:'gift',k:kind,a:amt,id:Math.random().toString(36).slice(2,10)});
}
function redeemGift(code){
  var d=decodeCode(code);
  if(!d||d.t!=='gift'){S.hint='That is not a gift code';S.hintT=3;beep(160,0.1,'sawtooth',0.04);return;}
  var used={};try{used=JSON.parse(localStorage.getItem('bm_gifts')||'{}');}catch(e){}
  if(d.id&&used[d.id]){S.hint='That gift was already opened';S.hintT=3;return;}
  if(d.k==='coins')S.coins+=Math.max(0,Math.min(5000,d.a|0));
  else if(S.bag[d.k]!==undefined)gain(d.k,Math.max(0,Math.min(999,d.a|0)));
  else return;
  if(d.id){used[d.id]=1;try{localStorage.setItem('bm_gifts',JSON.stringify(used));}catch(e){}}
  var what=d.k==='coins'?(d.a+' coins'):(d.a+' '+KINDNAME[d.k].toLowerCase());
  S.hint='A gift! You received '+what;S.hintT=4;
  pop(W/2,H/2,'+'+what,COL.gold);
  beep(700,0.07,'triangle',0.06);setTimeout(function(){beep(1050,0.09,'triangle',0.06);},90);save();
}

function gotoIsle(i){
  i=clamp(i,0,ISLES.length-1);

function buyIsle(cat){
  if(isOwned(cat.key)){S.hint='You already own '+cat.name;S.hintT=2;return;}
  if(S.coins<cat.price){S.hint='Not enough coins for '+cat.name;S.hintT=2.5;beep(160,0.12,'sawtooth',0.04);return;}
  S.coins-=cat.price;
  var I=genIsle(cat);
  ISLES.push(I);
  /* every island comes with 2 gateways, a large generator with an employee, and a concierge */
  var back=A;A=I;
  function drop(kind,cxr,cyr){
    for(var r=0;r<14;r++)for(var yy=cyr-r;yy<=cyr+r;yy++)for(var xx=cxr-r;xx<=cxr+r;xx++){
      if(canPlace(kind,xx,yy)){return place(kind,xx,yy,0);}}
    return null;
  }
  drop('gw',Math.round(GW/2)-1,Math.round(GH/2)-1);
  var lg=drop('lgen',Math.round(GW/2)+6,Math.round(GH/2)-1);
  if(lg){
    var emp=EMPLOYEES[ISLES.length%EMPLOYEES.length];
    I.emp={name:emp.name,c1:emp.c1,c2:emp.c2,x:lg.x,y:lg.y+sizeH('lgen'),
      wx:cx(lg.x)+TS,wy:cy(lg.y)+TS*(sizeH('lgen')+0.9)};
  }
  drop('crab',Math.round(GW/2)-7,Math.round(GH/2)+3);
  A=back;
  S.stock.gw++;
  S.hint=cat.name+' is yours! It has a gateway - place your free one to link it';S.hintT=5;
  chaChing(true);
  save();
}

  if(kind==='sup'||kind==='lsup'){body1=COL.sup2;body2='#8b3fe8';edge='#4a1a86';glowc=COL.sup;}

  if(kind==='anom'){body1='#8d7a9e';body2='#463a52';edge='#241d2e';glowc=COL.anom2;}
  if(glow!==false){X.globalAlpha=0.30;X.fillStyle=glowc;
    X.beginPath();X.arc(0,0,9,0,6.3);X.fill();X.globalAlpha=1;}
  var g3=X.createLinearGradient(-6,-8,6,8);g3.addColorStop(0,body1);g3.addColorStop(1,body2);
  X.beginPath();X.moveTo(0,-8);X.lineTo(5.5,-2);X.lineTo(3,7);X.lineTo(-3,7);X.lineTo(-5.5,-2);X.closePath();
  X.fillStyle=g3;X.fill();X.strokeStyle=edge;X.lineWidth=1.6;X.stroke();
  X.fillStyle='rgba(255,255,255,.8)';X.beginPath();X.moveTo(-1.6,-5.6);X.lineTo(1.2,-3.2);X.lineTo(-0.6,2.4);X.lineTo(-2.6,-1.4);X.closePath();X.fill();
  if((kind==='sup'||kind==='lsup'||kind==='ultra'||kind==='lultra')&&(T*2+px*0.13+py*0.07)%1<0.22){
    X.strokeStyle=(kind==='ultra'||kind==='lultra')?'#ffdada':'#f2e3ff';X.lineWidth=1.3;X.lineCap='round';
    for(var z=0;z<2;z++){var a=hash(Math.floor(T*4),z+px)*6.28;
      var zx=Math.cos(a)*8,zy=Math.sin(a)*8;
      X.beginPath();X.moveTo(zx*0.5,zy*0.5);X.lineTo(zx*0.8+2,zy*0.8-2);X.lineTo(zx*1.3,zy*1.3);X.stroke();}
  }
  if(kind==='anom'&&(T*3+px*0.11)%1<0.3){
    X.globalAlpha=0.6;X.fillStyle=COL.anom2;
    X.fillRect(-6,-2+Math.sin(T*30)*3,12,1.6);X.globalAlpha=1;
  }
  X.restore();
}

/* ---------- flat tiles ---------- */
function drawBelt(x,y,c){
  X.save();X.translate(cx(x)+TS/2,cy(y)+TS/2);X.rotate(c.dir*Math.PI/2);X.scale(SPR,SPR);
  rr(-16,-16,32,32,7);fill('#4a4560');line(COL.dark,2.5);
  X.fillStyle='#37324c';X.fillRect(-15,-14,30,5);X.fillRect(-15,9,30,5);
  var ph=(T*2.0+(x*7+y*13)%5*0.13)%1;
  var ax=-9+18*ph;
  X.globalAlpha=Math.sin(ph*Math.PI);
  X.strokeStyle=COL.gold;X.lineWidth=3.5;X.lineCap='round';
  X.beginPath();X.moveTo(ax-4,-6);X.lineTo(ax+3,0);X.lineTo(ax-4,6);X.stroke();
  X.globalAlpha=1;
  X.restore();
}
function drawGwFlat(g){
  var Wp=TS*3;
  X.save();X.translate(cx(g.x)+Wp/2,cy(g.y)+Wp/2);
  rr(-Wp/2+2,-Wp/2+2,Wp-4,Wp-4,10);fill('#7d8698');line(COL.dark,3);
  rr(-Wp/2+7,-Wp/2+7,Wp-14,Wp-14,7);fill('#8b93a8');
  X.strokeStyle='rgba(0,0,0,.22)';X.lineWidth=1.5;X.stroke();
  X.beginPath();X.moveTo(-Wp/2+7,0);X.lineTo(Wp/2-7,0);
  X.moveTo(0,-Wp/2+7);X.lineTo(0,Wp/2-7);X.stroke();
  for(var i=-1;i<=1;i+=2)for(var j=-1;j<=1;j+=2){

    X.strokeStyle=COL.dark;X.lineWidth=1.5;X.stroke();}
  X.globalAlpha=0.25+0.12*Math.sin(T*2.6+g.x);X.fillStyle=COL.bit;
  X.beginPath();X.ellipse(0,6,20,8,0,0,6.3);X.fill();X.globalAlpha=1;

}
function drawSepFlat(sp){
  X.save();X.translate(cx(sp.x)+TS/2,cy(sp.y)+TS/2);X.scale(SPR,SPR);
  rr(-16,-16,32,32,7);fill('#4b5a53');line(COL.dark,2.5);
  /* four mouths */
  for(var d=0;d<4;d++){
    X.save();X.rotate(d*1.5708);
    var live=acceptsFrom(sp.x+DX[d],sp.y+DY[d],d);
    rr(-6,-16,12,7,3);fill(live?'#7ce7a2':'#39463f');line(COL.dark,1.6);
    X.restore();
  }
  /* spinning splitter vane */
  X.save();X.rotate(sp.spin+T*0.6);
  X.strokeStyle='#cfe8d8';X.lineWidth=3;X.lineCap='round';
  X.beginPath();X.moveTo(-8,0);X.lineTo(8,0);X.moveTo(0,-8);X.lineTo(0,8);X.stroke();
  X.restore();
  X.beginPath();X.arc(0,0,4.5,0,6.3);fill('#7ce7a2');line(COL.dark,2);
  if(sp.pulse>0&&sp.lastOut>=0){
    X.save();X.rotate(sp.lastOut*1.5708);
    X.globalAlpha=sp.pulse*0.9;X.strokeStyle=COL.gold;X.lineWidth=3.5;X.lineCap='round';
    X.beginPath();X.moveTo(3,-5);X.lineTo(10,0);X.lineTo(3,5);X.stroke();X.globalAlpha=1;
    X.restore();

function drawGateFlat(g){
  X.save();X.translate(cx(g.x)+TS/2,cy(g.y)+TS/2);X.scale(SPR,SPR);
  rr(-16,-16,32,32,7);fill('#3f4a58');line(COL.dark,2.5);
  for(var c4=0;c4<4;c4++){

    X.restore();
  }
  /* the way items normally leave */
  X.save();X.rotate(g.dir*Math.PI/2);
  X.globalAlpha=0.55;X.strokeStyle='#9fb3c9';X.lineWidth=3;X.lineCap='round';
  X.beginPath();X.moveTo(-2,-5);X.lineTo(5,0);X.lineTo(-2,5);X.stroke();X.globalAlpha=1;
  X.restore();
  /* the detour it takes when the scanner fires */
  X.save();X.rotate(g.rdir*Math.PI/2);

  X.lineWidth=4;X.lineCap='round';X.lineJoin='round';
  X.beginPath();X.moveTo(-9,0);X.lineTo(2,0);X.lineTo(2,0);X.stroke();
  X.beginPath();X.moveTo(4,-6);X.lineTo(11,0);X.lineTo(4,6);X.stroke();
  X.globalAlpha=1;X.restore();
  if(g.armed){
    X.globalAlpha=0.25+0.2*Math.sin(T*8);X.fillStyle=COL.gold;
    rr(-16,-16,32,32,7);X.fill();X.globalAlpha=1;

}
function drawScanFlat(sc){

  X.beginPath();X.moveTo(0,0);X.lineTo(Math.cos(a)*8,Math.sin(a)*8);X.stroke();

  X.beginPath();X.arc(11,-11,3,0,6.3);X.fill();

/* ---------- upright sprites ---------- */
function shadow(w2,h2){X.globalAlpha=0.20;X.fillStyle='#000';
  X.beginPath();X.ellipse(0,0,w2,h2,0,0,6.3);X.fill();X.globalAlpha=1;}
function drawMinerBody(m,bodyC,topC,energy,heavy){
  var b=Math.sin(T*2+m.x)*1.0,i;
  var jolt=(m.pop||0);
  shadow(heavy?34:30,heavy?10:9);
  X.save();
  X.translate(Math.sin(T*34+m.x)*jolt*0.8,-30+b);
  var HW=heavy?31:27;                       /* half-width of the hull */
  var mx=HW-15;                             /* where the mast and drill sit */
  var stroke=Math.sin(T*2.6+m.x*0.7)*3.5;   /* the string riding up and down */
  var top=heavy?-70:-60;

  /* ---- drive skirt with an underglow ---- */
  X.fillStyle='#211f36';rr(-HW,10,HW*2,15,7);X.fill();line(COL.dark,2.6);
  for(i=0;i<3;i++){
    rr(-HW+5+i*((HW*2-16)/3),12,(HW*2-22)/3,10,3);fill('#3a3557');line(COL.dark,1.8);
  }
  X.globalAlpha=0.45+0.25*Math.sin(T*2.4+m.x);
  X.fillStyle=energy;rr(-HW+7,23,HW*2-14,3,1.5);X.fill();
  X.globalAlpha=1;

  /* ---- angular hull ---- */
  X.beginPath();
  X.moveTo(-HW+3,-13);X.lineTo(HW-3,-13);X.lineTo(HW+1,-2);
  X.lineTo(HW-5,11);X.lineTo(-HW+5,11);X.lineTo(-HW-1,-2);X.closePath();
  fill(bodyC);line(COL.dark,3);
  X.save();
  X.beginPath();
  X.moveTo(-HW+3,-13);X.lineTo(HW-3,-13);X.lineTo(HW+1,-2);
  X.lineTo(HW-5,11);X.lineTo(-HW+5,11);X.lineTo(-HW-1,-2);X.closePath();X.clip();
  X.fillStyle=topC;X.fillRect(-HW-2,-13,HW*2+4,7);
  X.fillStyle='rgba(0,0,0,.22)';
  for(i=0;i<4;i++)X.fillRect(-HW+8+i*7,4,3.4,7);
  X.restore();
  /* the seam of light down the flank */
  X.globalAlpha=0.8;X.fillStyle=energy;rr(-HW+6,-2.4,HW*2-12,2.6,1.3);X.fill();X.globalAlpha=1;

  /* ---- tinted canopy, no eye ---- */
  X.beginPath();
  X.moveTo(-HW+2,-13);X.lineTo(-HW+7,-28);X.lineTo(-HW+26,-28);X.lineTo(-HW+30,-13);X.closePath();
  fill('#33314f');line(COL.dark,3);
  X.save();
  X.beginPath();
  X.moveTo(-HW+5,-14.5);X.lineTo(-HW+9.5,-26);X.lineTo(-HW+23.5,-26);X.lineTo(-HW+27,-14.5);X.closePath();
  X.clip();
  var gcan=X.createLinearGradient(-HW+7,-26,-HW+26,-14);
  gcan.addColorStop(0,'#1c2a4a');gcan.addColorStop(0.55,'#2b4f7a');gcan.addColorStop(1,'#121c33');
  X.fillStyle=gcan;X.fillRect(-HW+3,-27,30,14);
  /* a scanline sweeping across the glass */
  var sw=((T*0.5+m.x*0.13)%1)*30-4;
  X.globalAlpha=0.42;X.fillStyle=energy;
  X.fillRect(-HW+3+sw,-27,3.5,14);
  X.globalAlpha=0.22;X.fillStyle='#ffffff';
  X.beginPath();X.moveTo(-HW+9,-14.5);X.lineTo(-HW+15,-26);X.lineTo(-HW+19,-26);X.lineTo(-HW+13,-14.5);X.closePath();X.fill();
  X.globalAlpha=1;X.restore();
  X.strokeStyle=COL.dark;X.lineWidth=2;
  X.beginPath();
  X.moveTo(-HW+5,-14.5);X.lineTo(-HW+9.5,-26);X.lineTo(-HW+23.5,-26);X.lineTo(-HW+27,-14.5);X.closePath();X.stroke();
  /* status pips along the canopy rail */
  for(i=0;i<3;i++){
    X.globalAlpha=(((T*1.6+i*0.33)%1)<0.5)?0.95:0.35;
    X.fillStyle=i===1?energy:COL.gold;
    X.beginPath();X.arc(-HW+11+i*6,-30.5,1.7,0,6.3);X.fill();
  }
  X.globalAlpha=1;
  /* vent fin, flaring when it bites */
  rr(-HW+31,-36,7,11,2.5);fill('#4a4566');line(COL.dark,2.2);
  if(m.puff>0){
    for(i=0;i<3;i++){var tp=(1-m.puff)+i*0.17;if(tp<0||tp>1)continue;
      X.globalAlpha=0.5*(1-tp);X.fillStyle=energy;
      X.beginPath();X.arc(-HW+34.5,-40-tp*22,2.2+tp*5,0,6.3);X.fill();}
    X.globalAlpha=1;
  }

  /* ---- the mast: tapered pylons with containment rings ---- */
  /* a stiff braced A-frame */
  X.strokeStyle='#5f5c80';X.lineWidth=4.6;X.lineCap='round';X.lineJoin='round';
  X.beginPath();X.moveTo(mx-13,-11);X.lineTo(mx-5,top);
  X.moveTo(mx+13,-11);X.lineTo(mx+5,top);X.stroke();
  X.strokeStyle='#8a83ad';X.lineWidth=1.8;
  X.beginPath();X.moveTo(mx-13,-11);X.lineTo(mx-5,top);
  X.moveTo(mx+13,-11);X.lineTo(mx+5,top);X.stroke();
  /* angled bracing */
  X.strokeStyle='#4a4566';X.lineWidth=2.6;
  for(i=0;i<4;i++){
    var u0=i/4,u1=(i+1)/4;
    var y0=-11+(top+11)*u0,y1=-11+(top+11)*u1;
    var w0=13-8*u0,w1=13-8*u1;
    X.beginPath();
    X.moveTo(mx+(i%2?w0:-w0),y0);X.lineTo(mx+(i%2?-w1:w1),y1);X.stroke();
  }
  /* a shoulder strut tying the mast into the hull */
  X.strokeStyle='#5f5c80';X.lineWidth=3.4;
  X.beginPath();X.moveTo(mx-13,-11);X.lineTo(mx-22,-4);X.stroke();
  /* two containment rings, quietly pulsing */
  for(i=0;i<2;i++){
    var ry=-20-i*((Math.abs(top)-24)/2),rw=11-i*3.4;
    X.globalAlpha=0.30+0.35*Math.abs(Math.sin(T*2.6-i*0.7+m.x));
    X.strokeStyle=energy;X.lineWidth=2.4;
    X.beginPath();X.ellipse(mx,ry,rw,3,0,0,6.3);X.stroke();
  }
  X.globalAlpha=1;
  /* emitter head */
  rr(mx-10,top-9,20,9,3.5);fill('#4a4566');line(COL.dark,2.5);
  rr(mx-13,top-12,26,4,2);fill('#5f5c80');line(COL.dark,2.2);
  X.globalAlpha=0.55+0.4*Math.sin(T*4+m.x);
  X.fillStyle=energy;X.beginPath();X.arc(mx,top-4.5,3.2,0,6.3);X.fill();
  X.globalAlpha=1;

  /* ---- drill column ---- */
  X.strokeStyle='#8d95a8';X.lineWidth=5.5;X.lineCap='butt';
  X.beginPath();X.moveTo(mx,top-2);X.lineTo(mx,15+stroke);X.stroke();
  X.strokeStyle='rgba(255,255,255,.30)';X.lineWidth=1.6;
  X.beginPath();X.moveTo(mx-1.6,top-2);X.lineTo(mx-1.6,15+stroke);X.stroke();
  /* collars of light sliding down the column */
  for(i=0;i<3;i++){
    var cy2=top+14+(((T*26+i*22)%(Math.abs(top)+14)));
    if(cy2>12+stroke)continue;
    X.globalAlpha=0.5;X.strokeStyle=energy;X.lineWidth=2;
    X.beginPath();X.ellipse(mx,cy2,4.4,1.6,0,0,6.3);X.stroke();
  }
  X.globalAlpha=1;
  /* rotary head riding the mast */
  rr(mx-10,-16+stroke,20,11,4);fill('#4a4566');line(COL.dark,2.6);
  X.globalAlpha=0.85;X.fillStyle=energy;rr(mx-7,-13+stroke,14,2.6,1.3);X.fill();X.globalAlpha=1;

  /* ---- the bit ---- */
  X.save();X.translate(mx,15+stroke);
  var bl=heavy?19:16,bw=heavy?8:7;
  X.beginPath();
  X.moveTo(-bw,0);X.lineTo(bw,0);X.lineTo(bw*0.48,bl*0.55);X.lineTo(0,bl);X.lineTo(-bw*0.48,bl*0.55);X.closePath();
  var gbit=X.createLinearGradient(-bw,0,bw,bl);
  gbit.addColorStop(0,'#dfe6f2');gbit.addColorStop(1,'#5f6884');
  X.fillStyle=gbit;X.fill();line(COL.dark,2.5);
  X.save();
  X.beginPath();
  X.moveTo(-bw,0);X.lineTo(bw,0);X.lineTo(bw*0.48,bl*0.55);X.lineTo(0,bl);X.lineTo(-bw*0.48,bl*0.55);X.closePath();X.clip();
  X.strokeStyle=energy;X.lineWidth=2.2;X.lineCap='round';X.globalAlpha=0.9;
  for(i=0;i<4;i++){
    var ph=(((m.spin||0)*0.30+i/4)%1),fy=ph*bl,fw=bw*(1-ph*0.92);
    X.beginPath();X.moveTo(-fw-1,fy);X.quadraticCurveTo(0,fy+3.2,fw+1,fy);X.stroke();
  }
  X.globalAlpha=1;X.restore();
  /* the tip, glowing where it cuts */
  X.globalAlpha=0.30+0.20*Math.sin(T*9+m.x);
  X.fillStyle=energy;X.beginPath();X.arc(0,bl-2,2.8,0,6.3);X.fill();
  X.globalAlpha=1;
  X.fillStyle='#ffffff';X.beginPath();X.arc(0,bl-2,1.3,0,6.3);X.fill();
  X.restore();

  /* ---- the bore: a lit ring in the ground ---- */
  var gy=15+stroke+(heavy?19:16);
  X.fillStyle='rgba(0,0,0,.28)';
  X.beginPath();X.ellipse(mx,gy-2,11,3.6,0,0,6.3);X.fill();
  X.globalAlpha=0.18+0.16*Math.abs(Math.sin(T*3+m.x));
  X.strokeStyle=energy;X.lineWidth=2;
  X.beginPath();X.ellipse(mx,gy-2,13,4.4,0,0,6.3);X.stroke();
  X.globalAlpha=1;
  /* a little cut rock at the collar, so it reads as digging */
  X.fillStyle='#6f6a58';
  X.beginPath();X.moveTo(mx-11,gy);X.quadraticCurveTo(mx-5,gy-4.5,mx,gy-1.5);
  X.quadraticCurveTo(mx+5,gy-4.5,mx+11,gy);X.closePath();X.fill();line(COL.dark,1.6);
  if(jolt>0){
    X.globalAlpha=0.8*jolt;X.fillStyle=energy;
    for(i=0;i<5;i++){
      var ga=hash(i,Math.floor(T*9))*3.14+3.14,gd=6+jolt*17;
      X.beginPath();X.arc(mx+Math.cos(ga)*gd,gy-4+Math.sin(ga)*gd*0.5,1.7,0,6.3);X.fill();
    }
    X.globalAlpha=1;
  }
  X.restore();
}

      var zx=8+Math.cos(a)*30,zy=-50+Math.sin(a)*24;

function drawSuper(m){
  drawMinerBody(m,'#7b3fd6','#a06ff0','#e7c9ff');
  drawBigBadge(m);
  if((T*2+m.x)%1<0.25){

function drawDyson(d){
  var b=Math.sin(T*1.2+d.x)*1.4,i;
  var tint=d.star==='ustar'?'#ff9a4d':(d.star==='sstar'?'#9fd0ff':'#8d88b5');
  var core=d.star==='ustar'?'#ffdf9a':(d.star==='sstar'?'#cfe6ff':'#4a4566');
  shadow(44,13);
  X.save();X.translate(0,-48+b);
  /* the plinth it is cradled on */
  rr(-40,28,80,16,6);fill('#6d7484');line(COL.dark,3);
  X.fillStyle='rgba(255,255,255,.14)';rr(-40,28,80,5,6);X.fill();
  for(i=0;i<3;i++){rr(-30+i*24,20,12,10,3);fill('#565d6d');line(COL.dark,2);}
  /* the star's halo */
  if(d.star){
    X.globalAlpha=0.18+0.12*Math.sin(T*3)+0.28*(d.flare||0);
    X.fillStyle=tint;X.beginPath();X.arc(0,0,46,0,6.3);X.fill();X.globalAlpha=1;
  }
  var R=32;
  /* the star burning inside, seen through the shell */
  if(d.star){
    X.save();X.beginPath();X.arc(0,0,R-2,0,6.3);X.clip();
    drawStarArt(d.star,R*0.62);
    X.restore();
  } else {
    var gsp=X.createRadialGradient(-4,-6,2,0,0,R-4);
    gsp.addColorStop(0,'#5a5480');gsp.addColorStop(0.4,core);gsp.addColorStop(1,'#2f2b4a');
    X.fillStyle=gsp;X.beginPath();X.arc(0,0,R-3,0,6.3);X.fill();
  }
  /* the shell: latitude bands of gold panels, drawn as a globe */
  var spin=d.ring*0.5;
  X.save();
  X.beginPath();X.arc(0,0,R,0,6.3);X.clip();
  for(var la=-2;la<=2;la++){
    var cyy=la*11.5, hw=Math.sqrt(Math.max(0,R*R-cyy*cyy)), ph=9.4;
    var n=7;
    for(i=0;i<n;i++){
      /* panels slide round the globe, so the sphere looks like it is turning */
      var u=((i/n)+spin*0.09+la*0.07)%1;
      var ang=u*6.283;
      var xx=Math.sin(ang)*hw;
      if(Math.cos(ang)<0)continue;                 /* back of the sphere */
      var wgt=Math.cos(ang);
      var pw=(hw*2/n)*0.92*wgt+1.4;
      X.globalAlpha=0.55+0.45*wgt;

  gl.addColorStop(0,'rgba(255,255,255,.30)');gl.addColorStop(1,'rgba(255,255,255,0)');
  X.fillStyle=gl;X.beginPath();X.arc(0,0,R,0,6.3);X.fill();
  X.restore();
  /* rim */
  X.strokeStyle=COL.dark;X.lineWidth=3;X.beginPath();X.arc(0,0,R,0,6.3);X.stroke();
  X.strokeStyle='#e2c473';X.lineWidth=1.6;X.beginPath();X.arc(0,0,R-1.6,0,6.3);X.stroke();
  /* the collector ring, tilted round the outside */
  X.strokeStyle='#8a6a2c';X.lineWidth=6;
  X.beginPath();X.ellipse(0,4,43,15,0.2,0,6.3);X.stroke();
  X.strokeStyle='#e2c473';X.lineWidth=3.2;
  X.beginPath();X.ellipse(0,4,43,15,0.2,0,6.3);X.stroke();
  X.strokeStyle=COL.dark;X.lineWidth=1.2;
  X.beginPath();X.ellipse(0,4,43,15,0.2,0,6.3);X.stroke();
  /* a bead of collected light running the ring */
  var ba=d.ring*1.2,bx=Math.cos(ba)*43,by=4+Math.sin(ba)*15;
  X.fillStyle=d.star?tint:'#8d88b5';X.beginPath();X.arc(bx,by,3.6,0,6.3);X.fill();line(COL.dark,1.6);
  /* three struts holding it above the plinth */

  for(i=-1;i<=1;i++){X.beginPath();X.moveTo(i*20,26);X.lineTo(i*13,R-4);X.stroke();}
  X.restore();
  txt(d.star?(d.star==='ustar'?'UNSTABLE STAR':'STABLE STAR'):'NO STAR',
      0,20,8,d.star?tint:'#8d88b5','center');
}

function mantisBody(scale,armPhase,blink,apron){
  /* a proper mantis: slim abdomen, upright pronotum, wedge head with corner
     eyes, and folded raptorial forearms held in front */
  X.save();X.scale(scale,scale);
  var sway=Math.sin(armPhase)*0.9;
  /* walking legs */
  X.strokeStyle='#1f9c78';X.lineWidth=2.6;X.lineCap='round';
  for(var L=0;L<2;L++){
    var side=L?1:-1;
    X.beginPath();X.moveTo(side*3,-9);
    X.quadraticCurveTo(side*11,-6,side*9,1);X.stroke();
    X.beginPath();X.moveTo(side*3,-14);
    X.quadraticCurveTo(side*12,-12,side*12,-4);X.stroke();
  }
  /* abdomen, tilted back a little */
  X.save();X.rotate(-0.12);
  X.beginPath();X.ellipse(0,-16,7.5,13,0,0,6.3);fill(COL.mant2);line(COL.mantD,2.2);
  /* wing case */
  X.beginPath();X.ellipse(1.5,-18,5.4,10.5,0.06,0,6.3);fill(COL.mant);
  X.globalAlpha=0.45;X.strokeStyle=COL.mantD;X.lineWidth=0.9;X.stroke();
  X.beginPath();X.moveTo(1.5,-27);X.lineTo(1.5,-9);X.stroke();X.globalAlpha=1;
  X.restore();
  if(apron){
    rr(-5,-16,10,9,3);fill(COL.gold);line(COL.mantD,1.8);
    X.fillStyle=COL.mantD;X.beginPath();X.arc(0,-11.5,1.1,0,6.3);X.fill();
  }
  /* pronotum: the long neck segment that makes a mantis a mantis */
  X.save();X.rotate(0.06+sway*0.02);
  rr(-3.4,-38,6.8,17,3);fill(COL.mant);line(COL.mantD,2);
  X.restore();
  /* raptorial forearms, folded in front */
  for(var a2=0;a2<2;a2++){
    var sd=a2?1:-1,f=sway*(a2?1:-1);
    X.save();X.translate(sd*2.5,-34);
    X.strokeStyle=COL.mant;X.lineWidth=3.4;X.lineCap='round';X.lineJoin='round';
    X.beginPath();X.moveTo(0,0);X.lineTo(sd*7,6+f);X.stroke();          /* upper arm out */
    X.strokeStyle=COL.mant2;X.lineWidth=3;
    X.beginPath();X.moveTo(sd*7,6+f);X.lineTo(sd*4.5,-3+f);X.stroke();  /* forearm folded back */
    X.strokeStyle=COL.mantD;X.lineWidth=0.9;
    for(var t2=0;t2<3;t2++){
      var u=0.25+t2*0.25;
      X.beginPath();
      X.moveTo(sd*(7+(4.5-7)*u),6+f+(-3-6)*u);
      X.lineTo(sd*(7+(4.5-7)*u)-sd*2,6+f+(-3-6)*u+0.5);X.stroke();
    }
    X.restore();
  }
  /* head: wedge, widest at the top, eyes on the corners */
  X.save();X.translate(0,-41);X.rotate(sway*0.03);
  X.beginPath();
  X.moveTo(-7.5,-4);X.lineTo(7.5,-4);
  X.quadraticCurveTo(5.5,5.5,0,6);X.quadraticCurveTo(-5.5,5.5,-7.5,-4);
  X.closePath();fill(COL.mant);line(COL.mantD,2.1);
  for(var e2=0;e2<2;e2++){
    var sd2=e2?1:-1;
    X.beginPath();X.ellipse(sd2*4.6,-2.6,3.1,3.6*(blink?0.18:1),sd2*0.25,0,6.3);
    fill('#ffffff');line(COL.mantD,1.5);
    if(!blink){
      X.fillStyle=COL.dark;X.beginPath();X.arc(sd2*4.9,-2.4,1.5,0,6.3);X.fill();
      X.fillStyle='#fff';X.beginPath();X.arc(sd2*4.3,-3.4,0.6,0,6.3);X.fill();
    }
  }
  X.strokeStyle=COL.mantD;X.lineWidth=1.1;
  X.beginPath();X.arc(0,1.4,2,0.35,2.79);X.stroke();
  /* antennae */
  X.strokeStyle=COL.mantD;X.lineWidth=1.4;X.lineCap='round';
  X.beginPath();X.moveTo(-3.5,-4);X.quadraticCurveTo(-8,-11,-5.5+Math.sin(armPhase*1.4)*1.6,-15);X.stroke();
  X.beginPath();X.moveTo(3.5,-4);X.quadraticCurveTo(8,-11,5.5+Math.cos(armPhase*1.2)*1.6,-15);X.stroke();
  X.restore();
  X.restore();
}

function spark(px,py,w,h){
  var mn=1e9,mx=-1e9,i;
  for(i=0;i<S.hist.length;i++){mn=Math.min(mn,S.hist[i]);mx=Math.max(mx,S.hist[i]);}
  if(mx-mn<0.5)mx=mn+0.5;
  rr(px,py,w,h,5);fill('#1e1b34');
  X.save();X.beginPath();X.roundRect(px,py,w,h,5);X.clip();
  X.beginPath();
  for(i=0;i<S.hist.length;i++){
    var X0=px+i/(S.hist.length-1)*w,Y0=py+h-3-((S.hist[i]-mn)/(mx-mn))*(h-6);
    if(i===0)X.moveTo(X0,Y0);else X.lineTo(X0,Y0);}
  X.strokeStyle=S.trend>=0?'#6bf28a':'#ff6b6b';X.lineWidth=2;X.stroke();
  X.lineTo(px+w,py+h);X.lineTo(px,py+h);X.closePath();
  X.globalAlpha=0.18;X.fillStyle=S.trend>=0?'#6bf28a':'#ff6b6b';X.fill();X.globalAlpha=1;
  X.restore();
}

var WKW=486,WKH=404,WKX=(W-WKW)/2,WKY=(H-WKH)/2;
var workBtns=[];
function starPal(k){
  return (k==='ustar'||k==='ucore')
    ? {hot:'#fff3cf',mid:'#ffab35',cool:'#ff5726',deep:'#8f2410',ray:'#ffcf7a'}
    : {hot:'#ffffff',mid:'#c6e6ff',cool:'#4f9dfa',deep:'#1b4682',ray:'#e2f2ff'};
}
/* a star: layered corona, spinning rays, lens flare, churning surface */
function drawStarArt(k,r){
  var un=(k==='ustar'),P=starPal(k),i;
  var puls=un?(0.88+0.12*Math.sin(T*9)+0.05*Math.sin(T*23.7)):(0.96+0.04*Math.sin(T*2.1));
  var rr2=r*puls;
  X.save();
  /* the far corona */
  var g0=X.createRadialGradient(0,0,r*0.15,0,0,r*2.8);
  g0.addColorStop(0,un?'rgba(255,150,60,.60)':'rgba(120,190,255,.55)');
  g0.addColorStop(0.42,un?'rgba(255,90,40,.22)':'rgba(90,168,255,.20)');
  g0.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=g0;X.beginPath();X.arc(0,0,r*2.8,0,6.3);X.fill();
  /* rays wheeling round */
  X.save();X.rotate(T*(un?0.5:0.24));
  for(i=0;i<16;i++){
    var lng=(i%2===0);
    var flick=un?(0.72+0.5*hash(i,Math.floor(T*7))):1;
    var len=r*(lng?2.5:1.65)*flick*puls,wd=r*(lng?0.15:0.085);
    X.save();X.rotate(i/16*6.283);
    var gr=X.createLinearGradient(0,0,0,-len);
    gr.addColorStop(0,P.ray);gr.addColorStop(0.45,un?'rgba(255,150,60,.5)':'rgba(150,205,255,.5)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    X.globalAlpha=lng?0.6:0.34;X.fillStyle=gr;
    X.beginPath();X.moveTo(-wd,0);X.lineTo(0,-len);X.lineTo(wd,0);X.closePath();X.fill();
    X.restore();
  }
  X.restore();
  /* the four long flare spikes stay upright */
  X.globalAlpha=0.55;
  for(i=0;i<4;i++){
    var L=r*(i%2?2.1:3.2)*puls;
    X.save();X.rotate(i*1.5708);
    var gf=X.createLinearGradient(0,0,0,-L);
    gf.addColorStop(0,'rgba(255,255,255,.9)');gf.addColorStop(1,'rgba(255,255,255,0)');
    X.fillStyle=gf;
    X.beginPath();X.moveTo(-r*0.10,0);X.lineTo(0,-L);X.lineTo(r*0.10,0);X.closePath();X.fill();
    X.restore();
  }
  X.globalAlpha=1;
  /* the body */
  var gb=X.createRadialGradient(-rr2*0.22,-rr2*0.28,rr2*0.06,0,0,rr2);
  gb.addColorStop(0,'#ffffff');gb.addColorStop(0.32,P.hot);
  gb.addColorStop(0.70,P.mid);gb.addColorStop(1,P.cool);
  X.fillStyle=gb;X.beginPath();X.arc(0,0,rr2,0,6.3);X.fill();
  X.save();X.beginPath();X.arc(0,0,rr2,0,6.3);X.clip();
  if(un){
    /* churning granules and a dark sunspot or two */
    for(i=0;i<9;i++){
      var a2=hash(i,3)*6.283+T*0.8*(i%2?1:-1),d2=rr2*(0.25+0.55*hash(i,9));
      X.globalAlpha=0.30;X.fillStyle=i%3?'#ff7a2a':'#c9340f';
      X.beginPath();X.ellipse(Math.cos(a2)*d2,Math.sin(a2)*d2,rr2*0.22,rr2*0.13,a2,0,6.3);X.fill();
    }
    /* a whip of plasma across the face */
    X.globalAlpha=0.7;X.strokeStyle='#fff0c2';X.lineWidth=Math.max(1,rr2*0.08);X.lineCap='round';
    X.beginPath();
    for(i=0;i<=8;i++){
      var xx=-rr2+i*(rr2*2/8),yy=Math.sin(T*4+i*0.9)*rr2*0.30;
      X[i?'lineTo':'moveTo'](xx,yy);
    }
    X.stroke();
  } else {
    /* calm concentric shells */
    X.globalAlpha=0.35;X.strokeStyle='#ffffff';
    for(i=1;i<4;i++){X.lineWidth=Math.max(0.8,rr2*0.05);
      X.beginPath();X.arc(-rr2*0.1,-rr2*0.1,rr2*(0.28*i),0,6.3);X.stroke();}
    X.globalAlpha=0.5;
    var gs=X.createLinearGradient(-rr2,-rr2,rr2*0.3,rr2*0.6);
    gs.addColorStop(0,'rgba(255,255,255,.85)');gs.addColorStop(1,'rgba(255,255,255,0)');
    X.fillStyle=gs;X.beginPath();X.arc(0,0,rr2,0,6.3);X.fill();
  }
  X.globalAlpha=1;X.restore();
  X.strokeStyle=P.deep;X.lineWidth=Math.max(1.2,r*0.09);
  X.beginPath();X.arc(0,0,rr2,0,6.3);X.stroke();
  /* motes in orbit */
  for(i=0;i<3;i++){
    var ma=T*(un?1.6:0.9)+i*2.094,md=r*(1.5+0.25*Math.sin(T*1.3+i));
    X.globalAlpha=0.85;X.fillStyle=P.hot;
    X.beginPath();X.arc(Math.cos(ma)*md,Math.sin(ma)*md*0.45,r*0.10,0,6.3);X.fill();
  }
  X.globalAlpha=1;
  X.restore();
}
/* a core: not burning yet, but clearly holding something back */
function drawCoreArt(k,r){
  var un=(k==='ucore'),P=starPal(k),i;
  X.save();
  var g0=X.createRadialGradient(0,0,r*0.2,0,0,r*2.0);
  g0.addColorStop(0,un?'rgba(255,120,40,.42)':'rgba(110,180,255,.38)');
  g0.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=g0;X.beginPath();X.arc(0,0,r*2.0,0,6.3);X.fill();
  if(un){
    /* an iron husk, cracked open, something molten inside */
    var jx=Math.sin(T*27)*r*0.045,jy=Math.cos(T*31)*r*0.045;
    X.translate(jx,jy);
    var gm=X.createRadialGradient(0,0,r*0.1,0,0,r);
    gm.addColorStop(0,'#fff2cf');gm.addColorStop(0.5,'#ff8a2b');gm.addColorStop(1,'#8f2410');
    X.fillStyle=gm;X.beginPath();X.arc(0,0,r*0.92,0,6.3);X.fill();
    /* the plates of the husk */
    X.fillStyle='#3b3348';X.strokeStyle=COL.dark;X.lineWidth=Math.max(1.4,r*0.11);
    for(i=0;i<6;i++){
      var a1=i/6*6.283+0.16,a2b=a1+0.72;
      X.beginPath();
      X.moveTo(Math.cos(a1)*r*0.30,Math.sin(a1)*r*0.30);
      X.lineTo(Math.cos(a1)*r*1.0,Math.sin(a1)*r*1.0);
      X.arc(0,0,r,a1,a2b);
      X.lineTo(Math.cos(a2b)*r*0.30,Math.sin(a2b)*r*0.30);
      X.closePath();X.fill();X.stroke();
    }
    /* molten seams glowing between the plates */
    X.globalAlpha=0.6+0.35*Math.sin(T*8);
    X.strokeStyle='#ffc768';X.lineWidth=Math.max(1,r*0.09);X.lineCap='round';
    for(i=0;i<6;i++){
      var aa=i/6*6.283+0.16;
      X.beginPath();X.moveTo(Math.cos(aa)*r*0.26,Math.sin(aa)*r*0.26);
      X.lineTo(Math.cos(aa)*r*1.02,Math.sin(aa)*r*1.02);X.stroke();
    }
    X.globalAlpha=1;
    /* arcs snapping round the outside */
    X.strokeStyle='#ffe3a3';X.lineWidth=Math.max(0.9,r*0.07);
    for(i=0;i<2;i++){
      if((T*6+i)%2>1.1)continue;
      var b0=hash(i,Math.floor(T*6))*6.283;
      X.beginPath();
      X.moveTo(Math.cos(b0)*r,Math.sin(b0)*r);
      X.lineTo(Math.cos(b0+0.5)*r*1.35,Math.sin(b0+0.5)*r*1.35);
      X.lineTo(Math.cos(b0+0.9)*r*1.1,Math.sin(b0+0.9)*r*1.1);
      X.stroke();
    }
  } else {
    /* a cut gem, still and cold, in a containment ring */
    X.save();X.rotate(T*0.25);
    var pts=6,pr=r*0.98;
    var gg=X.createLinearGradient(-pr,-pr,pr,pr);
    gg.addColorStop(0,'#eaf6ff');gg.addColorStop(0.45,'#7fb9ff');gg.addColorStop(1,'#1b4682');
    X.beginPath();
    for(i=0;i<pts;i++){var an=i/pts*6.283-1.5708;
      X[i?'lineTo':'moveTo'](Math.cos(an)*pr,Math.sin(an)*pr);}
    X.closePath();X.fillStyle=gg;X.fill();
    X.strokeStyle=COL.dark;X.lineWidth=Math.max(1.4,r*0.11);X.stroke();
    /* facets */
    X.strokeStyle='rgba(255,255,255,.55)';X.lineWidth=Math.max(0.8,r*0.06);
    for(i=0;i<pts;i++){var an2=i/pts*6.283-1.5708;
      X.beginPath();X.moveTo(0,0);X.lineTo(Math.cos(an2)*pr,Math.sin(an2)*pr);X.stroke();}
    X.beginPath();
    for(i=0;i<pts;i++){var an3=i/pts*6.283-1.5708+0.52;
      X[i?'lineTo':'moveTo'](Math.cos(an3)*pr*0.5,Math.sin(an3)*pr*0.5);}
    X.closePath();X.fillStyle='rgba(255,255,255,.30)';X.fill();X.stroke();
    X.restore();
    /* the still point at its heart */
    X.globalAlpha=0.75+0.25*Math.sin(T*1.6);
    X.fillStyle='#ffffff';X.beginPath();X.arc(0,0,r*0.20,0,6.3);X.fill();X.globalAlpha=1;
    /* containment ring */
    X.strokeStyle='#9fd0ff';X.lineWidth=Math.max(1,r*0.07);
    X.save();X.rotate(-T*0.4);
    X.beginPath();X.ellipse(0,0,r*1.35,r*0.5,0.3,0,6.3);X.stroke();X.restore();
  }
  X.restore();
}

window.addEventListener('keydown',function(e){
  var k=e.key;
  if(S.renIdx>=0){
    if(k.length===1&&/[a-zA-Z0-9 '\-]/.test(k)){if(S.renTxt.length<16)S.renTxt+=k;e.preventDefault();return;}
    if(k==='Backspace'){S.renTxt=S.renTxt.slice(0,-1);e.preventDefault();return;}
    if(k==='Enter'){
      var nm=S.renTxt.trim();
      if(nm)ISLES[S.renIdx].name=nm;
      S.renIdx=-1;beep(760,0.06,'triangle',0.05);save();e.preventDefault();return;}
    if(k==='Escape'){S.renIdx=-1;return;}
    return;
  }
  if(S.bankOpen&&S.bankFocus){
    if(k>='0'&&k<='9'){if((S.bankTxt||'').length<7)S.bankTxt=(S.bankTxt||'')+k;e.preventDefault();return;}
    if(k==='Backspace'){S.bankTxt=(S.bankTxt||'').slice(0,-1);e.preventDefault();return;}
    if(k==='Enter'){bankMove(1);e.preventDefault();return;}
    if(k==='Escape'){S.bankFocus=false;S.bankOpen=false;return;}
  }
  if(S.shop&&S.amtFocus){
    if(k>='0'&&k<='9'){if((S.amt||'').length<6)S.amt=(S.amt||'')+k;e.preventDefault();return;}
    if(k==='Backspace'){S.amt=(S.amt||'').slice(0,-1);e.preventDefault();return;}
    if(k==='Enter'){sellTyped();e.preventDefault();return;}
    if(k==='Escape'){S.amtFocus=false;S.shop=false;return;}
  }
  if(k==='1')S.tool='belt';
  else if(k==='2')S.tool='miner';
  else if(k==='3')S.tool='seller';
  else if(k==='i'||k==='I'){S.inv=!S.inv;S.iscroll=0;S.shop=false;S.parrot=false;S.land=false;}
  else if(k==='e'||k==='E'){S.shop=!S.shop;S.inv=false;S.parrot=false;S.land=false;S.sscroll=0;S.amtFocus=S.shop;}
  else if(k==='['){gotoIsle((S.isle-1+ISLES.length)%ISLES.length);}
  else if(k===']'){gotoIsle((S.isle+1)%ISLES.length);}
  else if(k==='Escape'){if(S.fuse&&S.fuse.t>1.9)S.fuse=null;if(S.moveNpc)npcCancelMove();S.shop=false;S.inv=false;S.parrot=false;S.land=false;S.power=false;S.bankOpen=false;S.work=false;S.dyP=null;S.scfg=null;S.ccfg=null;S.crabP=null;S.lore=null;S.confirm=null;S.linking=null;S.amtFocus=false;}
  else if(k==='r'||k==='R'){S.dir=(S.dir+1)%4;rotateHover();}
  else if(k==='f'||k==='F'){crtToggle();}
  else if(k.indexOf('Arrow')===0){
    e.preventDefault();
    S.dir=k==='ArrowRight'?0:k==='ArrowDown'?1:k==='ArrowLeft'?2:3;
    rotateHover();
  }
});

function save(){
  try{
    var isles=ISLES.filter(function(I){return I.owned;}).map(function(I){
      var belts=[];
      for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var c=I.cells[y*GW+x];
        if(c&&c.t==='belt')belts.push([x,y,c.dir]);}
      var st=I.structs.map(function(s){
        var o=[s.t,s.x,s.y,s.dir];
        if(s.t==='seller')o.push({dmg:s.dmg,thr:s.thr,brk:s.brk,why:s.why});
        if(s.t==='scan')o.push({filt:s.filt,mode:s.mode,gates:s.gates});
        if(s.t==='gate')o.push({rdir:s.rdir,dir:s.dir});
        if(s.t==='gen'||s.t==='lgen')o.push({fuel:s.fuel});
        if(s.t==='comp')o.push({buf:s.buf});
        if(s.t==='craft')o.push({ri:s.ri,prog:s.prog});
        if(s.t==='kiln')o.push({prog:s.prog});
        if(s.t==='dyson')o.push({star:s.star,out:s.out,count:s.count});
        if(BIGKIND[s.t])o.push({big:!!s.big});
        else if(s.big)o.push({big:true});
        return o;});
      return {cat:I.cat,name:I.name,emp:I.emp||null,b:belts,s:st,p:I.palms.map(function(a){return [a.x,a.y];})};
    });
    localStorage.setItem('bitminer7',JSON.stringify({isles:isles,isle:S.isle,
      bag:S.bag,parts:S.parts,sawWork:S.sawWork?1:0,crt:S.crt?1:0,crtA:S.crtAmt,unl:S.unlocked,cur:S.cur,coins:S.coins,stock:S.stock,price:S.price,hist:S.hist,
      mined:S.mined,sold:S.sold,bank:S.bank,pts:S.pts,rew:S.rew,supU:S.supUnlocked,gwU:S.gwUnlocked,ulU:S.ultraUnlocked,tut:S.tut,tfl:[S.didPickup?1:0,S.sawParrot?1:0,S.sawLand?1:0],npcs:{stall:[STALL.x,STALL.y],parrot:[PARROT.x,PARROT.y],lord:[LORD.x,LORD.y],volt:VOLT?[VOLT.x,VOLT.y]:null}}));
  }catch(e){}
}
function ensureGenerators(){
  var back=A,i;
  if(VOLT){
    A=HOME;
    if(!genOf(HOME)){
      var g=null;
      if(canPlace('gen',VOLT.gen.x,VOLT.gen.y))g=place('gen',VOLT.gen.x,VOLT.gen.y,0);
      for(var y=1;y<GH-3&&!g;y++)for(var x=1;x<GW-2&&!g;x++)
        if(canPlace('gen',x,y))g=place('gen',x,y,0);
      if(!g)S.stock.gen=(S.stock.gen||0)+1;   /* nowhere to put it - you site it yourself */
      if(g){
        g.fuel=(g.fuel===undefined?150:g.fuel);
        VOLT.gen=g;
        if(!isLand(VOLT.x,VOLT.y)||(HOME.cells[VOLT.y*GW+VOLT.x]||{}).t!=='npc'){
          var sx=g.x,sy=g.y+sizeH('gen');
          if(isLand(sx,sy)&&!HOME.cells[sy*GW+sx]){
            HOME.cells[sy*GW+sx]={t:'npc'};
            VOLT.x=sx;VOLT.y=sy;VOLT.wx=cx(sx)+TS/2;VOLT.wy=cy(sy)+TS-2;
          }
        }
      }
    }
  }
  for(i=1;i<ISLES.length;i++){
    var I=ISLES[i];
    if(!I.owned)continue;
    A=I;
    if(genOf(I))continue;
    var lg=null;
    for(var y2=1;y2<GH-3&&!lg;y2++)for(var x2=1;x2<GW-2&&!lg;x2++)
      if(canPlace('lgen',x2,y2))lg=place('lgen',x2,y2,0);
    if(!lg){S.stock.lgen=(S.stock.lgen||0)+1;continue;}
    if(!I.emp){
      var emp=EMPLOYEES[i%EMPLOYEES.length];
      I.emp={name:emp.name,c1:emp.c1,c2:emp.c2,x:lg.x,y:lg.y+sizeH('lgen'),
        wx:cx(lg.x)+TS,wy:cy(lg.y)+TS*(sizeH('lgen')+0.9)};
      if(inGrid(I.emp.x,I.emp.y)&&!I.cells[I.emp.y*GW+I.emp.x])I.cells[I.emp.y*GW+I.emp.x]={t:'npc'};
    }
  }
  A=back;
}
var RECLAIM=null;                 /* machines that no longer fit go back in the box */
function reclaim(t,n){
  if(!RECLAIM)RECLAIM={};
  RECLAIM[t]=(RECLAIM[t]||0)+(n||1);
}
function load(){
  RECLAIM=null;
  try{
    var d=JSON.parse(localStorage.getItem('bitminer7'));if(!d)return;
    (d.isles||[]).forEach(function(di,idx){
      var I;
      if(idx===0)I=ISLES[0];
      else{
        var cat=catByKey(di.cat);if(!cat)return;
        I=genIsle(cat);ISLES.push(I);
      }
      if(di.name)I.name=di.name;
      if(di.emp){I.emp=di.emp;
        I.emp.wx=cx(I.emp.x)+TS/2;I.emp.wy=cy(I.emp.y)+TS-2;
        if(inGrid(I.emp.x,I.emp.y)&&!I.cells[I.emp.y*GW+I.emp.x])I.cells[I.emp.y*GW+I.emp.x]={t:'npc'};}
      /* reset placeable cells (keep stall/npc/deco marks) */
      var back=A;A=I;
      if(idx===0){
        for(var q=0;q<GW*GH;q++){var cq=I.cells[q];
          if(cq&&(cq.t==='belt'||cq.t==='occ'))I.cells[q]=null;}
        I.structs=[];
      }
      /* prune palms that were cleared */
      if(di.p){
        var keep={};di.p.forEach(function(a){keep[a[0]+','+a[1]]=1;});
        for(var pi=I.palms.length-1;pi>=0;pi--){var pp=I.palms[pi];
          if(!keep[pp.x+','+pp.y]){I.cells[pp.y*GW+pp.x]=null;I.palms.splice(pi,1);}}
      }
      if(idx>0)I.structs=[];
      (di.s||[]).forEach(function(a2){
        var ty=a2[0],ex=a2[4];
        /* miners that used to have a size switch keep it - as the real large machine */
        if(ex&&ex.big&&(ty==='miner'||ty==='sup'||ty==='ult'))
          ty={miner:'lgminer',sup:'lgsup',ult:'lgult'}[ty];
        if(!canPlace(ty,a2[1],a2[2])){
          /* it fell off the edge of a resized island - hand it back rather than bin it */
          if(PRICES[ty]!==undefined&&ty!=='gen'&&ty!=='lgen')reclaim(ty,1);
          return;
        }
        var s=place(ty,a2[1],a2[2],a2[3]||0);
        if(s&&ex){for(var kk in ex)s[kk]=ex[kk];}
        if(s&&!canSwitch(s.t))s.big=false;
      });
      (di.b||[]).forEach(function(a3){
        if(inGrid(a3[0],a3[1])&&!I.cells[a3[1]*GW+a3[0]])I.cells[a3[1]*GW+a3[0]]={t:'belt',dir:a3[2]};
        else if(!inGrid(a3[0],a3[1]))reclaim('belt',1);
      });
      A=back;
    });
    S.bag=d.bag||S.bag;
    if(S.bag.shell===undefined)S.bag.shell=0;
    if(S.bag.pearl===undefined)S.bag.pearl=0;
    ['ultra','lsup','lultra','tranq'].forEach(function(kb){if(S.bag[kb]===undefined)S.bag[kb]=0;});
    if(d.parts)S.parts=d.parts;
    PARTKEYS.forEach(function(pk){if(S.parts[pk]===undefined)S.parts[pk]=0;});
    S.sawWork=!!d.sawWork;
    if(d.crt!==undefined)S.crt=!!d.crt;
    if(d.crtA!==undefined)S.crtAmt=clamp(d.crtA,0.2,1);
    S.unlocked=d.unl||S.unlocked;S.cur=d.cur||'bit';
    if(!S.unlocked[S.cur])S.cur='bit';
    S.coins=d.coins||0;S.stock=d.stock||S.stock;S.price=clamp(d.price||7.5,5,10);
    fillStock();
    var reclaimed=0;
    if(RECLAIM){
      for(var rk in RECLAIM){S.stock[rk]=(S.stock[rk]||0)+RECLAIM[rk];reclaimed+=RECLAIM[rk];}
      RECLAIM=null;
    }
    S.hist=(d.hist&&d.hist.length>2)?d.hist.map(function(v){return clamp(v,5,10);}):S.hist;
    if(d.bank){S.bank.bal=d.bank.bal||0;S.bank.pend=d.bank.pend||0;S.bank.earned=d.bank.earned||0;}
    S.mined=d.mined||0;S.sold=d.sold||0;S.pts=d.pts||0;S.rew=d.rew||0;
    S.supUnlocked=!!d.supU;S.gwUnlocked=!!d.gwU;S.ultraUnlocked=!!d.ulU;
    S.tut=(d.tut===undefined)?TUT.length:d.tut;
    if(d.tfl){S.didPickup=!!d.tfl[0];S.sawParrot=!!d.tfl[1];S.sawLand=!!d.tfl[2];}
    if(d.npcs){
      var backI=A,backC=CURI;A=HOME;CURI=HOME;
      ['stall','parrot','lord','volt'].forEach(function(k){
        var pos=d.npcs[k];
        if(!pos||(k==='volt'&&!VOLT))return;
        var cur=npcOrigin(k);
        if(!cur||(cur[0]===pos[0]&&cur[1]===pos[1]))return;
        npcCells(k,cur[0],cur[1],false);
        if(npcCanSit(k,pos[0],pos[1]))npcPlace(k,pos[0],pos[1]);
        else npcPlace(k,cur[0],cur[1]);
      });
      A=backI;CURI=backC;
    }
    ensureGenerators();
    gotoIsle(clamp(d.isle||0,0,ISLES.length-1));
    if(reclaimed>0){
      S.hint=reclaimed+' machine'+(reclaimed>1?'s':'')+' did not fit the resized island - back in your inventory';
      S.hintT=10;
    } else {S.hint='Welcome back!';S.hintT=2;}
  }catch(e){}
}
