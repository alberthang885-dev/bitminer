<body>
<div id="wrap"><canvas id="c" width="840" height="596"></canvas></div>
<script>
"use strict";
var C=document.getElementById('c'),X=C.getContext('2d');
var W=840,H=596;
var TS=24,GW=34,GH=20,OX=12,OY=44;
var SPR=TS/32;
var BOT=72;
var DX=[1,0,-1,0],DY=[0,1,0,-1];
var COL={dark:'#2b2a45',grass:'#7ad86a',grass2:'#66c95c',sand:'#ffe3a3',sand2:'#f2c884',
  sea:'#2196c9',sea2:'#3fc4e8',foam:'#bdf1ff',bit:'#4dd8ff',bit2:'#bff6ff',
  gold:'#ffd23f',pink:'#ff6b9d',purple:'#9b5de5',coral:'#ff8a5b',cream:'#fff4d6',
  mant:'#2fd6a5',mant2:'#25bd90',mantD:'#12463a',wood:'#c98b4b',wood2:'#a86e36',
  sup:'#c07bff',sup2:'#e7c9ff',anom:'#6b5878',anom2:'#ff5a7a',
  shell:'#ffb8c8',shell2:'#ffe9ee',pearl:'#f6f2ff'};

/* ---------- helpers ---------- */
function hash(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);}
function fill(c){X.fillStyle=c;X.fill();}
function line(c,w){X.strokeStyle=c;X.lineWidth=w||3;X.stroke();}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function txt(s,x,y,size,col,align,bold){X.font=(bold===false?'':'bold ')+size+'px Verdana,Geneva,sans-serif';
  X.fillStyle=col;X.textAlign=align||'left';X.textBaseline='middle';X.fillText(s,x,y);}
function cx(x){return OX+x*TS;}
function cy(y){return OY+y*TS;}

/* ---------- bit kinds ---------- */
var MULT={mini:0.5,bit:1,large:4,sup:12,shell:2,pearl:8,ultra:30,lsup:40,lultra:100};
var PTS={mini:1,bit:2,large:6,sup:15,anom:4,shell:3,pearl:10,ultra:35,lsup:45,lultra:110};
var KINDNAME={mini:'MINI BIT',bit:'BIT',large:'LARGE BIT',sup:'SUPER BIT',anom:'ANOMALY',shell:'SEASHELL',pearl:'PEARL',ultra:'ULTRA BIT',lsup:'LARGE SUPER BIT',lultra:'LARGE ULTRA BIT'};
var CURS=['mini','bit','shell','large','pearl','sup','lsup','ultra','lultra'];

/* ---------- machine catalogue ---------- */
var SIZES={belt:1,mini:1,scan:1,gate:1,sep:1,dredge:1,gen:2,lgen:3,miner:2,seller:2,sup:2,ult:2,comp:2,craft:2,aqua:2,crab:2,gw:3};
var TERRAIN={belt:'both',scan:'both',gate:'both',sep:'both',gw:'both',crab:'land',gen:'both',lgen:'both',
  miner:'land',mini:'land',sup:'land',ult:'land',seller:'land',comp:'land',craft:'land',
  aqua:'water',dredge:'water'};
var PRICES={belt:25,mini:150,miner:600,seller:400,scan:120,gate:120,sep:200,gen:0,lgen:0,comp:900,craft:1200,sup:9000,gw:15000,aqua:1400,dredge:450,crab:1500,ult:30000};
function sizeOf(t){return SIZES[t]||1;}
var SIZEW={gen:2},SIZEH={gen:3};          /* anything not listed is square */
function sizeW(t){return SIZEW[t]||sizeOf(t);}
function sizeH(t){return SIZEH[t]||sizeOf(t);}
function sellback(t){return Math.floor((PRICES[t]||0)*0.6);}
/* ---------- electricity ---------- */
var POWER={belt:1,scan:1,gate:1,sep:2,mini:3,dredge:4,seller:5,miner:6,comp:8,craft:8,
           aqua:10,sup:14,gw:20,ult:30,crab:0,gen:0,lgen:0};
var BURN=0.0028;            /* fuel units per watt per second */
var FUEL_OF={mini:0.5,bit:1,large:4,sup:12,ult:25,shell:1.5,pearl:5,anom:2};
function genOf(I){
  for(var i=0;i<I.structs.length;i++)if(I.structs[i].t==='gen'||I.structs[i].t==='lgen')return I.structs[i];
  return null;
}
function drawOf(I){
  var w=0;
  for(var i=0;i<I.structs.length;i++)w+=(POWER[I.structs[i].t]||0);
  for(var q=0;q<GW*GH;q++){var c=I.cells[q];if(c&&c.t==='belt')w+=POWER.belt;}
  return w;
}
function freeW(g){return g?(g.t==='lgen'?30:15):0;}
function billedW(I){var g=genOf(I);return Math.max(0,drawOf(I)-freeW(g));}
function genCap(g){return g.t==='lgen'?900:400;}
function feedGen(g,kind,n){
  var v=(FUEL_OF[kind]||1)*(n||1);
  g.fuel=Math.min(genCap(g),(g.fuel||0)+v);
  g.feed=1;
  return v;
}
function isPowered(I){
  var g=genOf(I);
  if(!g)return true;                    /* no generator on this island: nothing to pay */
  return billedW(I)<=0||(g.fuel||0)>0;
}
var RECIPES=[['belt',9],['scan',36],['gate',36],['sep',60],['mini',48],['dredge',140],['seller',125],
             ['miner',200],['aqua',440],['comp',290],['craft',380]];

/* ---------- island generation ---------- */
var ICX=OX+GW*TS/2, ICY=OY+GH*TS/2, IAX0=GW*TS/2-10, IAY0=GH*TS/2-6;
function tilePath(I,grass,r){
  var p=new Path2D();
  function m(x,y){if(x<0||y<0||x>=GW||y>=GH)return false;
    return grass?(I.LAND[y*GW+x]&&!I.SAND[y*GW+x]):I.LAND[y*GW+x];}
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    if(!m(x,y))continue;
    var L=m(x-1,y),R=m(x+1,y),U=m(x,y-1),D=m(x,y+1);
    p.roundRect(cx(x),cy(y),TS,TS,[(!L&&!U)?r:0,(!R&&!U)?r:0,(!R&&!D)?r:0,(!L&&!D)?r:0]);
  }
  return p;
}
function genIsle(cfg){
  var I={cat:cfg.key,name:cfg.name,type:cfg.type,scale:cfg.scale||1,seed:cfg.seed||0,rich:!!cfg.rich,
    home:!!cfg.home,owned:true,cells:[],structs:[],items:[],loose:[],palms:[],LAND:[],SAND:[]};
  for(var i=0;i<GW*GH;i++){I.cells[i]=null;I.LAND[i]=false;I.SAND[i]=false;}
  if(cfg.type==='land'){
    var sd=cfg.seed||0,iax=IAX0*I.scale,iay=IAY0*I.scale;
    function noise(x,y){
      return 0.62*(hash(Math.floor(x/4)+sd,Math.floor(y/4)+sd)-0.5)
            +0.30*(hash(Math.floor(x/3)+7+sd,Math.floor(y/3)+3+sd)-0.5)
            +0.22*(hash(Math.floor(x/2)+31+sd,Math.floor(y/2)+17+sd)-0.5);
    }
    for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
      var dx=(cx(x)+TS/2-ICX)/iax,dy=(cy(y)+TS/2-ICY)/iay;
      var d=Math.sqrt(dx*dx+dy*dy);
      I.LAND[y*GW+x]=(d+0.26*noise(x,y))<0.95;
    }
    for(var y2=0;y2<GH;y2++)for(var x2=0;x2<GW;x2++){
      if(!I.LAND[y2*GW+x2])continue;
      var n=0;
      if(x2>0&&I.LAND[y2*GW+x2-1])n++;
      if(x2<GW-1&&I.LAND[y2*GW+x2+1])n++;
      if(y2>0&&I.LAND[(y2-1)*GW+x2])n++;
      if(y2<GH-1&&I.LAND[(y2+1)*GW+x2])n++;
      if(n===0)I.LAND[y2*GW+x2]=false;
    }
    for(var y3=0;y3<GH;y3++)for(var x3=0;x3<GW;x3++){
      if(!I.LAND[y3*GW+x3])continue;
      var wet=false;
      for(var j=-2;j<=2&&!wet;j++)for(var i2=-2;i2<=2;i2++){
        var nx=x3+i2,ny=y3+j;
        if(nx<0||ny<0||nx>=GW||ny>=GH||!I.LAND[ny*GW+nx]){wet=true;break;}}
      I.SAND[y3*GW+x3]=wet;
    }
    I.pland=tilePath(I,false,9);I.pgrass=tilePath(I,true,8);
    /* palms */
    var cand=[];
    for(var yy=0;yy<GH;yy++)for(var xx=0;xx<GW;xx++){
      if(!I.LAND[yy*GW+xx]||!I.SAND[yy*GW+xx])continue;
      cand.push([xx,yy,hash(xx*7+3+sd,yy*11+5+sd)]);
    }
    cand.sort(function(a,b){return a[2]-b[2];});
    var pmax=Math.round(11*I.scale);
    for(var ci=0;ci<cand.length&&I.palms.length<pmax;ci++){
      var px=cand[ci][0],py=cand[ci][1],ok=true;
      for(var k=0;k<I.palms.length;k++){
        if(Math.abs(I.palms[k].x-px)<4&&Math.abs(I.palms[k].y-py)<4){ok=false;break;}}
      if(!ok)continue;
      I.cells[py*GW+px]={t:'deco'};
      I.palms.push({x:px,y:py,s:0.80+hash(px,py)*0.42,ph:hash(px,py+5)*6.3});
    }
  }
  return I;
}
var CATALOG=[
 {key:'sandbar',name:'Sandbar Flats',type:'land',scale:0.62,seed:41,price:2500,blurb:'a cosy little outcrop'},
 {key:'halfmoon',name:'Halfmoon Isle',type:'land',scale:0.85,seed:97,price:5000,blurb:'roomy, with soft beaches'},
 {key:'greenreach',name:'Greenreach',type:'land',scale:1.08,seed:163,price:9000,blurb:'a sprawling green giant'},
 {key:'shallows',name:'The Shallows',type:'water',scale:0,seed:11,price:4000,blurb:'open water for aquatic mining'},
 {key:'coraldeep',name:'Coral Deep',type:'water',scale:0,seed:77,price:12000,rich:true,blurb:'rich waters - extra pearls'}
];
/* a long, auto-named chart of islands for sale */
(function(){
  var PRE=['Coral','Breezy','Sunny','Misty','Turtle','Lagoon','Mango','Pebble','Drift','Star',
           'Moss','Ember','Foggy','Sail','Tide','Palm','Cocoa','Marble','Whisper','Cinnamon',
           'Barnacle','Lantern','Puffin','Velvet','Ginger','Thistle','Biscuit','Harbour'];
  var SUF=[' Atoll',' Key',' Cay',' Reef',' Rock',' Haven',' Hollow',' Shoal',' Rise',' Cove',' Bank',' Spit'];
  for(var i=0;i<28;i++){
    var h1=hash(i*3+1,911),h2=hash(i*7+2,733),h3=hash(i*11+5,577);
    var water=h1<0.3,scale=0.55+h2*0.6;
    var price=water?(3000+Math.round(h3*9000/100)*100):(Math.round((2000+scale*9000)/100)*100);
    var nm=PRE[Math.floor(h2*PRE.length)]+SUF[Math.floor(h3*SUF.length)];
    CATALOG.push({key:'g'+i,name:nm,type:water?'water':'land',scale:water?0:scale,
      seed:1000+i*37,price:price,rich:water&&h3>0.6,
      blurb:water?(h3>0.6?'rich waters - extra pearls':'open water for aquatic mining')
                 :(scale>0.95?'a sprawling giant':(scale<0.7?'a cosy little outcrop':'roomy, with soft beaches'))});
  }
})();
function catByKey(k){for(var i=0;i<CATALOG.length;i++)if(CATALOG[i].key===k)return CATALOG[i];return null;}
/* neighbour NPCs with their own half-built factories and stories */
var EMPLOYEES=[
 {name:'Sparky',c1:'#ffd23f',c2:'#ff8a5b'},
 {name:'Fuse',c1:'#7ce7a2',c2:'#2f7fe0'},
 {name:'Ampy',c1:'#ff6b9d',c2:'#fff4d6'},
 {name:'Dynamo',c1:'#c07bff',c2:'#ffd23f'},
 {name:'Ohm',c1:'#3fc4e8',c2:'#fff4d6'},
 {name:'Jolt',c1:'#ff8a5b',c2:'#2b2a45'}];
var LOREPOOL=[
 'They say anomalies are bits that dreamed too hard.',
 'The Mantis Guild once priced one bit at a hundred coins. Chaos.',
 'The parrot? Retired pirate. The prizes are his old treasure.',
 'The crab owns every island you can see. And several you cannot.',
 'Bit grows back, you know. The islands hum it out of the sea.',
 'I am saving for a super miner. Forty more years, by my count.',
 'A gateway once dropped a pearl on my head. Best day of my life.',
 'Never feed an auto seller anomalies. I learned this twice.',
 'My factory? A work in progress. The belts confuse me.',
 'The mantis and the crab are cousins. Do not ask how.',
 'Coral Deep glows at night. Nobody asks why anymore.',
 'One day I will automate everything and just nap.',
 'The sea whispers prices if you listen. Usually about seven.',
 'I traded my boat for a compressor. No regrets. Some regrets.'];
var NPCS=[
 {name:'Barnaby the Gull',c1:'#e8ecf2',c2:'#f7b32b',seed:301},
 {name:'Tilly the Turtle',c1:'#5fbf77',c2:'#c98b4b',seed:317},
 {name:'Momo the Otter',c1:'#a5764e',c2:'#e8cfa8',seed:331},
 {name:'Ferdinand the Frog',c1:'#69c94f',c2:'#fff4d6',seed:347},
 {name:'Pip the Sandpiper',c1:'#d9c6a5',c2:'#6d6790',seed:359},
 {name:'Greta the Goose',c1:'#f2f2f2',c2:'#ff8a5b',seed:373},
 {name:'Salty the Seal',c1:'#9aa4b5',c2:'#e8ecf2',seed:389},
 {name:'Inka the Ibis',c1:'#ff6b9d',c2:'#2b2a45',seed:401}];
NPCS.forEach(function(n,i){
  n.lore=[];
  for(var k=0;k<3;k++)n.lore.push(LOREPOOL[Math.floor(hash(n.seed,k*13+7)*LOREPOOL.length)]);
  n.isle={key:'npc'+i,name:n.name.split(' ')[0]+"'s Island",type:'land',
    scale:0.6+hash(n.seed,3)*0.45,seed:n.seed};
});
function genNpcIsle(n){
  var I=genIsle(n.isle);
  I.npc=n;I.owned=false;
  /* their half-built factory, seeded */
  var back=A;A=I;
  var tries=0,want=[['mini',1],['miner',2],['seller',2],['mini',1]];
  for(var w=0;w<want.length;w++){
    var t=want[w][0];
    for(tries=0;tries<160;tries++){
      var x=2+Math.floor(hash(n.seed+w,tries)*(GW-6)),y=2+Math.floor(hash(tries,n.seed-w)*(GH-4));
      if(canPlace(t,x,y)){place(t,x,y,0);break;}
    }
  }
  /* a few belts near the first machine */
  var m=I.structs.filter(function(o){return o.t!=='gw';})[0];
  if(m){
    var bx=m.x+sizeOf(m.t),by=m.y;
    for(var b=0;b<5;b++){
      if(canPlace('belt',bx+b,by))place('belt',bx+b,by,0);else break;}
  }
  /* the npc stands on their beach */
  var spot=findRegionSpot(I,1,1,ICX,ICY+IAY0*0.4,true)||{x:Math.round(GW/2),y:Math.round(GH/2)};
  I.cells[spot.y*GW+spot.x]={t:'npc'};
  I.npcSpot={x:spot.x,y:spot.y,wx:cx(spot.x)+TS/2,wy:cy(spot.y)+TS-2};
  A=back;
  return I;
}
function isOwned(key){return ISLES.some(function(I){return I.cat===key;});}

/* ---------- active-island context ---------- */
var ISLES=[genIsle({key:'home',name:'Home Island',type:'land',scale:1,seed:0,home:true})];
var A=ISLES[0],CURI=ISLES[0];
function cell(x,y){return (x>=0&&y>=0&&x<GW&&y<GH)?A.cells[y*GW+x]:undefined;}
function setCell(x,y,v){if(x>=0&&y>=0&&x<GW&&y<GH)A.cells[y*GW+x]=v;}
function isLand(x,y){return x>=0&&y>=0&&x<GW&&y<GH&&A.LAND[y*GW+x];}
function inGrid(x,y){return x>=0&&y>=0&&x<GW&&y<GH;}

/* ---------- game state ---------- */
var S={bag:{mini:0,bit:0,large:0,sup:0,anom:0,shell:0,pearl:0,ultra:0,lsup:0,lultra:0},
  unlocked:{bit:true},cur:'bit',gwUnlocked:false,ultraUnlocked:false,
  coins:600,stock:{belt:0,mini:0,miner:0,seller:0,scan:0,gate:0,sup:0,ult:0,comp:0,craft:0,gw:0,aqua:0,dredge:0},
  price:7.5,trend:0,hist:[],mkT:0,ptT:0,newsT:0,news:'',
  pts:0,rew:0,supUnlocked:false,
  tool:'belt',dir:0,isle:0,
  shop:false,inv:false,parrot:false,land:false,ltab:'own',confirm:null,power:false,moveNpc:null,scfg:null,ccfg:null,linking:null,crabP:null,lore:null,loreN:0,
  amt:'',amtFocus:false,sscroll:0,sscrollMax:0,iscroll:0,iscrollMax:0,lscroll:0,lscrollMax:0,
  renIdx:-1,renTxt:'',
  sold:0,mined:0,tut:0,tutT:0,didPickup:false,sawParrot:false,sawLand:false,pops:[],spark:[],
  hint:'Visit the mantis stall to trade',hintT:6};

function canPlace(t,x,y){var wN=sizeW(t),hN=sizeH(t),ter=TERRAIN[t]||'land';
  if(t==='crab'&&A.home)return false;   /* the boss crab allows no branch offices at HQ */
  for(var j=0;j<hN;j++)for(var i2=0;i2<wN;i2++){
    if(!inGrid(x+i2,y+j))return false;
    if(cell(x+i2,y+j))return false;
    var land=isLand(x+i2,y+j);
    if(ter==='land'&&!land)return false;
    if(ter==='water'&&land)return false;
  } return true;}
function place(t,x,y,dir){
  if(t==='belt'){setCell(x,y,{t:'belt',dir:dir||0});return null;}
  var s={t:t,x:x,y:y,dir:dir||0,tm:Math.random()*2,pop:0,spin:Math.random()*6,k:0,puff:0,lid:0};
  if(t==='seller'){s.dmg=0;s.thr=2+Math.floor(Math.random()*2);s.brk=false;s.heat=0;s.why='';}
  if(t==='scan'){s.filt='any';s.mode='open';s.gates=[];}
  if(t==='gate'){s.open=true;s.ext=1;s.rdir=1;s.armed=false;s.flash=0;}
  if(t==='sep'){s.k=0;s.spin=0;s.lastOut=-1;s.pulse=0;}
  if(t==='gen'||t==='lgen'){s.fuel=(t==='lgen'?260:150);s.feed=0;s.spin=0;s.warn=0;}
  if(t==='comp'){s.buf={mini:0,bit:0};s.press=0;}
  if(t==='craft'){s.ri=0;s.prog=0;s.made=0;}
  A.structs.push(s);
  var wN=sizeW(t),hN=sizeH(t);
  for(var j=0;j<hN;j++)for(var i2=0;i2<wN;i2++)setCell(x+i2,y+j,{t:'occ',s:s});
  return s;}
function structAt(x,y){var c=cell(x,y);return (c&&c.t==='occ')?c.s:null;}
function removeAt(x,y){
  var c=cell(x,y);if(!c)return false;
  if(c.t==='stall'||c.t==='deco'||c.t==='npc')return false;
  if(c.t==='belt'){setCell(x,y,null);S.stock.belt++;
    A.items=A.items.filter(function(it){return !(it.cx===x&&it.cy===y);});return true;}
  var s=c.s,wN=sizeW(s.t),hN=sizeH(s.t);
  for(var j=0;j<hN;j++)for(var i2=0;i2<wN;i2++)setCell(s.x+i2,s.y+j,null);
  A.structs.splice(A.structs.indexOf(s),1);S.stock[s.t]++;
  if(s.t==='gate')A.structs.forEach(function(o){if(o.t==='scan')o.gates=o.gates.filter(function(g){return !(g[0]===s.x&&g[1]===s.y);});});
  if(S.scfg===s)S.scfg=null;
  if(S.ccfg===s)S.ccfg=null;
  A.items=A.items.filter(function(it){return !(it.cx>=s.x&&it.cx<s.x+wN&&it.cy>=s.y&&it.cy<s.y+hN);});
  return true;}

/* ---------- palms ---------- */
var PALM_COST=25;
function askClearPalm(x,y){
  var idx=-1;
  for(var i=0;i<A.palms.length;i++)if(A.palms[i].x===x&&A.palms[i].y===y){idx=i;break;}
  if(idx<0)return false;
  if(S.coins<PALM_COST){S.hint='Clearing a palm costs '+PALM_COST+'c';S.hintT=2.5;
    beep(160,0.12,'sawtooth',0.04);return true;}
  S.confirm={x:x,y:y,title:'Cut down this palm?',body:'It costs '+PALM_COST+'c and the tree is gone for good.',
    yes:'CUT IT',no:'KEEP IT',f:function(){doClearPalm(x,y);}};
  beep(520,0.05,'sine',0.04);
  return true;
}
function doClearPalm(x,y){
  var idx=-1;
  for(var i=0;i<A.palms.length;i++)if(A.palms[i].x===x&&A.palms[i].y===y){idx=i;break;}
  if(idx<0)return false;
  if(S.coins<PALM_COST){S.hint='Clearing a palm costs '+PALM_COST+'c';S.hintT=2.5;
    beep(160,0.12,'sawtooth',0.04);return true;}
  S.coins-=PALM_COST;A.palms.splice(idx,1);setCell(x,y,null);
  pop(cx(x)+TS/2,cy(y)+TS/2,'-'+PALM_COST+'c',COL.gold);
  sparkle(cx(x)+TS/2,cy(y)+TS/2,'#4fbf58',10);
  S.hint='Palm cleared - that square is buildable now';S.hintT=3;

var HOME=ISLES[0];
function findRegionSpot(I,w,h,tx,ty,needSand){
  var best=null,bs=1e9;
  for(var y=1;y<GH-h;y++)for(var x=1;x<GW-w;x++){
    var ok=true,near=false;
    for(var j=0;j<h&&ok;j++)for(var i=0;i<w;i++){
      if(!I.LAND[(y+j)*GW+x+i]||I.cells[(y+j)*GW+x+i]){ok=false;break;}
      if(I.SAND[(y+j)*GW+x+i])near=true;}
    if(!ok||(needSand&&!near))continue;
    var sc=Math.abs(cx(x)+w*TS/2-tx)+Math.abs(cy(y)+h*TS/2-ty);
    if(sc<bs){bs=sc;best={x:x,y:y};}
  }
  return best;
}
var STALL=(function(){
  var b=findRegionSpot(HOME,4,2,ICX-IAX0*0.48,ICY+IAY0*0.5,true)||{x:3,y:GH-4};
  b.w=4;b.h=2;b.wx=cx(b.x)+TS*2;b.wy=cy(b.y)+TS*2-4;
  for(var j=0;j<2;j++)for(var i=0;i<4;i++)HOME.cells[(b.y+j)*GW+b.x+i]={t:'stall'};
  return b;
})();
var PARROT=(function(){

  b.wx=cx(b.x)+TS/2;b.wy=cy(b.y)+TS-2;

})();
var LORD=(function(){

  b.wx=cx(b.x)+TS/2;b.wy=cy(b.y)+TS-2;

/* Volt the axolotl runs the island's generator */
var VOLT=(function(){
  var back=A;A=HOME;
  /* keep the power yard well clear of the stall, the parrot and the landlord */
  var others=[[STALL.x+2,STALL.y+1],[PARROT.x,PARROT.y],[LORD.x,LORD.y]];
  function clearance(x,y){
    var m=1e9;
    for(var i=0;i<others.length;i++){
      var d=Math.abs(others[i][0]-x)+Math.abs(others[i][1]-y);
      if(d<m)m=d;
    }
    return m;
  }
  var best=null,bs=-1;
  for(var y=1;y<GH-4;y++)for(var x=1;x<GW-3;x++){
    if(!canPlace('gen',x,y))continue;
    if(!isLand(x,y+3)||HOME.cells[(y+3)*GW+x])continue;   /* room for Volt below it */
    var sc=clearance(x+1,y+1);
    if(sc>bs){bs=sc;best={x:x,y:y};}
  }
  if(!best)return null;
  var g=place('gen',best.x,best.y,0);
  var spot={x:g.x,y:g.y+3};
  HOME.cells[spot.y*GW+spot.x]={t:'npc'};
  A=back;
  return {gen:g,x:spot.x,y:spot.y,wx:cx(spot.x)+TS/2,wy:cy(spot.y)+TS-2,minDist:bs};
})();

/* ---------- mining ---------- */
function outlets(m){var o=[],wN=sizeW(m.t),hN=sizeH(m.t),i;
  for(i=0;i<wN;i++){o.push([m.x+i,m.y-1,0,-1]);o.push([m.x+i,m.y+hN,0,1]);}
  for(i=0;i<hN;i++){o.push([m.x-1,m.y+i,-1,0]);o.push([m.x+wN,m.y+i,1,0]);}
  return o;}
function beltFree(x,y,p){
  for(var i=0;i<A.items.length;i++){var it=A.items[i];
    if(it.cx===x&&it.cy===y&&Math.abs(it.p-p)<0.34)return false;} return true;}
function mineKind(t,big){
  var r=Math.random(),rich=A.rich;
  if(t==='miner')return r<0.07?'anom':(big?'large':(r<0.14?'large':'bit'));
  if(t==='mini')return r<0.07?'anom':'mini';
  if(t==='sup')return r<0.07?'anom':(big?'lsup':'sup');
  if(t==='ult')return r<0.07?'anom':(big?'lultra':'ultra');
  if(t==='aqua'){
    if(r<0.05)return 'coin';
    if(r<(rich?0.20:0.13))return 'pearl';
    if(r<0.32)return 'shell';
    if(r<0.39)return 'anom';
    if(r<0.50)return 'mini';
    return 'bit';
  }
  /* dredge */
  if(r<0.06)return 'coin';
  if(r<(rich?0.15:0.10))return 'pearl';
  if(r<0.55)return 'shell';
  if(r<0.62)return 'anom';
  return 'mini';
}
function emit(m,kind){
  var o=outlets(m),belts=[],spots=[];
  for(var i=0;i<o.length;i++){var q=o[i],c=cell(q[0],q[1]);
    if(c&&c.t==='occ'&&(c.s.t==='sep'||c.s.t==='gen'||c.s.t==='lgen')&&beltFree(q[0],q[1],0.2))belts.push(q);
    else if(c&&c.t==='belt'&&!(DX[c.dir]===-q[2]&&DY[c.dir]===-q[3])&&beltFree(q[0],q[1],0.2))belts.push(q);
    else if(inGrid(q[0],q[1])&&!c)spots.push(q);}
  var mx=cx(m.x)+TS*sizeW(m.t)/2,my=cy(m.y)+TS*sizeH(m.t)/2;
  if(belts.length){var b=belts[(m.k++)%belts.length];
    A.items.push({cx:b[0],cy:b[1],p:0.15,kind:kind});
    sparkle(cx(b[0])+TS/2,cy(b[1])+TS/2,kind==='sup'?COL.sup:COL.bit,4);return;}
  var t=spots.length?spots[Math.floor(Math.random()*spots.length)]:o[Math.floor(Math.random()*o.length)];
  if(A.loose.length<70)A.loose.push({x0:mx,y0:my,
    x1:cx(t[0])+TS/2+(Math.random()*10-5),y1:cy(t[1])+TS/2+(Math.random()*10-5),
    t:0,dur:0.55,land:false,bob:Math.random()*6,x:mx,y:my,z:0,kind:kind});

function produce(m){

    sparkle(cx(m.x)+TS*sizeOf(m.t)/2,cy(m.y)+TS,COL.gold,5);
    beep(880,0.06,'sine',0.04);return;
  }

  emit(m,kind);beep(700,0.04,'triangle',0.025);

function beltInfo(x,y){
  var c=cell(x,y);if(!c)return null;
  if(c.t==='belt')return {dir:c.dir};
  if(c.t==='occ'&&c.s.t==='gate')return {dir:(c.s.armed?c.s.rdir:c.s.dir),g:c.s};
  if(c.t==='occ'&&c.s.t==='sep')return {dir:sepPlan(c.s,-1),sep:c.s};
  return null;
}
/* a square that will take an item handed to it from direction d */
function acceptsFrom(x,y,d){
  var c=cell(x,y);
  if(!c)return false;
  if(c.t==='belt')return c.dir!==((d+2)%4);         /* not pointing straight back at us */
  if(c.t==='occ'){
    var k=c.s.t;
    if(k==='sep')return true;
    if(k==='gate')return (c.s.armed?c.s.rdir:c.s.dir)!==((d+2)%4);
    return k==='seller'||k==='comp'||k==='craft'||k==='gw'||k==='gen'||k==='lgen';
  }
  return false;
}
function sepOuts(sp,fromRev){
  var outs=[];
  for(var d=0;d<4;d++){
    if(d===fromRev)continue;                        /* never straight back where it came from */
    if(acceptsFrom(sp.x+DX[d],sp.y+DY[d],d))outs.push(d);
  }
  return outs;
}
/* which way the separator intends to send the item it is holding */
function sepPlan(sp,fromRev){
  var outs=sepOuts(sp,fromRev);
  if(!outs.length){outs=sepOuts(sp,-1);}
  if(!outs.length)return sp.lastOut>=0?sp.lastOut:0;
  return outs[sp.k%outs.length];
}
var SELLER_COOL=1.1,SELLER_LIMIT=6;
function sellerTake(se,kind,nx,ny){
  if(se.brk)return false;
  se.heat=(se.heat||0)+1;
  if(se.heat>SELLER_LIMIT){
    se.brk=true;se.why='overload';
    S.hint='An auto seller jammed - too much arriving at once! Split the flow with a SEPARATOR';S.hintT=5;
    sparkle(cx(nx)+TS/2,cy(ny)+TS/2,'#ffb347',10);
    beep(140,0.35,'sawtooth',0.08);
    return false;
  }
  if(kind==='anom'){
    se.dmg++;sparkle(cx(nx)+TS/2,cy(ny)+TS/2,COL.anom2,8);
    if(se.dmg>=se.thr){se.brk=true;se.why='anomaly';S.hint='An anomaly broke an auto seller! Click it to repair (45c)';S.hintT=4;
      beep(120,0.3,'sawtooth',0.07);}
    else beep(200,0.15,'sawtooth',0.05);
    return true;
  }
  var v=Math.max(1,Math.round(priceOf(kind)));
  S.coins+=v;S.sold++;se.lid=1;unlock(kind);
  pop(cx(nx)+TS/2,cy(ny),'+'+v+'c',COL.gold);
  sparkle(cx(nx)+TS/2,cy(ny)+TS/2,COL.gold,5);beep(1180,0.06,'sine',0.05);
  return true;
}
function allGateways(){
  var out=[];
  for(var i=0;i<ISLES.length;i++){var I=ISLES[i];
    if(!I.owned)continue;
    for(var j=0;j<I.structs.length;j++)if(I.structs[j].t==='gw')out.push({s:I.structs[j],isle:I});}
  return out;
}
function handOff(it,idx,nx,ny,d){
  var nb=beltInfo(nx,ny),nc=cell(nx,ny);
  if(nb){it.cx=nx;it.cy=ny;it.p=0;return true;}
  if(nc&&nc.t==='occ'&&nc.s.t==='seller'){
    if(sellerTake(nc.s,it.kind,nx,ny)){A.items.splice(idx,1);return true;}
    it.p=1;return false;
  }
  if(nc&&nc.t==='occ'&&(nc.s.t==='comp'||nc.s.t==='craft'||nc.s.t==='gw'||nc.s.t==='gen'||nc.s.t==='lgen')){
    it.cx=nx;it.cy=ny;it.p=1;return true;    /* let the normal machine code eat it next tick */
  }
  it.p=1;return false;
}
function updateItems(dt){
  var sp=2.3;
  for(var i=A.items.length-1;i>=0;i--){
    var it=A.items[i],bi=beltInfo(it.cx,it.cy);
    if(!bi){
      var c0=cell(it.cx,it.cy);
      if(c0&&c0.t==='occ'&&c0.s.t==='gate')continue;
      A.items.splice(i,1);continue;
    }
    it.p+=sp*dt;
    if(it.p>=1){
      if(bi.g&&bi.g.armed){bi.g.armed=false;bi.g.flash=1;}   /* one item per signal */
      if(bi.sep){
        /* NB: do not name anything 'sp' here - that is the belt speed in this scope */
        var sepS=bi.sep,rev=(it.from===undefined)?-1:((it.from+2)%4);
        var outs=sepOuts(sepS,rev);
        if(!outs.length)outs=sepOuts(sepS,-1);
        if(!outs.length){it.p=1;continue;}
        var moved=false;
        for(var o=0;o<outs.length;o++){
          var d2=outs[(sepS.k+o)%outs.length];
          var tx=sepS.x+DX[d2],ty=sepS.y+DY[d2];
          if(beltInfo(tx,ty)&&!beltFree(tx,ty,0))continue;   /* that lane is busy right now */
          sepS.k=(sepS.k+o+1)%Math.max(1,outs.length);
          sepS.lastOut=d2;sepS.pulse=1;sepS.spin+=1.2;
          it.from=d2;
          handOff(it,i,tx,ty,d2);
          moved=true;break;
        }
        if(!moved)it.p=1;
        continue;
      }
      var nx=it.cx+DX[bi.dir],ny=it.cy+DY[bi.dir],nb=beltInfo(nx,ny),nc=cell(nx,ny);
      if(nb){ if(beltFree(nx,ny,0)){it.cx=nx;it.cy=ny;it.p-=1;it.from=bi.dir;} else it.p=1; }
      else if(nc&&nc.t==='occ'&&nc.s.t==='seller'){
        if(sellerTake(nc.s,it.kind,nx,ny))A.items.splice(i,1);
        else it.p=1;
      }
      else if(nc&&nc.t==='occ'&&nc.s.t==='gw'){

        for(var g2=0;g2<gws.length;g2++)if(gws[g2].s===nc.s){gi=g2;break;}
        var pt=gws.length>1?gws[(gi+1)%gws.length]:null;
        A.items.splice(i,1);
        sparkle(cx(nc.s.x)+TS*1.5,cy(nc.s.y)+TS*1.5,COL.bit,6);
        if(pt){
          var back=A;A=pt.isle;
          emit(pt.s,it.kind);
          sparkle(cx(pt.s.x)+TS*1.5,cy(pt.s.y)+TS*1.5,COL.bit2,6);
          A=back;
          beep(980,0.07,'sine',0.04);
        }
        else emit(nc.s,it.kind);
      }
      else if(nc&&nc.t==='occ'&&(nc.s.t==='gen'||nc.s.t==='lgen')){
        var gg=nc.s;A.items.splice(i,1);
        var got=feedGen(gg,it.kind,1);
        pop(cx(nx)+TS/2,cy(ny),'+'+got.toFixed(1)+' fuel','#ffd23f');
        sparkle(cx(nx)+TS/2,cy(ny)+TS/2,'#ffb347',4);
        beep(300+got*20,0.06,'square',0.04);
      }
      else if(nc&&nc.t==='occ'&&nc.s.t==='comp'){
        var cs=nc.s;A.items.splice(i,1);
        if(it.kind==='mini'){cs.buf.mini++;
          if(cs.buf.mini>=4){cs.buf.mini-=4;cs.press=1;emit(cs,'bit');
            pop(cx(cs.x)+TS,cy(cs.y),'+1 bit',COL.bit2);beep(520,0.08,'square',0.05);}}
        else if(it.kind==='bit'){cs.buf.bit++;
          if(cs.buf.bit>=9){cs.buf.bit-=9;cs.press=1;emit(cs,'sup');
            pop(cx(cs.x)+TS,cy(cs.y),'+1 SUPER BIT',COL.sup2);
            sparkle(cx(cs.x)+TS,cy(cs.y)+TS,COL.sup,10);beep(660,0.1,'square',0.06);}}
        else emit(cs,it.kind);
      }
      else if(nc&&nc.t==='occ'&&nc.s.t==='craft'){
        var cf=nc.s;A.items.splice(i,1);
        if(it.kind==='anom')emit(cf,'anom');
        else{cf.prog+=MULT[it.kind];
          var rc=RECIPES[cf.ri];
          if(cf.prog>=rc[1]){cf.prog-=rc[1];S.stock[rc[0]]++;cf.made=1;
            pop(cx(cf.x)+TS,cy(cf.y),itemName(rc[0])+' crafted!',COL.gold);
            sparkle(cx(cf.x)+TS,cy(cf.y)+TS,COL.gold,10);beep(760,0.09,'triangle',0.06);}}
      }
      else if(nc){it.p=1;}
      else{
        A.items.splice(i,1);
        if(A.loose.length<70){var lx=cx(it.cx)+TS/2,ly=cy(it.cy)+TS/2;
          A.loose.push({x0:lx,y0:ly,x1:lx+DX[bi.dir]*18,y1:ly+DY[bi.dir]*18,t:0,dur:0.35,
            land:false,bob:0,x:lx,y:ly,z:0,kind:it.kind});}
      }
    }
  }
}
function updateLoose(dt){
  for(var i=A.loose.length-1;i>=0;i--){var l=A.loose[i];
    if(!l.land){l.t+=dt;var u=clamp(l.t/l.dur,0,1);
      l.x=l.x0+(l.x1-l.x0)*u;l.y=l.y0+(l.y1-l.y0)*u;l.z=Math.sin(u*Math.PI)*22;
      if(u>=1){l.land=true;l.z=0;
        var gx=Math.floor((l.x-OX)/TS),gy=Math.floor((l.y-OY)/TS);
        if(beltInfo(gx,gy)){A.items.push({cx:gx,cy:gy,p:0.5,kind:l.kind});A.loose.splice(i,1);continue;}
        sparkle(l.x,l.y,l.kind==='sup'?COL.sup:COL.bit,3);}
    } else {l.bob+=dt*3;l.z=Math.abs(Math.sin(l.bob))*1.5;}
  }
}
function kindMatch(filt,k){return filt==='any'||filt===k;}
function scanDetect(sc){
  var fx=sc.x+DX[sc.dir],fy=sc.y+DY[sc.dir],i;
  for(i=0;i<A.items.length;i++){var it=A.items[i];
    if(it.cx===fx&&it.cy===fy&&kindMatch(sc.filt,it.kind))return true;}
  for(i=0;i<A.loose.length;i++){var l=A.loose[i];
    if(l.land&&Math.floor((l.x-OX)/TS)===fx&&Math.floor((l.y-OY)/TS)===fy&&kindMatch(sc.filt,l.kind))return true;}
  return false;
}
function updateScanners(dt){
  for(var i=0;i<A.structs.length;i++){var sc=A.structs[i];
    if(sc.t==='scan'){
      sc.det=scanDetect(sc);
      if(sc.det&&!sc.wasDet){        /* rising edge: arm the linked redirectors once */
        for(var g=0;g<sc.gates.length;g++){
          var gs=structAt(sc.gates[g][0],sc.gates[g][1]);
          if(gs&&gs.t==='gate')gs.armed=true;
        }
      }
      sc.wasDet=sc.det;
    }
  }
  for(var j=0;j<A.structs.length;j++){var gt=A.structs[j];
    if(gt.t==='gate')gt.flash=Math.max(0,(gt.flash||0)-dt*2);
  }
}

/* ---------- share codes: islands + gifts (works over any chat app) ---------- */
function encodeCode(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/=+$/,'');}
function decodeCode(str){try{return JSON.parse(decodeURIComponent(escape(atob(str.trim()))));}catch(e){return null;}}
function isleCode(I){
  var belts=[];
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var c=I.cells[y*GW+x];
    if(c&&c.t==='belt')belts.push([x,y,c.dir]);}
  return encodeCode({t:'isle',n:I.name,c:I.cat,b:belts,
    s:I.structs.map(function(o){return [o.t,o.x,o.y,o.dir];}),
    p:I.palms.map(function(a){return [a.x,a.y];})});
}
function dropTempIsles(){
  for(var i=ISLES.length-1;i>=1;i--)if(!ISLES[i].owned)ISLES.splice(i,1);
  if(S.isle>=ISLES.length)gotoIsle(0);
}
function visitCode(code){
  var d=decodeCode(code);
  if(!d||d.t!=='isle'){S.hint='That is not an island code';S.hintT=3;beep(160,0.1,'sawtooth',0.04);return;}
  var cat=catByKey(d.c)||{key:'home',name:'Friend Island',type:'land',scale:1,seed:0};
  var I=genIsle(cat);I.owned=false;I.guest=true;I.name=(d.n||'Friend')+' (visiting)';
  var back=A;A=I;
  for(var q=0;q<GW*GH;q++){var cq=I.cells[q];if(cq&&(cq.t==='belt'||cq.t==='occ'))I.cells[q]=null;}
  I.structs=[];
  if(d.p){var keep={};d.p.forEach(function(a){keep[a[0]+','+a[1]]=1;});
    for(var pi=I.palms.length-1;pi>=0;pi--){var pp=I.palms[pi];
      if(!keep[pp.x+','+pp.y]){I.cells[pp.y*GW+pp.x]=null;I.palms.splice(pi,1);}}}
  (d.s||[]).forEach(function(a){if(canPlace(a[0],a[1],a[2]))place(a[0],a[1],a[2],a[3]||0);});
  (d.b||[]).forEach(function(a){if(inGrid(a[0],a[1])&&!I.cells[a[1]*GW+a[0]])I.cells[a[1]*GW+a[0]]={t:'belt',dir:a[2]};});
  A=back;
  dropTempIsles();ISLES.push(I);gotoIsle(ISLES.length-1);
  S.land=false;S.hint='Visiting '+(d.n||'a friend')+"'s island - look, don't touch!";S.hintT=4;
  beep(760,0.08,'triangle',0.05);
}
function giftCode(kind,amt){
  return encodeCode({t:'gift',k:kind,a:amt,id:Math.random().toString(36).slice(2,10)});
}
function redeemGift(code){
  var d=decodeCode(code);
  if(!d||d.t!=='gift'){S.hint='That is not a gift code';S.hintT=3;beep(160,0.1,'sawtooth',0.04);return;}
  var used={};try{used=JSON.parse(localStorage.getItem('bm_gifts')||'{}');}catch(e){}
  if(d.id&&used[d.id]){S.hint='That gift was already opened';S.hintT=3;return;}
  if(d.k==='coins')S.coins+=Math.max(0,Math.min(5000,d.a|0));
  else if(S.bag[d.k]!==undefined)gain(d.k,Math.max(0,Math.min(999,d.a|0)));
  else return;
  if(d.id){used[d.id]=1;try{localStorage.setItem('bm_gifts',JSON.stringify(used));}catch(e){}}
  var what=d.k==='coins'?(d.a+' coins'):(d.a+' '+KINDNAME[d.k].toLowerCase());
  S.hint='A gift! You received '+what;S.hintT=4;
  pop(W/2,H/2,'+'+what,COL.gold);
  beep(700,0.07,'triangle',0.06);setTimeout(function(){beep(1050,0.09,'triangle',0.06);},90);save();
}

/* ---------- islands: buy / switch ---------- */
function gotoIsle(i){
  i=clamp(i,0,ISLES.length-1);
  S.isle=i;CURI=ISLES[i];A=CURI;
  S.scfg=null;S.ccfg=null;S.linking=null;
  S.hint=CURI.name+(CURI.type==='water'?' - open water, build aquatic machines':'');S.hintT=2.5;
}
function buyIsle(cat){
  if(isOwned(cat.key)){S.hint='You already own '+cat.name;S.hintT=2;return;}
  if(S.coins<cat.price){S.hint='Not enough coins for '+cat.name;S.hintT=2.5;beep(160,0.12,'sawtooth',0.04);return;}
  S.coins-=cat.price;
  var I=genIsle(cat);
  ISLES.push(I);
  /* every island comes with 2 gateways, a large generator with an employee, and a concierge */
  var back=A;A=I;
  function drop(kind,cxr,cyr){
    for(var r=0;r<14;r++)for(var yy=cyr-r;yy<=cyr+r;yy++)for(var xx=cxr-r;xx<=cxr+r;xx++){
      if(canPlace(kind,xx,yy)){return place(kind,xx,yy,0);}}
    return null;
  }
  drop('gw',Math.round(GW/2)-1,Math.round(GH/2)-1);
  var lg=drop('lgen',Math.round(GW/2)+6,Math.round(GH/2)-1);
  if(lg){
    var emp=EMPLOYEES[ISLES.length%EMPLOYEES.length];
    I.emp={name:emp.name,c1:emp.c1,c2:emp.c2,x:lg.x,y:lg.y+sizeOf('lgen'),
      wx:cx(lg.x)+TS*1.5,wy:cy(lg.y)+TS*(sizeOf('lgen')+0.9)};
  }
  drop('crab',Math.round(GW/2)-7,Math.round(GH/2)+3);
  A=back;
  S.stock.gw++;
  S.hint=cat.name+' is yours! It has a gateway - place your free one to link it';S.hintT=5;
  chaChing(true);
  save();
}

var T=0;
function drawSea(){
  X.fillStyle=COL.sea;X.fillRect(0,0,W,H);
  for(var i=0;i<30;i++){
    var yy=(i*22+(T*8)%22);
    X.globalAlpha=0.10+0.06*Math.sin(i*1.3+T);
    X.fillStyle=COL.sea2;X.beginPath();
    for(var x=0;x<=W;x+=20){var h=Math.sin(x*0.02+T*1.1+i)*3;
      if(x===0)X.moveTo(x,yy+h);else X.lineTo(x,yy+h);}

  }

  if(A.type==='water'){

  X.fillStyle=COL.sand;X.fill(A.pland);

  for(var k=0;k<44;k++){var a3=hash(k,17)*6.283,r2=hash(k,23);

function drawBit(px,py,sc,glow,kind){

  }

      X.beginPath();X.arc(0,0,9,0,6.3);X.fill();X.globalAlpha=1;}
    var g2=X.createRadialGradient(-2,-3,1,0,0,7);
    g2.addColorStop(0,'#ffffff');g2.addColorStop(0.6,COL.pearl);g2.addColorStop(1,'#cfc3e8');
    X.fillStyle=g2;X.beginPath();X.arc(0,0,6.5,0,6.3);X.fill();
    X.strokeStyle='#a99ac9';X.lineWidth=1.5;X.stroke();

function spark(px,py,w,h){
  var mn=1e9,mx=-1e9,i;
  for(i=0;i<S.hist.length;i++){mn=Math.min(mn,S.hist[i]);mx=Math.max(mx,S.hist[i]);}
  if(mx-mn<0.5)mx=mn+0.5;
  rr(px,py,w,h,5);fill('#262340');
  X.save();X.beginPath();X.roundRect(px,py,w,h,5);X.clip();
  X.beginPath();
  for(i=0;i<S.hist.length;i++){
    var X0=px+i/(S.hist.length-1)*w,Y0=py+h-3-((S.hist[i]-mn)/(mx-mn))*(h-6);
    if(i===0)X.moveTo(X0,Y0);else X.lineTo(X0,Y0);}
  X.strokeStyle=S.trend>=0?'#6bf28a':'#ff6b6b';X.lineWidth=2;X.stroke();
  X.lineTo(px+w,py+h);X.lineTo(px,py+h);X.closePath();
  X.globalAlpha=0.18;X.fillStyle=S.trend>=0?'#6bf28a':'#ff6b6b';X.fill();X.globalAlpha=1;
  X.restore();
}

C.addEventListener('mousedown',function(e){
  if(e.button!==0)return;
  if(!AC)beep(440,0.01,'sine',0.001);
  var i;
  if(!LAUNCHED){
    if(mouse.sx>=launchBtn.x&&mouse.sx<=launchBtn.x+launchBtn.w&&mouse.sy>=launchBtn.y&&mouse.sy<=launchBtn.y+launchBtn.h){
      openGameWindow();return;}
    if(playHereBtn.w&&mouse.sx>=playHereBtn.x&&mouse.sx<=playHereBtn.x+playHereBtn.w&&mouse.sy>=playHereBtn.y&&mouse.sy<=playHereBtn.y+playHereBtn.h){
      startGame();beep(700,0.06,'triangle',0.05);return;}
    return;
  }
  if(S.confirm){
    for(i=0;i<confirmBtns.length;i++){var bc=confirmBtns[i];
      if(mouse.sx>=bc.x&&mouse.sx<=bc.x+bc.w&&mouse.sy>=bc.y&&mouse.sy<=bc.y+bc.h){bc.f();return;}}
    S.confirm=null;return;
  }
  if(S.shop){
    for(i=0;i<shopBtns.length;i++){var b=shopBtns[i];
      if(mouse.sx>=b.x&&mouse.sx<=b.x+b.w&&mouse.sy>=b.y&&mouse.sy<=b.y+b.h){b.f();return;}}
    S.amtFocus=false;
    if(mouse.sx<SHX||mouse.sx>SHX+SHW||mouse.sy<SHY||mouse.sy>SHY+SHH)S.shop=false;
    return;
  }

function rotateHover(){
  if(S.shop||S.inv||S.parrot||S.land||!mouse.in)return;
  var c=cell(mouse.gx,mouse.gy);
  if(c&&c.t==='belt'){c.dir=S.dir;beep(560,0.04,'square',0.03);save();return;}
  if(c&&c.t==='occ'&&c.s.t==='scan'){c.s.dir=S.dir;beep(560,0.04,'square',0.03);save();return;}
  if(c&&c.t==='occ'&&c.s.t==='gate'){c.s.rdir=S.dir;
    S.hint='Redirector detour: '+['right','down','left','up'][S.dir];S.hintT=2;
    beep(560,0.04,'square',0.03);save();}
}
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(S.renIdx>=0){
    if(k.length===1&&/[a-zA-Z0-9 '\-]/.test(k)){if(S.renTxt.length<16)S.renTxt+=k;e.preventDefault();return;}
    if(k==='Backspace'){S.renTxt=S.renTxt.slice(0,-1);e.preventDefault();return;}
    if(k==='Enter'){
      var nm=S.renTxt.trim();
      if(nm)ISLES[S.renIdx].name=nm;
      S.renIdx=-1;beep(760,0.06,'triangle',0.05);save();e.preventDefault();return;}
    if(k==='Escape'){S.renIdx=-1;return;}
    return;
  }
  if(S.shop&&S.amtFocus){
    if(k>='0'&&k<='9'){if((S.amt||'').length<6)S.amt=(S.amt||'')+k;e.preventDefault();return;}
    if(k==='Backspace'){S.amt=(S.amt||'').slice(0,-1);e.preventDefault();return;}
    if(k==='Enter'){sellTyped();e.preventDefault();return;}
    if(k==='Escape'){S.amtFocus=false;S.shop=false;return;}
  }
  if(k==='1')S.tool='belt';
  else if(k==='2')S.tool='miner';
  else if(k==='3')S.tool='seller';
  else if(k==='i'||k==='I'){S.inv=!S.inv;S.iscroll=0;S.shop=false;S.parrot=false;S.land=false;}
  else if(k==='e'||k==='E'){S.shop=!S.shop;S.inv=false;S.parrot=false;S.land=false;S.sscroll=0;S.amtFocus=S.shop;}
  else if(k==='['){gotoIsle((S.isle-1+ISLES.length)%ISLES.length);}
  else if(k===']'){gotoIsle((S.isle+1)%ISLES.length);}
  else if(k==='Escape'){if(S.moveNpc)npcCancelMove();S.shop=false;S.inv=false;S.parrot=false;S.land=false;S.power=false;S.scfg=null;S.ccfg=null;S.crabP=null;S.lore=null;S.confirm=null;S.linking=null;S.amtFocus=false;}
  else if(k==='r'||k==='R'){S.dir=(S.dir+1)%4;rotateHover();}
  else if(k.indexOf('Arrow')===0){
    e.preventDefault();
    S.dir=k==='ArrowRight'?0:k==='ArrowDown'?1:k==='ArrowLeft'?2:3;
    rotateHover();
  }
});

/* ---------- save / load ---------- */
function save(){
  try{
    var isles=ISLES.filter(function(I){return I.owned;}).map(function(I){
      var belts=[];
      for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var c=I.cells[y*GW+x];
        if(c&&c.t==='belt')belts.push([x,y,c.dir]);}
      var st=I.structs.map(function(s){
        var o=[s.t,s.x,s.y,s.dir];
        if(s.t==='seller')o.push({dmg:s.dmg,thr:s.thr,brk:s.brk,why:s.why});
        if(s.t==='scan')o.push({filt:s.filt,mode:s.mode,gates:s.gates});
        if(s.t==='gate')o.push({rdir:s.rdir,dir:s.dir});
        if(s.t==='gen'||s.t==='lgen')o.push({fuel:s.fuel});
        if(s.t==='comp')o.push({buf:s.buf});
        if(s.t==='craft')o.push({ri:s.ri,prog:s.prog});
        if(s.big)o.push({big:true});
        return o;});
      return {cat:I.cat,name:I.name,emp:I.emp||null,b:belts,s:st,p:I.palms.map(function(a){return [a.x,a.y];})};
    });
    localStorage.setItem('bitminer7',JSON.stringify({isles:isles,isle:S.isle,
      bag:S.bag,unl:S.unlocked,cur:S.cur,coins:S.coins,stock:S.stock,price:S.price,hist:S.hist,
      mined:S.mined,sold:S.sold,pts:S.pts,rew:S.rew,supU:S.supUnlocked,gwU:S.gwUnlocked,ulU:S.ultraUnlocked,tut:S.tut,tfl:[S.didPickup?1:0,S.sawParrot?1:0,S.sawLand?1:0],npcs:{stall:[STALL.x,STALL.y],parrot:[PARROT.x,PARROT.y],lord:[LORD.x,LORD.y],volt:VOLT?[VOLT.x,VOLT.y]:null}}));
  }catch(e){}
}
function load(){
  try{
    var d=JSON.parse(localStorage.getItem('bitminer7'));if(!d)return;
    (d.isles||[]).forEach(function(di,idx){
      var I;
      if(idx===0)I=ISLES[0];
      else{
        var cat=catByKey(di.cat);if(!cat)return;
        I=genIsle(cat);ISLES.push(I);
      }
      if(di.name)I.name=di.name;
      if(di.emp){I.emp=di.emp;
        I.emp.wx=cx(I.emp.x)+TS/2;I.emp.wy=cy(I.emp.y)+TS-2;
        if(inGrid(I.emp.x,I.emp.y)&&!I.cells[I.emp.y*GW+I.emp.x])I.cells[I.emp.y*GW+I.emp.x]={t:'npc'};}
      /* reset placeable cells (keep stall/npc/deco marks) */
      var back=A;A=I;
      if(idx===0){
        for(var q=0;q<GW*GH;q++){var cq=I.cells[q];
          if(cq&&(cq.t==='belt'||cq.t==='occ'))I.cells[q]=null;}
        I.structs=[];
      }
      /* prune palms that were cleared */
      if(di.p){
        var keep={};di.p.forEach(function(a){keep[a[0]+','+a[1]]=1;});
        for(var pi=I.palms.length-1;pi>=0;pi--){var pp=I.palms[pi];
          if(!keep[pp.x+','+pp.y]){I.cells[pp.y*GW+pp.x]=null;I.palms.splice(pi,1);}}
      }
      if(idx>0)I.structs=[];
      (di.s||[]).forEach(function(a2){
        if(!canPlace(a2[0],a2[1],a2[2]))return;
        var s=place(a2[0],a2[1],a2[2],a2[3]||0),ex=a2[4];
        if(s&&ex){for(var kk in ex)s[kk]=ex[kk];}
      });
      (di.b||[]).forEach(function(a3){
        if(inGrid(a3[0],a3[1])&&!I.cells[a3[1]*GW+a3[0]])I.cells[a3[1]*GW+a3[0]]={t:'belt',dir:a3[2]};
      });
      A=back;
    });
    S.bag=d.bag||S.bag;
    if(S.bag.shell===undefined)S.bag.shell=0;
    if(S.bag.pearl===undefined)S.bag.pearl=0;
    ['ultra','lsup','lultra'].forEach(function(kb){if(S.bag[kb]===undefined)S.bag[kb]=0;});
    S.unlocked=d.unl||S.unlocked;S.cur=d.cur||'bit';
    if(!S.unlocked[S.cur])S.cur='bit';
    S.coins=d.coins||0;S.stock=d.stock||S.stock;S.price=clamp(d.price||7.5,5,10);
    ['mini','scan','gate','sup','ult','comp','craft','gw','aqua','dredge'].forEach(function(kq){
      if(S.stock[kq]===undefined)S.stock[kq]=0;});
    S.hist=(d.hist&&d.hist.length>2)?d.hist.map(function(v){return clamp(v,5,10);}):S.hist;
    S.mined=d.mined||0;S.sold=d.sold||0;S.pts=d.pts||0;S.rew=d.rew||0;
    S.supUnlocked=!!d.supU;S.gwUnlocked=!!d.gwU;S.ultraUnlocked=!!d.ulU;
    S.tut=(d.tut===undefined)?TUT.length:d.tut;
    if(d.tfl){S.didPickup=!!d.tfl[0];S.sawParrot=!!d.tfl[1];S.sawLand=!!d.tfl[2];}
    if(d.npcs){
      var backI=A,backC=CURI;A=HOME;CURI=HOME;
      ['stall','parrot','lord','volt'].forEach(function(k){
        var pos=d.npcs[k];
        if(!pos||(k==='volt'&&!VOLT))return;
        var cur=npcOrigin(k);
        if(!cur||(cur[0]===pos[0]&&cur[1]===pos[1]))return;
        npcCells(k,cur[0],cur[1],false);
        if(npcCanSit(k,pos[0],pos[1]))npcPlace(k,pos[0],pos[1]);
        else npcPlace(k,cur[0],cur[1]);
      });
      A=backI;CURI=backC;
    }
    gotoIsle(clamp(d.isle||0,0,ISLES.length-1));
    S.hint='Welcome back!';S.hintT=2;
  }catch(e){}
}

    playHereBtn={x:cx0+cw/2-70,y:cy0+252,w:140,h:28};
    rr(playHereBtn.x,playHereBtn.y,playHereBtn.w,playHereBtn.h,8);fill('#262340');line('#3a3663',2);
    txt('play in this tab',cx0+cw/2,cy0+266,9,'#8d88b5','center');
  }
}
function startGame(){
  LAUNCHED=true;
  load();
  setInterval(function(){if(LAUNCHED)save();},5000);
  window.addEventListener('beforeunload',function(){if(LAUNCHED)save();});
}

/* ---------- main loop ---------- */
function simulate(dt){
  T+=dt;
  /* simulate every owned island */
  for(var ii=0;ii<ISLES.length;ii++){
    A=ISLES[ii];
    if(!A.owned&&A!==CURI)continue;   /* guest and npc islands only tick while watched */
    var gN=A.owned?genOf(A):null;
    if(gN){
      var bw=billedW(A);
      if(bw>0){
        gN.fuel=Math.max(0,(gN.fuel||0)-bw*BURN*dt);
        gN.warn=(gN.fuel<=0)?1:((gN.fuel<40)?0.5:0);
      } else gN.warn=0;
      gN.spin+=dt*(gN.fuel>0?2.4:0.2);
      gN.feed=Math.max(0,(gN.feed||0)-dt*2);
    }
    A.powered=A.owned?isPowered(A):true;
    if(!A.powered){
      if(A===CURI&&S.hintT<=0){S.hint='No power! Feed bits to the generator';S.hintT=2;}
      continue;                        /* the whole island idles until it is fed */
    }
    for(var i=0;i<A.structs.length;i++){var s=A.structs[i];
      if(s.t==='miner'||s.t==='mini'||s.t==='sup'||s.t==='ult'||s.t==='aqua'||s.t==='dredge'){
        var cad=s.t==='mini'?5.0:(s.t==='sup'?9.0:(s.t==='ult'?12.0:(s.t==='aqua'?7.0:(s.t==='dredge'?8.0:6.5))));
        if(s.big)cad*=(s.t==='miner'?3.2:3.0);   /* large mode: chunkier, slower */
        s.tm+=dt;s.spin+=dt*2.6;
        if(s.tm>cad){s.tm=0;produce(s);}
        s.pop=Math.max(0,s.pop-dt*3);s.puff=Math.max(0,s.puff-dt*1.2);}
      else if(s.t==='seller'){s.lid=Math.max(0,s.lid-dt*3);s.heat=Math.max(0,(s.heat||0)-dt*SELLER_COOL);}
      else if(s.t==='sep')s.pulse=Math.max(0,(s.pulse||0)-dt*3);
    else if(s.t==='comp')s.press=Math.max(0,(s.press||0)-dt*2);
      else if(s.t==='craft')s.made=Math.max(0,(s.made||0)-dt*1.5);
    }
    updateItems(dt);updateLoose(dt);updateScanners(dt);
  }
  A=CURI;
  market(dt);tutStep(dt);

  M.ph+=dt*2.1;
  M.blink-=dt;if(M.blink<-2.5)M.blink=0.12;
  if(M.talk>0)M.talk-=dt;
  if(S.hintT>0)S.hintT-=dt;
  for(var p=S.pops.length-1;p>=0;p--){var q=S.pops[p];q.y+=q.vy*dt;q.vy*=0.94;q.a-=dt*0.9;if(q.a<=0)S.pops.splice(p,1);}
  for(var k=S.spark.length-1;k>=0;k--){var sp=S.spark[k];sp.t+=dt;sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.vy+=190*dt;
    if(sp.t>sp.l)S.spark.splice(k,1);}
}

/* the world keeps turning while the window is hidden: a timer drives the sim in
   fixed slices from the real clock, and rAF only paints when we are visible */
var last=performance.now(),acc=0;
var STEP=1/20, MAX_CATCHUP=180;   /* at most 3 minutes of world per tick */
function pump(){
  var now=performance.now();
  var dt=(now-last)/1000;last=now;
  if(dt<0)dt=0;
  if(dt>MAX_CATCHUP)dt=MAX_CATCHUP;
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<MAX_CATCHUP/STEP){acc-=STEP;simulate(STEP);}
}
setInterval(function(){if(LAUNCHED)pump();},250);
document.addEventListener('visibilitychange',function(){if(LAUNCHED&&!document.hidden)pump();});
function render(){
  if(!LAUNCHED){drawLauncher();requestAnimationFrame(render);return;}
  pump();
  /* ---- render active island ---- */
  drawSea();
  drawIsland();
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var c=A.cells[y*GW+x];if(c&&c.t==='belt')drawBelt(x,y,c);}
  for(var f=0;f<A.structs.length;f++){var fs=A.structs[f];
    if(fs.t==='gate')drawGateFlat(fs);
    else if(fs.t==='scan')drawScanFlat(fs);
    else if(fs.t==='sep')drawSepFlat(fs);
    else if(fs.t==='gw')drawGwFlat(fs);}
  if(S.moveNpc&&mouse.in){
    var f=NPCFOOT[S.moveNpc.key],okN=npcCanSit(S.moveNpc.key,mouse.gx,mouse.gy);
    X.globalAlpha=0.55;
    rr(cx(mouse.gx)+2,cy(mouse.gy)+2,f[0]*TS-4,f[1]*TS-4,7);
    fill(okN?'rgba(120,255,160,.35)':'rgba(255,110,110,.35)');
    line(okN?'#7dffa4':'#ff6e6e',2.5);
    X.globalAlpha=1;
  }
  if(mouse.in&&!S.moveNpc&&!S.shop&&!S.inv&&!S.parrot&&!S.land&&S.stock[S.tool]>0){
    var t=S.tool,ok=canPlace(t,mouse.gx,mouse.gy);
    X.globalAlpha=0.55;
    rr(cx(mouse.gx)+2,cy(mouse.gy)+2,sizeW(t)*TS-4,sizeH(t)*TS-4,7);
    fill(ok?'rgba(120,255,160,.35)':'rgba(255,110,110,.35)');
    line(ok?'#7dffa4':'#ff6e6e',2.5);
    if(t==='belt'||t==='scan'||t==='gate'){
      X.save();X.translate(cx(mouse.gx)+TS/2,cy(mouse.gy)+TS/2);X.rotate(S.dir*Math.PI/2);X.scale(SPR,SPR);
      X.strokeStyle=COL.gold;X.lineWidth=4;X.beginPath();X.moveTo(-6,-7);X.lineTo(4,0);X.lineTo(-6,7);X.stroke();X.restore();}
    X.globalAlpha=1;
  }
  var list=[];
  for(var s3=0;s3<A.structs.length;s3++){var st=A.structs[s3];
    if(st.t==='gate'||st.t==='scan'||st.t==='sep')continue;
    list.push({wy:cy(st.y)+TS*sizeH(st.t)-4,wx:cx(st.x)+TS*sizeW(st.t)/2,k:st.t,o:st});}
  var carrying=S.moveNpc?S.moveNpc.key:null;
  if(CURI.home){
    if(carrying!=='stall'){
      list.push({wy:STALL.wy-1,wx:M.x,k:'mantis'});
      list.push({wy:STALL.wy,wx:STALL.wx,k:'stall'});
    }
    if(carrying!=='parrot')list.push({wy:PARROT.wy,wx:PARROT.wx,k:'parrot'});
    if(carrying!=='lord')list.push({wy:LORD.wy,wx:LORD.wx,k:'lord'});
  }
  if(CURI.npc&&CURI.npcSpot)list.push({wy:CURI.npcSpot.wy,wx:CURI.npcSpot.wx,k:'npcc'});
  if(CURI.home&&VOLT&&carrying!=='volt')list.push({wy:VOLT.wy,wx:VOLT.wx,k:'volt'});
  if(CURI.emp&&carrying!=='emp')list.push({wy:CURI.emp.wy,wx:CURI.emp.wx,k:'emp',o:CURI.emp});
  for(var pl=0;pl<A.palms.length;pl++)list.push({wy:cy(A.palms[pl].y)+TS-4,wx:cx(A.palms[pl].x)+TS/2,k:'palm',o:A.palms[pl]});
  for(var it3=0;it3<A.items.length;it3++){var it=A.items[it3],bi2=beltInfo(it.cx,it.cy);
    var d2=bi2?bi2.dir:0;
    list.push({wy:cy(it.cy)+TS/2+DY[d2]*(it.p-0.5)*TS,wx:cx(it.cx)+TS/2+DX[d2]*(it.p-0.5)*TS,k:'gem',kind:it.kind});}
  for(var l3=0;l3<A.loose.length;l3++){var lo=A.loose[l3];list.push({wy:lo.y,wx:lo.x,k:'loose',o:lo});}
  list.sort(function(a,b){return a.wy-b.wy;});
  for(var d3=0;d3<list.length;d3++){
    var e3=list[d3];
    X.save();X.translate(e3.wx,e3.wy);X.scale(SPR,SPR);
    if(e3.k==='miner')drawMiner(e3.o);
    else if(e3.k==='mini')drawMini(e3.o);
    else if(e3.k==='sup')drawSuper(e3.o);
    else if(e3.k==='ult')drawUltra(e3.o);
    else if(e3.k==='seller')drawSeller(e3.o);
    else if(e3.k==='comp')drawComp(e3.o);
    else if(e3.k==='craft')drawCraft(e3.o);
    else if(e3.k==='aqua')drawAqua(e3.o);
    else if(e3.k==='crab')drawCrabStand(e3.o);
    else if(e3.k==='gen'||e3.k==='lgen')drawGenerator(e3.o);
    else if(e3.k==='dredge')drawDredge(e3.o);
    else if(e3.k==='gw')drawGwRing(e3.o);
    else if(e3.k==='stall')drawStall();
    else if(e3.k==='mantis')drawMantis();
    else if(e3.k==='parrot')drawParrot();
    else if(e3.k==='lord')drawLord();
    else if(e3.k==='npcc')drawNpcCritter(CURI.npc);
    else if(e3.k==='volt')drawVolt();
    else if(e3.k==='emp')drawEmployee(e3.o);
    else if(e3.k==='palm')drawPalm(e3.o);
    else if(e3.k==='gem'){drawBit(0,0,0.85,true,e3.kind);}
    else if(e3.k==='loose'){shadow(6,2.5);drawBit(0,-8-e3.o.z,0.8,true,e3.o.kind);
      if(e3.o.land){X.globalAlpha=0.35+0.35*Math.sin(T*4+e3.o.bob);X.fillStyle='#fff';
        X.beginPath();X.arc(6,-16,1.7,0,6.3);X.fill();X.globalAlpha=1;}}
    X.restore();
  }
  for(var k2=0;k2<S.spark.length;k2++){var sp2=S.spark[k2];
    X.globalAlpha=clamp(1-sp2.t/sp2.l,0,1);X.fillStyle=sp2.c;
    X.beginPath();X.arc(sp2.x,sp2.y,2.4,0,6.3);X.fill();X.globalAlpha=1;}
  for(var p3=0;p3<S.pops.length;p3++){var q3=S.pops[p3];
    X.globalAlpha=clamp(q3.a,0,1);txt(q3.t,q3.x,q3.y-20,11,q3.c,'center');X.globalAlpha=1;}
  if(S.moveNpc&&mouse.in){
    var mk=S.moveNpc.key,f2=NPCFOOT[mk];
    X.save();X.translate(cx(mouse.gx)+f2[0]*TS/2,cy(mouse.gy)+f2[1]*TS-4);X.scale(SPR,SPR);
    X.globalAlpha=0.85;
    if(mk==='stall'){drawStall();drawMantis();}
    else if(mk==='parrot')drawParrot();
    else if(mk==='lord')drawLord();
    else if(mk==='volt')drawVolt();
    else if(mk==='emp')drawEmployee(CURI.emp);
    X.globalAlpha=1;X.restore();
  }
  if(S.scfg&&!S.shop&&!S.inv&&!S.parrot&&!S.land)drawScfg();
  if(S.ccfg&&!S.shop&&!S.inv&&!S.parrot&&!S.land)drawCcfg();
  if(S.crabP&&!S.shop&&!S.inv&&!S.parrot&&!S.land)drawCrabP();
  if(S.lore&&!S.shop&&!S.inv&&!S.parrot&&!S.land)drawLore();
  drawTut();
  drawIsleUI();
  drawHud();
  if(S.inv)drawInv();
  if(S.parrot)drawParrotPanel();
  if(S.land)drawLordPanel();
  if(S.shop)drawShop();
  if(S.power)drawPower();
  if(S.confirm)drawConfirm();
  requestAnimationFrame(render);
}
if(IS_WINDOW)startGame();
requestAnimationFrame(render);
</script>
