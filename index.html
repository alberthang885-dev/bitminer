/* ---------- the CRT pass: curvature, bloom, scanlines, grain ---------- */
var GLC=null,GL=null,crtProg=null,crtTex=null,crtU={},crtDead=false;
var CRT_GAIN=0.5;      /* the whole filter, at half strength */
var CRT_VS='attribute vec2 p;varying vec2 vUv;'+
  'void main(){vUv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}';
var CRT_FS=[
'precision mediump float;',
'uniform sampler2D uTex;uniform vec2 uRes;uniform float uTime;uniform float uAmt;',
'varying vec2 vUv;',
'vec2 curve(vec2 uv){',
'  uv=(uv-0.5)*2.0;',
'  uv*=1.0+vec2(uv.y*uv.y*0.030,uv.x*uv.x*0.042)*uAmt;',
'  return uv*0.5+0.5;',
'}',
'float rnd(vec2 c){return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453);}',
'void main(){',
'  vec2 uv=curve(vUv);',
'  if(uv.x<-0.002||uv.x>1.002||uv.y<-0.002||uv.y>1.002){',
'    gl_FragColor=vec4(0.045,0.041,0.086,1.0);return;}',
'  uv=clamp(uv,0.0,1.0);',
'  vec2 px=1.0/uRes;',
/* a faint sideways wobble, per scanline */
'  uv.x+=sin(uv.y*150.0+uTime*1.7)*0.00030*uAmt;',
'  vec2 dir=uv-0.5;',
/* the beams split sideways only - no vertical fringing */
'  float ca=(0.45+abs(dir.x)*2.6)*uAmt;',
'  vec2 off=vec2(0.0035*ca*sign(dir.x)+0.0009*ca,0.0);',
'  vec3 col;',
'  col.r=texture2D(uTex,uv+off).r;',
'  col.g=texture2D(uTex,uv).g;',
'  col.b=texture2D(uTex,uv-off).b;',
/* the soft phosphor glow */
'  vec3 blur=vec3(0.0);',
'  blur+=texture2D(uTex,uv+px*vec2( 1.6, 0.0)).rgb;',
'  blur+=texture2D(uTex,uv+px*vec2(-1.6, 0.0)).rgb;',
'  blur+=texture2D(uTex,uv+px*vec2( 0.0, 1.6)).rgb;',
'  blur+=texture2D(uTex,uv+px*vec2( 0.0,-1.6)).rgb;',
'  blur+=texture2D(uTex,uv+px*vec2( 3.2, 2.2)).rgb;',
'  blur+=texture2D(uTex,uv+px*vec2(-3.2, 2.2)).rgb;',
'  blur+=texture2D(uTex,uv+px*vec2( 3.2,-2.2)).rgb;',
'  blur+=texture2D(uTex,uv+px*vec2(-3.2,-2.2)).rgb;',
'  blur*=0.125;',
'  col=mix(col,blur,0.13*uAmt);',
'  vec3 bright=max(blur-0.58,0.0);',
'  col+=bright*0.55*uAmt;',
/* scanlines, fixed count so they never moire with the pixel grid */
'  float sl=sin(uv.y*248.0*3.14159);',
'  col*=1.0-0.085*uAmt*sl*sl;',
/* a second, wider band of scanline so the horizontal read is stronger */
'  float sl2=sin(uv.y*82.0*3.14159+uTime*0.6);',
'  col*=1.0-0.030*uAmt*sl2*sl2;',
/* vignette and a slow roll down the tube */
'  col*=1.0-dot(dir,dir)*0.55*uAmt;',
'  col+=sin((uv.y+uTime*0.05)*6.2831)*0.006*uAmt;',
'  col+=(rnd(uv*uRes+fract(uTime))-0.5)*0.030*uAmt;',
'  col*=1.0+0.10*uAmt;',
'  gl_FragColor=vec4(col,1.0);',
'}'].join('\n');
function crtShader(type,src){
  var sh=GL.createShader(type);
  GL.shaderSource(sh,src);GL.compileShader(sh);
  if(!GL.getShaderParameter(sh,GL.COMPILE_STATUS))throw new Error(GL.getShaderInfoLog(sh));
  return sh;
}
function crtInit(){
  if(crtDead)return false;
  if(GL)return true;
  try{
    GLC=document.createElement('canvas');
    GLC.id='crt';GLC.width=W;GLC.height=H;
    document.getElementById('wrap').appendChild(GLC);
    GL=GLC.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false})
      ||GLC.getContext('experimental-webgl');
    if(!GL)throw new Error('no webgl');
    crtProg=GL.createProgram();
    GL.attachShader(crtProg,crtShader(GL.VERTEX_SHADER,CRT_VS));
    GL.attachShader(crtProg,crtShader(GL.FRAGMENT_SHADER,CRT_FS));
    GL.linkProgram(crtProg);
    if(!GL.getProgramParameter(crtProg,GL.LINK_STATUS))throw new Error(GL.getProgramInfoLog(crtProg));
    GL.useProgram(crtProg);
    var buf=GL.createBuffer();
    GL.bindBuffer(GL.ARRAY_BUFFER,buf);
    GL.bufferData(GL.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),GL.STATIC_DRAW);
    var loc=GL.getAttribLocation(crtProg,'p');
    GL.enableVertexAttribArray(loc);
    GL.vertexAttribPointer(loc,2,GL.FLOAT,false,0,0);
    crtTex=GL.createTexture();
    GL.bindTexture(GL.TEXTURE_2D,crtTex);
    GL.texParameteri(GL.TEXTURE_2D,GL.TEXTURE_WRAP_S,GL.CLAMP_TO_EDGE);
    GL.texParameteri(GL.TEXTURE_2D,GL.TEXTURE_WRAP_T,GL.CLAMP_TO_EDGE);
    GL.texParameteri(GL.TEXTURE_2D,GL.TEXTURE_MIN_FILTER,GL.LINEAR);
    GL.texParameteri(GL.TEXTURE_2D,GL.TEXTURE_MAG_FILTER,GL.LINEAR);
    GL.pixelStorei(GL.UNPACK_FLIP_Y_WEBGL,true);
    crtU.res=GL.getUniformLocation(crtProg,'uRes');
    crtU.time=GL.getUniformLocation(crtProg,'uTime');
    crtU.amt=GL.getUniformLocation(crtProg,'uAmt');
    crtU.tex=GL.getUniformLocation(crtProg,'uTex');
    GL.uniform1i(crtU.tex,0);
    GL.uniform2f(crtU.res,W,H);
    GL.viewport(0,0,W,H);
    return true;
  }catch(e){
    crtDead=true;GL=null;
    if(GLC&&GLC.parentNode)GLC.parentNode.removeChild(GLC);
    GLC=null;
    return false;
  }
}
function crtDraw(){
  if(!crtInit())return;
  GLC.style.display='block';
  try{
    GL.activeTexture(GL.TEXTURE0);
    GL.bindTexture(GL.TEXTURE_2D,crtTex);
    GL.texImage2D(GL.TEXTURE_2D,0,GL.RGBA,GL.RGBA,GL.UNSIGNED_BYTE,C);
    GL.useProgram(crtProg);
    GL.uniform1f(crtU.time,T);
    GL.uniform1f(crtU.amt,clamp(S.crtAmt===undefined?1:S.crtAmt,0,1)*CRT_GAIN);
    GL.drawArrays(GL.TRIANGLES,0,3);
  }catch(e){crtOff();}
}
function crtOff(){ if(GLC)GLC.style.display='none'; }
/* off -> soft -> full -> off */
function crtMode(){return !S.crt?0:((S.crtAmt||1)<0.8?1:2);}
function crtToggle(){
  var m=(crtMode()+1)%3;
  if(m>0&&crtDead){
    S.crt=false;crtOff();
    S.hint='This browser cannot run the retro filter';S.hintT=3;
    beep(160,0.12,'sawtooth',0.04);return;
  }
  S.crt=m>0;S.crtAmt=(m===1)?0.55:1;
  if(!S.crt)crtOff();
  S.hint=m===0?'Retro filter off':(m===1?'Retro filter: soft':'Retro filter: full');
  S.hintT=2.5;
  beep(m===0?360:(m===1?620:780),0.07,'square',0.045);save();
}

/* ---------- main loop ---------- */
function simulate(dt){
  T+=dt;
  /* simulate every owned island */
  for(var ii=0;ii<ISLES.length;ii++){
    A=ISLES[ii];
    if(!A.owned&&A!==CURI)continue;   /* guest and npc islands only tick while watched */
    A.stab=isleStable(A);
    var gN=A.owned?genOf(A):null;
    if(gN){
      var bw=billedW(A);
      if(bw>0){
        gN.fuel=Math.max(0,(gN.fuel||0)-bw*BURN*(A.stab?0.6:1)*dt);
        gN.warn=(gN.fuel<=0)?1:((gN.fuel<40)?0.5:0);
      } else gN.warn=0;
      gN.spin+=dt*(gN.fuel>0?2.4:0.2);
      gN.feed=Math.max(0,(gN.feed||0)-dt*2);
    }
    A.powered=A.owned?isPowered(A):true;
    if(!A.powered){
      if(A===CURI&&S.hintT<=0){
        S.hint=genOf(A)?'No power! Feed bits to the generator'
                       :'No generator on this island - place one from your inventory';
        S.hintT=2;}
      continue;                        /* the whole island idles until it is fed */
    }
    for(var i=0;i<A.structs.length;i++){var s=A.structs[i];
      if(s.buf&&s.buf.length)flushOut(s);
      if(isMiner(s.t)){
        var cad=CADENCE[s.t];
        if(s.big&&canSwitch(s.t))cad*=(s.t==='lgminer'?3.2:3.0);   /* large mode: chunkier, slower */
        if(A.stab)cad*=0.55;                     /* a stable star hurries the whole island along */
        s.tm+=dt;s.spin+=dt*2.6;
        if(s.tm>cad){s.tm=0;produce(s);}
        s.pop=Math.max(0,s.pop-dt*3);s.puff=Math.max(0,s.puff-dt*1.2);}
      else if(s.t==='seller'){s.lid=Math.max(0,s.lid-dt*3);
        s.cool=Math.max(0,(s.cool||0)-dt);
        s.heat=Math.max(0,(s.heat||0)-dt*SELLER_COOL*(A.stab?2:1)*(s.cool>0?2.5:1));}
      else if(s.t==='sep')s.pulse=Math.max(0,(s.pulse||0)-dt*3);
    else if(s.t==='comp')s.press=Math.max(0,(s.press||0)-dt*2);
      else if(s.t==='craft')s.made=Math.max(0,(s.made||0)-dt*1.5);
      else if(s.t==='kiln'){s.made=Math.max(0,(s.made||0)-dt*1.5);s.heat2=Math.max(0,(s.heat2||0)-dt*0.7);}
      else if(s.t==='dyson'){
        s.ring+=dt*(s.star?1.9:0.35);s.flare=Math.max(0,(s.flare||0)-dt*2);
        if(s.star==='ustar'){
          s.tm+=dt;
          if(s.tm>1.1){s.tm=0;s.flare=1;S.mined++;s.count=(s.count||0)+1;S.pts+=PTS[s.out]||1;
            emit(s,s.out);beep(880,0.05,'sine',0.03);}
        }
      }
    }
    updateScanners(dt);updateItems(dt);updateLoose(dt);
  }
  A=CURI;
  if(S.fuse){S.fuse.t+=dt;if(S.fuse.t>3.5){S.fuse=null;chaChing(true);}}
  market(dt);tutStep(dt);bankTick(dt);

  M.ph+=dt*2.1;
  M.blink-=dt;if(M.blink<-2.5)M.blink=0.12;
  if(M.talk>0)M.talk-=dt;
  if(S.hintT>0)S.hintT-=dt;
  for(var p=S.pops.length-1;p>=0;p--){var q=S.pops[p];q.y+=q.vy*dt;q.vy*=0.94;q.a-=dt*0.9;if(q.a<=0)S.pops.splice(p,1);}
  for(var k=S.spark.length-1;k>=0;k--){var sp=S.spark[k];sp.t+=dt;sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.vy+=190*dt;
    if(sp.t>sp.l)S.spark.splice(k,1);}
}

/* the world keeps turning while the window is hidden: a timer drives the sim in
   fixed slices from the real clock, and rAF only paints when we are visible */
var last=performance.now(),acc=0;
var STEP=1/20, MAX_CATCHUP=180;   /* at most 3 minutes of world per tick */
function pump(){
  var now=performance.now();
  var dt=(now-last)/1000;last=now;
  if(dt<0)dt=0;
  if(dt>MAX_CATCHUP)dt=MAX_CATCHUP;
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard++<MAX_CATCHUP/STEP){acc-=STEP;simulate(STEP);}
}
setInterval(function(){if(LAUNCHED)pump();},250);
document.addEventListener('visibilitychange',function(){if(LAUNCHED&&!document.hidden)pump();});
function render(){
  if(!LAUNCHED){drawLauncher();requestAnimationFrame(render);return;}
  pump();
  /* ---- render active island ---- */
  drawSea();
  drawIsland();
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var c=A.cells[y*GW+x];if(c&&c.t==='belt')drawBelt(x,y,c);}
  for(var f=0;f<A.structs.length;f++){var fs=A.structs[f];
    if(fs.t==='gate')drawGateFlat(fs);
    else if(fs.t==='scan')drawScanFlat(fs);
    else if(fs.t==='sep')drawSepFlat(fs);
    else if(fs.t==='gw')drawGwFlat(fs);}
  if(S.moveNpc&&mouse.in){
    var f=NPCFOOT[S.moveNpc.key],okN=npcCanSit(S.moveNpc.key,mouse.gx,mouse.gy);
    X.globalAlpha=0.55;
    rr(cx(mouse.gx)+2,cy(mouse.gy)+2,f[0]*TS-4,f[1]*TS-4,7);
    fill(okN?'rgba(120,255,160,.35)':'rgba(255,110,110,.35)');
    line(okN?'#7dffa4':'#ff6e6e',2.5);
    X.globalAlpha=1;
  }
  if(mouse.in&&!S.moveNpc&&!S.shop&&!S.inv&&!S.parrot&&!S.land&&S.stock[S.tool]>0){
    var t=S.tool,ok=canPlace(t,mouse.gx,mouse.gy);
    X.globalAlpha=0.55;
    rr(cx(mouse.gx)+2,cy(mouse.gy)+2,sizeW(t)*TS-4,sizeH(t)*TS-4,7);
    fill(ok?'rgba(120,255,160,.35)':'rgba(255,110,110,.35)');
    line(ok?'#7dffa4':'#ff6e6e',2.5);
    if(t==='belt'||t==='scan'||t==='gate'){
      X.save();X.translate(cx(mouse.gx)+TS/2,cy(mouse.gy)+TS/2);X.rotate(S.dir*Math.PI/2);X.scale(SPR,SPR);
      X.strokeStyle=COL.gold;X.lineWidth=4;X.beginPath();X.moveTo(-6,-7);X.lineTo(4,0);X.lineTo(-6,7);X.stroke();X.restore();}
    X.globalAlpha=1;
  }
  var list=[];
  for(var s3=0;s3<A.structs.length;s3++){var st=A.structs[s3];
    if(st.t==='gate'||st.t==='scan'||st.t==='sep')continue;
    list.push({wy:cy(st.y)+TS*sizeH(st.t)-4,wx:cx(st.x)+TS*sizeW(st.t)/2,k:st.t,o:st});}
  var carrying=S.moveNpc?S.moveNpc.key:null;
  if(CURI.home){
    if(carrying!=='stall'){
      list.push({wy:STALL.wy-1,wx:M.x,k:'mantis'});
      list.push({wy:STALL.wy,wx:STALL.wx,k:'stall'});
    }
    if(carrying!=='parrot')list.push({wy:PARROT.wy,wx:PARROT.wx,k:'parrot'});
    if(carrying!=='lord')list.push({wy:LORD.wy,wx:LORD.wx,k:'lord'});
  }
  if(CURI.npc&&CURI.npcSpot)list.push({wy:CURI.npcSpot.wy,wx:CURI.npcSpot.wx,k:'npcc'});
  if(CURI.builds)for(var tb=0;tb<CURI.builds.length;tb++){var bb=CURI.builds[tb];
    list.push({wy:bb.wy,wx:bb.wx,k:'build',o:bb});}
  if(CURI.folk)for(var tf=0;tf<CURI.folk.length;tf++){var ff=CURI.folk[tf];
    list.push({wy:ff.wy,wx:ff.wx,k:'folk',o:ff});}
  if(CURI.home&&VOLT&&carrying!=='volt')list.push({wy:VOLT.wy,wx:VOLT.wx,k:'volt'});
  if(CURI.emp&&carrying!=='emp')list.push({wy:CURI.emp.wy,wx:CURI.emp.wx,k:'emp',o:CURI.emp});
  for(var pl=0;pl<A.palms.length;pl++)list.push({wy:cy(A.palms[pl].y)+TS-4,wx:cx(A.palms[pl].x)+TS/2,k:'palm',o:A.palms[pl]});
  for(var it3=0;it3<A.items.length;it3++){var it=A.items[it3],bi2=beltInfo(it.cx,it.cy);
    var d2=bi2?bi2.dir:0;
    list.push({wy:cy(it.cy)+TS/2+DY[d2]*(it.p-0.5)*TS,wx:cx(it.cx)+TS/2+DX[d2]*(it.p-0.5)*TS,k:'gem',kind:it.kind});}
  for(var l3=0;l3<A.loose.length;l3++){var lo=A.loose[l3];list.push({wy:lo.y,wx:lo.x,k:'loose',o:lo});}
  list.sort(function(a,b){return a.wy-b.wy;});
  for(var d3=0;d3<list.length;d3++){
    var e3=list[d3];
    X.save();X.translate(e3.wx,e3.wy);X.scale(SPR,SPR);
    if(e3.k==='miner')drawMiner(e3.o);
    else if(e3.k==='mini')drawMini(e3.o);
    else if(e3.k==='sup')drawSuper(e3.o);
    else if(e3.k==='ult')drawUltra(e3.o);
    else if(e3.k==='seller')drawSeller(e3.o);
    else if(e3.k==='comp')drawComp(e3.o);
    else if(e3.k==='craft')drawCraft(e3.o);
    else if(e3.k==='lgminer')drawLgMiner(e3.o);
    else if(e3.k==='lgsup')drawLgSuper(e3.o);
    else if(e3.k==='lgult')drawLgUltra(e3.o);
    else if(e3.k==='kiln')drawKiln(e3.o);
    else if(e3.k==='dyson')drawDyson(e3.o);
    else if(e3.k==='aqua')drawAqua(e3.o);
    else if(e3.k==='crab')drawCrabStand(e3.o);
    else if(e3.k==='gen'||e3.k==='lgen')drawGenerator(e3.o);
    else if(e3.k==='dredge')drawDredge(e3.o);
    else if(e3.k==='gw')drawGwRing(e3.o);
    else if(e3.k==='stall')drawStall();
    else if(e3.k==='mantis')drawMantis();
    else if(e3.k==='parrot')drawParrot();
    else if(e3.k==='lord')drawLord();
    else if(e3.k==='npcc')drawNpcCritter(CURI.npc);
    else if(e3.k==='build')drawTownBuilding(e3.o);
    else if(e3.k==='folk')drawFolk(e3.o);
    else if(e3.k==='volt')drawVolt();
    else if(e3.k==='emp')drawEmployee(e3.o);
    else if(e3.k==='palm')drawPalm(e3.o);
    else if(e3.k==='gem'){drawBit(0,0,0.85,true,e3.kind);}
    else if(e3.k==='loose'){shadow(6,2.5);drawBit(0,-8-e3.o.z,0.8,true,e3.o.kind);
      if(e3.o.land){X.globalAlpha=0.35+0.35*Math.sin(T*4+e3.o.bob);X.fillStyle='#fff';
        X.beginPath();X.arc(6,-16,1.7,0,6.3);X.fill();X.globalAlpha=1;}}
    X.restore();
  }
  for(var k2=0;k2<S.spark.length;k2++){var sp2=S.spark[k2];
    X.globalAlpha=clamp(1-sp2.t/sp2.l,0,1);X.fillStyle=sp2.c;
    X.beginPath();X.arc(sp2.x,sp2.y,2.4,0,6.3);X.fill();X.globalAlpha=1;}
  for(var p3=0;p3<S.pops.length;p3++){var q3=S.pops[p3];
    X.globalAlpha=clamp(q3.a,0,1);txt(q3.t,q3.x,q3.y-20,11,q3.c,'center');X.globalAlpha=1;}
  if(S.moveNpc&&mouse.in){
    var mk=S.moveNpc.key,f2=NPCFOOT[mk];
    X.save();X.translate(cx(mouse.gx)+f2[0]*TS/2,cy(mouse.gy)+f2[1]*TS-4);X.scale(SPR,SPR);
    X.globalAlpha=0.85;
    if(mk==='stall'){drawStall();drawMantis();}
    else if(mk==='parrot')drawParrot();
    else if(mk==='lord')drawLord();
    else if(mk==='volt')drawVolt();
    else if(mk==='emp')drawEmployee(CURI.emp);
    X.globalAlpha=1;X.restore();
  }
  if(S.scfg&&!S.shop&&!S.inv&&!S.parrot&&!S.land)drawScfg();
  if(S.ccfg&&!S.shop&&!S.inv&&!S.parrot&&!S.land)drawCcfg();
  if(S.crabP&&!S.shop&&!S.inv&&!S.parrot&&!S.land)drawCrabP();
  if(S.lore&&!S.shop&&!S.inv&&!S.parrot&&!S.land)drawLore();
  drawTut();
  drawIsleUI();
  drawHud();
  if(S.inv)drawInv();
  if(S.parrot)drawParrotPanel();
  if(S.land)drawLordPanel();
  if(S.shop)drawShop();
  if(S.bankOpen)drawBank();
  if(S.work)drawWorkshop();
  if(S.dyP)drawDysonPanel();
  if(S.fuse)drawFusion();
  if(S.power)drawPower();
  if(S.confirm)drawConfirm();
  if(S.crt)crtDraw();else crtOff();
  requestAnimationFrame(render);
}
if(IS_WINDOW)startGame();
requestAnimationFrame(render);
