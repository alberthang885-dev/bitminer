<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BITMINER</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%232b2a45"/><path d="M32 8 L51 25 L43 54 L21 54 L13 25 Z" fill="%234dd8ff" stroke="%2312557a" stroke-width="4"/><path d="M26 15 L35 23 L28 42 L19 30 Z" fill="%23bff6ff"/></svg>'>
<style>
  html,body{margin:0;height:100%;background:#151228;display:flex;align-items:center;justify-content:center;
    font-family:Verdana,Geneva,sans-serif;overflow:hidden}
  #wrap{position:relative}
  canvas{display:block;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 4px #2b2a45;cursor:crosshair}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="840" height="596"></canvas></div>
<script>
"use strict";
var C=document.getElementById('c'),X=C.getContext('2d');
var W=840,H=596;
var TS=24,GW=34,GH=20,OX=12,OY=44;
var SPR=TS/32;
var BOT=72;
var DX=[1,0,-1,0],DY=[0,1,0,-1];
var COL={dark:'#2b2a45',grass:'#7ad86a',grass2:'#66c95c',sand:'#ffe3a3',sand2:'#f2c884',
  sea:'#2196c9',sea2:'#3fc4e8',foam:'#bdf1ff',bit:'#4dd8ff',bit2:'#bff6ff',
  gold:'#ffd23f',pink:'#ff6b9d',purple:'#9b5de5',coral:'#ff8a5b',cream:'#fff4d6',
  mant:'#2fd6a5',mant2:'#25bd90',mantD:'#12463a',wood:'#c98b4b',wood2:'#a86e36',
  sup:'#c07bff',sup2:'#e7c9ff',anom:'#6b5878',anom2:'#ff5a7a'};

/* ---------- helpers ---------- */
function hash(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);}
function fill(c){X.fillStyle=c;X.fill();}
function line(c,w){X.strokeStyle=c;X.lineWidth=w||3;X.stroke();}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function txt(s,x,y,size,col,align,bold){X.font=(bold===false?'':'bold ')+size+'px Verdana,Geneva,sans-serif';
  X.fillStyle=col;X.textAlign=align||'left';X.textBaseline='middle';X.fillText(s,x,y);}
function cx(x){return OX+x*TS;}
function cy(y){return OY+y*TS;}

/* ---------- bit kinds ---------- */
var MULT={mini:0.5,bit:1,large:4,sup:12};
var PTS={mini:1,bit:2,large:6,sup:15,anom:4};
var KINDNAME={mini:'MINI BIT',bit:'BIT',large:'LARGE BIT',sup:'SUPER BIT',anom:'ANOMALY'};
var CURS=['mini','bit','large','sup'];

/* ---------- island: rigid tiles, ragged outline, rounded corners ---------- */
var ICX=OX+GW*TS/2, ICY=OY+GH*TS/2, IAX=GW*TS/2-10, IAY=GH*TS/2-6;
var LAND=[],SAND=[];
(function(){
  function noise(x,y){
    return 0.62*(hash(Math.floor(x/4),Math.floor(y/4))-0.5)
          +0.30*(hash(Math.floor(x/3)+7,Math.floor(y/3)+3)-0.5)
          +0.22*(hash(Math.floor(x/2)+31,Math.floor(y/2)+17)-0.5);
  }
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    var dx=(cx(x)+TS/2-ICX)/IAX,dy=(cy(y)+TS/2-ICY)/IAY;
    var d=Math.sqrt(dx*dx+dy*dy);
    LAND[y*GW+x]=(d+0.26*noise(x,y))<0.95;
  }
  for(var y2=0;y2<GH;y2++)for(var x2=0;x2<GW;x2++){
    if(!LAND[y2*GW+x2])continue;
    var n=0;
    if(x2>0&&LAND[y2*GW+x2-1])n++;
    if(x2<GW-1&&LAND[y2*GW+x2+1])n++;
    if(y2>0&&LAND[(y2-1)*GW+x2])n++;
    if(y2<GH-1&&LAND[(y2+1)*GW+x2])n++;
    if(n===0)LAND[y2*GW+x2]=false;
  }
  for(var y3=0;y3<GH;y3++)for(var x3=0;x3<GW;x3++){
    if(!LAND[y3*GW+x3]){SAND[y3*GW+x3]=false;continue;}
    var wet=false;
    for(var j=-2;j<=2&&!wet;j++)for(var i=-2;i<=2;i++){
      var nx=x3+i,ny=y3+j;
      if(nx<0||ny<0||nx>=GW||ny>=GH||!LAND[ny*GW+nx]){wet=true;break;}}
    SAND[y3*GW+x3]=wet;
  }
})();
function isLand(x,y){return x>=0&&y>=0&&x<GW&&y<GH&&LAND[y*GW+x];}
function isGrass(x,y){return isLand(x,y)&&!SAND[y*GW+x];}
function tilePath(mask,r){
  var p=new Path2D();
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    if(!mask(x,y))continue;
    var L=mask(x-1,y),R=mask(x+1,y),U=mask(x,y-1),D=mask(x,y+1);
    p.roundRect(cx(x),cy(y),TS,TS,
      [(!L&&!U)?r:0,(!R&&!U)?r:0,(!R&&!D)?r:0,(!L&&!D)?r:0]);
  }
  return p;
}
var P_LAND=tilePath(isLand,9),P_GRASS=tilePath(isGrass,8);

/* ---------- state ---------- */
var S={cells:[],structs:[],items:[],loose:[],pops:[],spark:[],
  bag:{mini:0,bit:0,large:0,sup:0,anom:0},
  unlocked:{bit:true},cur:'bit',gwUnlocked:false,
  coins:320,stock:{belt:0,mini:0,miner:0,seller:0,scan:0,gate:0,sup:0,comp:0,craft:0,gw:0},
  price:7.5,trend:0,hist:[],mkT:0,ptT:0,newsT:0,news:'',
  pts:0,rew:0,supUnlocked:false,
  tool:'belt',dir:0,shop:false,inv:false,parrot:false,scfg:null,ccfg:null,linking:null,
  amt:'',amtFocus:false,sscroll:0,sscrollMax:0,
  sold:0,mined:0,tut:0,tutT:0,
  hint:'Visit the mantis stall to trade',hintT:6};
for(var i=0;i<GW*GH;i++)S.cells[i]=null;
function cell(x,y){return (x>=0&&y>=0&&x<GW&&y<GH)?S.cells[y*GW+x]:undefined;}
function setCell(x,y,v){if(x>=0&&y>=0&&x<GW&&y<GH)S.cells[y*GW+x]=v;}
var SIZES={belt:1,mini:1,scan:1,gate:1,miner:2,seller:2,sup:2,comp:2,craft:2,gw:3};
function sizeOf(t){return SIZES[t]||1;}
function canPlace(t,x,y){var n=sizeOf(t);
  for(var j=0;j<n;j++)for(var i2=0;i2<n;i2++){
    if(!isLand(x+i2,y+j))return false;
    if(cell(x+i2,y+j))return false;
  } return true;}
function place(t,x,y,dir){
  if(t==='belt'){setCell(x,y,{t:'belt',dir:dir||0});return null;}
  var s={t:t,x:x,y:y,dir:dir||0,tm:Math.random()*2,pop:0,spin:Math.random()*6,k:0,puff:0,lid:0};
  if(t==='seller'){s.dmg=0;s.thr=2+Math.floor(Math.random()*2);s.brk=false;}
  if(t==='scan'){s.filt='any';s.mode='open';s.gates=[];}
  if(t==='gate'){s.open=true;s.ext=1;}
  if(t==='comp'){s.buf={mini:0,bit:0};s.press=0;}
  if(t==='craft'){s.ri=0;s.prog=0;s.made=0;}
  S.structs.push(s);
  var n=sizeOf(t);
  for(var j=0;j<n;j++)for(var i2=0;i2<n;i2++)setCell(x+i2,y+j,{t:'occ',s:s});
  return s;}
function structAt(x,y){var c=cell(x,y);return (c&&c.t==='occ')?c.s:null;}
function removeAt(x,y){
  var c=cell(x,y);if(!c)return false;
  if(c.t==='stall'||c.t==='deco'||c.t==='npc')return false;
  if(c.t==='belt'){setCell(x,y,null);S.stock.belt++;
    S.items=S.items.filter(function(it){return !(it.cx===x&&it.cy===y);});return true;}
  var s=c.s,n=sizeOf(s.t);
  for(var j=0;j<n;j++)for(var i2=0;i2<n;i2++)setCell(s.x+i2,s.y+j,null);
  S.structs.splice(S.structs.indexOf(s),1);S.stock[s.t]++;
  if(s.t==='gate')S.structs.forEach(function(o){if(o.t==='scan')o.gates=o.gates.filter(function(g){return !(g[0]===s.x&&g[1]===s.y);});});
  if(S.scfg===s)S.scfg=null;
  if(S.ccfg===s)S.ccfg=null;
  S.items=S.items.filter(function(it){return !(it.cx>=s.x&&it.cx<s.x+n&&it.cy>=s.y&&it.cy<s.y+n);});
  return true;}

/* ---------- palms ---------- */
var PALMS=[],PALM_COST=25,PALM_MAX=11,PALM_GAP=4;
(function(){
  var cand=[];
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    if(!LAND[y*GW+x]||!SAND[y*GW+x]||cell(x,y))continue;
    cand.push([x,y,hash(x*7+3,y*11+5)]);
  }
  cand.sort(function(a,b){return a[2]-b[2];});
  for(var i=0;i<cand.length&&PALMS.length<PALM_MAX;i++){
    var cxx=cand[i][0],cyy=cand[i][1],ok=true;
    for(var k=0;k<PALMS.length;k++){
      if(Math.abs(PALMS[k].x-cxx)<PALM_GAP&&Math.abs(PALMS[k].y-cyy)<PALM_GAP){ok=false;break;}}
    if(!ok)continue;
    setCell(cxx,cyy,{t:'deco'});
    PALMS.push({x:cxx,y:cyy,s:0.80+hash(cxx,cyy)*0.42,ph:hash(cxx,cyy+5)*6.3});
  }
})();
function clearPalm(x,y){
  var idx=-1;
  for(var i=0;i<PALMS.length;i++)if(PALMS[i].x===x&&PALMS[i].y===y){idx=i;break;}
  if(idx<0)return false;
  if(S.coins<PALM_COST){S.hint='Clearing a palm costs '+PALM_COST+'c';S.hintT=2.5;
    beep(160,0.12,'sawtooth',0.04);return true;}
  S.coins-=PALM_COST;PALMS.splice(idx,1);setCell(x,y,null);
  pop(cx(x)+TS/2,cy(y)+TS/2,'-'+PALM_COST+'c',COL.gold);
  sparkle(cx(x)+TS/2,cy(y)+TS/2,'#4fbf58',10);
  S.hint='Palm cleared - that square is buildable now';S.hintT=3;
  beep(240,0.12,'sawtooth',0.05);
  return true;
}

/* ---------- mantis stall ---------- */
var STALL=(function(){
  var best=null,bs=1e9;
  for(var y=1;y<GH-2;y++)for(var x=1;x<GW-4;x++){
    var ok=true,near=false;
    for(var j=0;j<2&&ok;j++)for(var i=0;i<4;i++){
      if(!isLand(x+i,y+j)||cell(x+i,y+j)){ok=false;break;}
      if(SAND[(y+j)*GW+x+i])near=true;}
    if(!ok||!near)continue;
    var sc=Math.abs(cx(x)+TS*2-(ICX-IAX*0.48))+Math.abs(cy(y)+TS-(ICY+IAY*0.5));
    if(sc<bs){bs=sc;best={x:x,y:y};}
  }
  if(!best)best={x:3,y:GH-4};
  best.w=4;best.h=2;
  best.wx=cx(best.x)+TS*2;best.wy=cy(best.y)+TS*2-4;
  return best;
})();
function markStall(){for(var j=0;j<STALL.h;j++)for(var i=0;i<STALL.w;i++)setCell(STALL.x+i,STALL.y+j,{t:'stall'});}
markStall();

/* ---------- parrot NPC spot (right side of the island) ---------- */
var PARROT=(function(){
  var best=null,bs=1e9;
  for(var y=1;y<GH-1;y++)for(var x=1;x<GW-1;x++){
    if(!isLand(x,y)||cell(x,y)||!SAND[y*GW+x])continue;
    var sc=Math.abs(cx(x)-(ICX+IAX*0.55))+Math.abs(cy(y)-(ICY-IAY*0.1));
    if(sc<bs){bs=sc;best={x:x,y:y};}
  }
  if(!best)best={x:GW-4,y:Math.round(GH/2)};
  best.wx=cx(best.x)+TS/2;best.wy=cy(best.y)+TS-2;
  return best;
})();
setCell(PARROT.x,PARROT.y,{t:'npc'});

S.hist=[];for(var i=0;i<60;i++)S.hist.push(7.5);

var M={x:STALL.wx+8*SPR,y:STALL.wy-14*SPR,ph:0,face:-1,blink:0,talk:0};

/* ---------- tutorial ---------- */
var TUT=[
 'Welcome to your island! Click the mantis stall to open the shop',
 'Buy a MINI MINER (60c) - the cheap little one',
 'Press I, pick the mini miner, then left-click a grass square',
 'It flings gems around itself - click them to collect',
 'Buy an AUTO SELLER + CONVEYORS. Belts feed it; arrow keys turn them',
 'Sell bit at the stall when the price looks good. The island is yours!'
];
function anyMiner(){return S.structs.some(function(x){return x.t==='mini'||x.t==='miner'||x.t==='sup';});}
function bagTotal(){return S.bag.mini+S.bag.bit+S.bag.large+S.bag.sup+S.bag.anom;}
function tutStep(dt){
  if(S.tut>=TUT.length)return;
  if(S.tut===0&&S.shop)S.tut=1;
  else if(S.tut===1&&(S.stock.mini>0||S.stock.miner>0||anyMiner()))S.tut=2;
  else if(S.tut===2&&anyMiner())S.tut=3;
  else if(S.tut===3&&bagTotal()>0)S.tut=4;
  else if(S.tut===4&&S.structs.some(function(x){return x.t==='seller';}))S.tut=5;
  else if(S.tut===5){S.tutT+=dt;if(S.tutT>12){S.tut=6;save();}}
}
var tutSkip={x:0,y:0,w:0,h:0};
function drawTut(){
  if(S.tut>=TUT.length||S.shop||S.inv||S.parrot)return;
  var msg=TUT[S.tut],bw=Math.min(560,W-40),bx=(W-bw)/2,by=OY+8;
  X.globalAlpha=0.96;
  rr(bx,by,bw,42,10);fill('#1d1b33');line(COL.gold,2.5);
  X.globalAlpha=1;
  X.fillStyle=COL.gold;X.beginPath();X.arc(bx+21,by+21,11,0,6.3);X.fill();line('#b8891b',2.5);
  txt((S.tut+1)+'',bx+21,by+21,12,'#7a5a10','center');
  txt(msg,bx+40,by+16,10,COL.cream,'left',false);
  txt('step '+(S.tut+1)+' of '+TUT.length,bx+40,by+31,8,'#8d88b5','left',false);
  tutSkip={x:bx+bw-52,y:by+9,w:42,h:24};
  rr(tutSkip.x,tutSkip.y,tutSkip.w,tutSkip.h,7);fill('#262340');line('#3a3663',2);
  txt('skip',tutSkip.x+21,tutSkip.y+12,9,'#8d88b5','center');
}

/* ---------- audio ---------- */
var AC=null;
function beep(f,d,type,vol){
  try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';
    o.frequency.setValueAtTime(f,AC.currentTime);
    g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.07,AC.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+0.02);}catch(e){}}

/* ---------- fx ---------- */
function pop(x,y,t,c){S.pops.push({x:x,y:y,t:t,c:c||COL.cream,a:1,vy:-26});}
function sparkle(x,y,c,n){for(var i=0;i<(n||6);i++){var a=Math.random()*6.28,s=20+Math.random()*45;
  S.spark.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,l:0.5+Math.random()*0.4,t:0,c:c||COL.bit});}}

/* ---------- economy ---------- */
function unlock(k){
  if(k==='anom'||S.unlocked[k])return;
  S.unlocked[k]=true;
  S.hint=KINDNAME[k]+' unlocked as a currency at the stall!';S.hintT=4;M.talk=2;
}
function gain(k,n){S.bag[k]+=n;unlock(k);}
function priceOf(k){return S.price*MULT[k];}

/* ---------- mining ---------- */
function outlets(m){var o=[],n=sizeOf(m.t);
  for(var i=0;i<n;i++){o.push([m.x+i,m.y-1,0,-1]);o.push([m.x+i,m.y+n,0,1]);
    o.push([m.x-1,m.y+i,-1,0]);o.push([m.x+n,m.y+i,1,0]);} return o;}
function beltFree(x,y,p){
  for(var i=0;i<S.items.length;i++){var it=S.items[i];
    if(it.cx===x&&it.cy===y&&Math.abs(it.p-p)<0.34)return false;} return true;}
function mineKind(t){
  var r=Math.random();
  if(t==='miner')return r<0.07?'large':(r<0.14?'anom':'bit');
  if(t==='mini')return r<0.07?'anom':'mini';
  return r<0.07?'large':(r<0.14?'anom':'sup');   /* super miner */
}
function emit(m,kind){
  var o=outlets(m),belts=[],spots=[];
  for(var i=0;i<o.length;i++){var q=o[i],c=cell(q[0],q[1]);
    if(c&&c.t==='belt'&&!(DX[c.dir]===-q[2]&&DY[c.dir]===-q[3])&&beltFree(q[0],q[1],0.2))belts.push(q);
    else if(isLand(q[0],q[1])&&!c)spots.push(q);}
  var n=sizeOf(m.t);
  if(belts.length){var b=belts[(m.k++)%belts.length];
    S.items.push({cx:b[0],cy:b[1],p:0.15,kind:kind});
    sparkle(cx(b[0])+TS/2,cy(b[1])+TS/2,kind==='sup'?COL.sup:COL.bit,4);return;}
  var t=spots.length?spots[Math.floor(Math.random()*spots.length)]:o[Math.floor(Math.random()*o.length)];
  if(S.loose.length<70)S.loose.push({x0:cx(m.x)+TS*n/2,y0:cy(m.y)+TS*n/2,
    x1:cx(t[0])+TS/2+(Math.random()*10-5),y1:cy(t[1])+TS/2+(Math.random()*10-5),
    t:0,dur:0.55,land:false,bob:Math.random()*6,x:cx(m.x)+TS*n/2,y:cy(m.y)+TS*n/2,z:0,kind:kind});
}
function produce(m){
  m.pop=1;m.puff=1;S.mined++;
  var kind=mineKind(m.t);
  S.pts+=PTS[kind];
  emit(m,kind);beep(700,0.04,'triangle',0.025);
}
function beltInfo(x,y){
  var c=cell(x,y);if(!c)return null;
  if(c.t==='belt')return {dir:c.dir};
  if(c.t==='occ'&&c.s.t==='gate'&&c.s.open)return {dir:c.s.dir};
  return null;
}
function sellerTake(se,kind,nx,ny){
  if(se.brk)return false;
  if(kind==='anom'){
    se.dmg++;sparkle(cx(nx)+TS/2,cy(ny)+TS/2,COL.anom2,8);
    if(se.dmg>=se.thr){se.brk=true;S.hint='An anomaly broke an auto seller! Click it to repair (45c)';S.hintT=4;
      beep(120,0.3,'sawtooth',0.07);}
    else beep(200,0.15,'sawtooth',0.05);
    return true;
  }
  var v=Math.max(1,Math.round(priceOf(kind)));
  S.coins+=v;S.sold++;se.lid=1;unlock(kind);
  pop(cx(nx)+TS/2,cy(ny),'+'+v+'c',COL.gold);
  sparkle(cx(nx)+TS/2,cy(ny)+TS/2,COL.gold,5);beep(1180,0.06,'sine',0.05);
  return true;
}
function updateItems(dt){
  var sp=2.3;
  for(var i=S.items.length-1;i>=0;i--){
    var it=S.items[i],bi=beltInfo(it.cx,it.cy);
    if(!bi){
      var c0=cell(it.cx,it.cy);
      if(c0&&c0.t==='occ'&&c0.s.t==='gate')continue;   /* closed gate holds the item */
      S.items.splice(i,1);continue;
    }
    it.p+=sp*dt;
    if(it.p>=1){
      var nx=it.cx+DX[bi.dir],ny=it.cy+DY[bi.dir],nb=beltInfo(nx,ny),nc=cell(nx,ny);
      if(nb){ if(beltFree(nx,ny,0)){it.cx=nx;it.cy=ny;it.p-=1;} else it.p=1; }
      else if(nc&&nc.t==='occ'&&nc.s.t==='seller'){
        if(sellerTake(nc.s,it.kind,nx,ny))S.items.splice(i,1);
        else it.p=1;
      }
      else if(nc&&nc.t==='occ'&&nc.s.t==='gw'){
        var gws=S.structs.filter(function(o){return o.t==='gw';});
        var gi=gws.indexOf(nc.s),pt=gws.length>1?gws[(gi+1)%gws.length]:null;
        S.items.splice(i,1);
        sparkle(cx(nc.s.x)+TS*1.5,cy(nc.s.y)+TS*1.5,COL.bit,6);
        if(pt){emit(pt,it.kind);sparkle(cx(pt.x)+TS*1.5,cy(pt.y)+TS*1.5,COL.bit2,6);beep(980,0.07,'sine',0.04);}
        else emit(nc.s,it.kind);
      }
      else if(nc&&nc.t==='occ'&&nc.s.t==='comp'){
        var cs=nc.s;S.items.splice(i,1);
        if(it.kind==='mini'){cs.buf.mini++;
          if(cs.buf.mini>=4){cs.buf.mini-=4;cs.press=1;emit(cs,'bit');
            pop(cx(cs.x)+TS,cy(cs.y),'+1 bit',COL.bit2);beep(520,0.08,'square',0.05);}}
        else if(it.kind==='bit'){cs.buf.bit++;
          if(cs.buf.bit>=9){cs.buf.bit-=9;cs.press=1;emit(cs,'sup');
            pop(cx(cs.x)+TS,cy(cs.y),'+1 SUPER BIT',COL.sup2);
            sparkle(cx(cs.x)+TS,cy(cs.y)+TS,COL.sup,10);beep(660,0.1,'square',0.06);}}
        else emit(cs,it.kind);   /* no recipe - passes straight through */
      }
      else if(nc&&nc.t==='occ'&&nc.s.t==='craft'){
        var cf=nc.s;S.items.splice(i,1);
        if(it.kind==='anom')emit(cf,'anom');
        else{cf.prog+=MULT[it.kind];
          var rc=RECIPES[cf.ri];
          if(cf.prog>=rc[1]){cf.prog-=rc[1];S.stock[rc[0]]++;cf.made=1;
            pop(cx(cf.x)+TS,cy(cf.y),itemName(rc[0])+' crafted!',COL.gold);
            sparkle(cx(cf.x)+TS,cy(cf.y)+TS,COL.gold,10);beep(760,0.09,'triangle',0.06);}}
      }
      else if(nc){it.p=1;}
      else{
        S.items.splice(i,1);
        if(S.loose.length<70){var lx=cx(it.cx)+TS/2,ly=cy(it.cy)+TS/2;
          S.loose.push({x0:lx,y0:ly,x1:lx+DX[bi.dir]*18,y1:ly+DY[bi.dir]*18,t:0,dur:0.35,
            land:false,bob:0,x:lx,y:ly,z:0,kind:it.kind});}
      }
    }
  }
}
function updateLoose(dt){
  for(var i=S.loose.length-1;i>=0;i--){var l=S.loose[i];
    if(!l.land){l.t+=dt;var u=clamp(l.t/l.dur,0,1);
      l.x=l.x0+(l.x1-l.x0)*u;l.y=l.y0+(l.y1-l.y0)*u;l.z=Math.sin(u*Math.PI)*22;
      if(u>=1){l.land=true;l.z=0;
        var gx=Math.floor((l.x-OX)/TS),gy=Math.floor((l.y-OY)/TS);
        if(beltInfo(gx,gy)){S.items.push({cx:gx,cy:gy,p:0.5,kind:l.kind});S.loose.splice(i,1);continue;}
        sparkle(l.x,l.y,l.kind==='sup'?COL.sup:COL.bit,3);}
    } else {l.bob+=dt*3;l.z=Math.abs(Math.sin(l.bob))*1.5;}
  }
}
/* ---------- scanners drive gates ---------- */
function kindMatch(filt,k){return filt==='any'||filt===k;}
function scanDetect(sc){
  var fx=sc.x+DX[sc.dir],fy=sc.y+DY[sc.dir],i;
  for(i=0;i<S.items.length;i++){var it=S.items[i];
    if(it.cx===fx&&it.cy===fy&&kindMatch(sc.filt,it.kind))return true;}
  for(i=0;i<S.loose.length;i++){var l=S.loose[i];
    if(l.land&&Math.floor((l.x-OX)/TS)===fx&&Math.floor((l.y-OY)/TS)===fy&&kindMatch(sc.filt,l.kind))return true;}
  return false;
}
function updateScanners(dt){
  for(var i=0;i<S.structs.length;i++){var sc=S.structs[i];
    if(sc.t==='scan'){
      sc.det=scanDetect(sc);
      var want=sc.mode==='open'?sc.det:!sc.det;
      for(var g=0;g<sc.gates.length;g++){
        var gs=structAt(sc.gates[g][0],sc.gates[g][1]);
        if(gs&&gs.t==='gate')gs.open=want;
      }
    }
  }
  for(var j=0;j<S.structs.length;j++){var gt=S.structs[j];
    if(gt.t==='gate')gt.ext+=((gt.open?1:0)-gt.ext)*Math.min(1,dt*10);
  }
}

var NEWS=[['Bit rally! Traders are frothing.',0.8],['A whale dumped bit.',-0.8],
  ['New bit standard adopted.',0.6],['Rumours of a bit glut.',-0.6],
  ['Mantis Guild hoards bit.',0.7],['Cheap bit found offshore.',-0.5]];
function market(dt){
  S.mkT+=dt;
  if(S.mkT>2.5){S.mkT=0;
    S.trend=S.trend*0.85+(Math.random()-0.5)*0.22;
    S.price=clamp(S.price+S.trend+(7.5-S.price)*0.03+(Math.random()-0.5)*0.14,5,10);
    S.hist.push(S.price);if(S.hist.length>70)S.hist.shift();
    if(Math.random()<0.02){var n=NEWS[Math.floor(Math.random()*NEWS.length)];
      S.trend+=n[1];S.news=n[0];S.newsT=6;M.talk=2;}
  }
  if(S.newsT>0)S.newsT-=dt;

function sell(n){
  var k=S.cur;
  n=Math.min(n,S.bag[k]);if(n<=0){S.hint='No '+KINDNAME[k].toLowerCase()+' to sell!';S.hintT=2;return;}
  var v=Math.round(priceOf(k)*n);S.bag[k]-=n;S.coins+=v;S.sold+=n;
  pop(STALL.wx,STALL.wy-30,'+'+v+'c',COL.gold);beep(660,0.08,'square',0.05);
  setTimeout(function(){beep(990,0.09,'square',0.05);},70);save();
}
function buy(kind,cost){
  if(S.coins<cost){S.hint='Not enough coins';S.hintT=2;beep(160,0.12,'sawtooth',0.04);return;}

function spark(px,py,w,h){
  var mn=1e9,mx=-1e9,i;
  for(i=0;i<S.hist.length;i++){mn=Math.min(mn,S.hist[i]);mx=Math.max(mx,S.hist[i]);}
  if(mx-mn<0.5)mx=mn+0.5;
  rr(px,py,w,h,5);fill('#262340');
  X.save();X.beginPath();X.roundRect(px,py,w,h,5);X.clip();
  X.beginPath();
  for(i=0;i<S.hist.length;i++){
    var X0=px+i/(S.hist.length-1)*w,Y0=py+h-3-((S.hist[i]-mn)/(mx-mn))*(h-6);
    if(i===0)X.moveTo(X0,Y0);else X.lineTo(X0,Y0);}
  X.strokeStyle=S.trend>=0?'#6bf28a':'#ff6b6b';X.lineWidth=2;X.stroke();
  X.lineTo(px+w,py+h);X.lineTo(px,py+h);X.closePath();
  X.globalAlpha=0.18;X.fillStyle=S.trend>=0?'#6bf28a':'#ff6b6b';X.fill();X.globalAlpha=1;
  X.restore();
}

  txt(cf.prog.toFixed(1)+' / '+rc[1]+'  -  feed it bits by belt (minis count 0.5)',px+14,py+96,8,'#8fb8c9','left',false);
  rr(px+pw-36,py+8,24,22,6);fill('#0f2c38');line('#3fa8c9',2);
  txt('X',px+pw-24,py+19,11,COL.cream,'center');
  ccfgBtns.push({x:px+pw-36,y:py+8,w:24,h:22,f:function(){S.ccfg=null;}});
}

/* ---------- input ---------- */
var mouse={sx:0,sy:0,gx:-1,gy:-1,in:false};
C.addEventListener('mousemove',function(e){
  var r=C.getBoundingClientRect();
  mouse.sx=(e.clientX-r.left)*(C.width/r.width);
  mouse.sy=(e.clientY-r.top)*(C.height/r.height);
  mouse.gx=Math.floor((mouse.sx-OX)/TS);mouse.gy=Math.floor((mouse.sy-OY)/TS);
  mouse.in=mouse.gx>=0&&mouse.gy>=0&&mouse.gx<GW&&mouse.gy<GH&&mouse.sy>OY&&mouse.sy<H-BOT;
});
C.addEventListener('wheel',function(e){
  if(S.shop){S.sscroll=clamp(S.sscroll+e.deltaY*0.5,0,S.sscrollMax);e.preventDefault();}
},{passive:false});
function overStall(){
  return mouse.sx>STALL.wx-62*SPR&&mouse.sx<STALL.wx+62*SPR&&mouse.sy>STALL.wy-90*SPR&&mouse.sy<STALL.wy+12*SPR;
}
function overParrot(){
  return Math.abs(mouse.sx-PARROT.wx)<26&&mouse.sy>PARROT.wy-60&&mouse.sy<PARROT.wy+10;
}
C.addEventListener('contextmenu',function(e){
  e.preventDefault();
  if(S.shop||S.inv||S.parrot||!mouse.in)return;
  var c=cell(mouse.gx,mouse.gy);
  if(!c)return;
  if(c.t==='deco'){clearPalm(mouse.gx,mouse.gy);save();return;}
  if(c.t==='stall'||c.t==='npc')return;
  if(c.t==='belt'){
    S.dir=c.dir;S.tool='belt';
    removeAt(mouse.gx,mouse.gy);
    S.hint='Picked up the conveyor - left-click to put it down';
  } else if(c.t==='occ'){
    var kind=c.s.t;
    if(!removeAt(mouse.gx,mouse.gy))return;
    S.tool=kind;
    S.hint='Picked up the '+itemName(kind).toLowerCase()+' - left-click to put it down';
  } else return;
  S.hintT=3;
  sparkle(cx(mouse.gx)+TS/2,cy(mouse.gy)+TS/2,'#ffe9a3',6);
  beep(420,0.06,'square',0.04);save();
});
C.addEventListener('mousedown',function(e){
  if(e.button!==0)return;
  if(!AC)beep(440,0.01,'sine',0.001);
  var i;
  if(S.shop){
    for(i=0;i<shopBtns.length;i++){var b=shopBtns[i];
      if(mouse.sx>=b.x&&mouse.sx<=b.x+b.w&&mouse.sy>=b.y&&mouse.sy<=b.y+b.h){b.f();return;}}
    S.amtFocus=false;
    if(mouse.sx<SHX||mouse.sx>SHX+SHW||mouse.sy<SHY||mouse.sy>SHY+SHH)S.shop=false;
    return;
  }
  if(S.inv){
    for(i=0;i<invBtns.length;i++){var b2=invBtns[i];
      if(mouse.sx>=b2.x&&mouse.sx<=b2.x+b2.w&&mouse.sy>=b2.y&&mouse.sy<=b2.y+b2.h){b2.f();return;}}
    if(mouse.sx<IVX||mouse.sx>IVX+IVW||mouse.sy<IVY||mouse.sy>IVY+IVH)S.inv=false;
    return;
  }
  if(S.parrot){
    for(i=0;i<parBtns.length;i++){var b3=parBtns[i];
      if(mouse.sx>=b3.x&&mouse.sx<=b3.x+b3.w&&mouse.sy>=b3.y&&mouse.sy<=b3.y+b3.h){b3.f();return;}}
    if(mouse.sx<PRX||mouse.sx>PRX+PRW||mouse.sy<PRY||mouse.sy>PRY+PRH)S.parrot=false;
    return;
  }
  if(S.ccfg){
    for(i=0;i<ccfgBtns.length;i++){var b6=ccfgBtns[i];
      if(mouse.sx>=b6.x&&mouse.sx<=b6.x+b6.w&&mouse.sy>=b6.y&&mouse.sy<=b6.y+b6.h){b6.f();return;}}
    S.ccfg=null;
    /* fall through */
  }
  if(S.scfg){
    for(i=0;i<scfgBtns.length;i++){var b4=scfgBtns[i];
      if(mouse.sx>=b4.x&&mouse.sx<=b4.x+b4.w&&mouse.sy>=b4.y&&mouse.sy<=b4.y+b4.h){b4.f();return;}}
    if(S.linking&&mouse.in){
      var tg=structAt(mouse.gx,mouse.gy);
      if(tg&&tg.t==='gate'){
        var already=S.linking.gates.some(function(g){return g[0]===tg.x&&g[1]===tg.y;});
        if(!already)S.linking.gates.push([tg.x,tg.y]);
        S.linking=null;S.hint='Gate linked to the scanner';S.hintT=3;
        beep(880,0.07,'triangle',0.05);save();return;
      }
    }
    S.scfg=null;S.linking=null;
    /* fall through so the click still does something */
  }
  if(mouse.sy>H-BOT){
    if(mouse.sx>=14&&mouse.sx<=156&&mouse.sy>=H-BOT+12&&mouse.sy<=H-BOT+58){
      S.inv=true;beep(620,0.05,'sine',0.04);}
    return;
  }
  if(S.tut<TUT.length&&mouse.sx>=tutSkip.x&&mouse.sx<=tutSkip.x+tutSkip.w&&mouse.sy>=tutSkip.y&&mouse.sy<=tutSkip.y+tutSkip.h){
    S.tut=TUT.length;S.hint='Tutorial skipped';S.hintT=2;beep(400,0.05,'sine',0.04);save();return;}
  if(overStall()){S.shop=true;S.sscroll=0;S.amtFocus=true;M.talk=0;beep(520,0.09,'triangle',0.05);return;}
  if(overParrot()){S.parrot=true;beep(560,0.08,'triangle',0.05);return;}
  if(mouse.in){
    var st=structAt(mouse.gx,mouse.gy);
    if(st){
      if(st.t==='scan'){S.scfg=st;S.ccfg=null;S.linking=null;beep(700,0.05,'sine',0.04);return;}
      if(st.t==='craft'){S.ccfg=st;S.scfg=null;S.linking=null;beep(700,0.05,'sine',0.04);return;}
      if(st.t==='gate'){st.open=!st.open;
        S.hint=st.open?'Gate opened':'Gate closed';S.hintT=2;beep(st.open?740:340,0.05,'square',0.04);return;}
      if(st.t==='seller'&&st.brk){
        if(S.coins<45){S.hint='Repairs cost 45c';S.hintT=2;beep(160,0.1,'sawtooth',0.04);return;}
        S.coins-=45;st.brk=false;st.dmg=0;st.thr=2+Math.floor(Math.random()*2);
        pop(cx(st.x)+TS,cy(st.y),'-45c',COL.gold);sparkle(cx(st.x)+TS,cy(st.y)+TS,'#7ce7a2',8);
        S.hint='Auto seller repaired!';S.hintT=3;beep(760,0.08,'triangle',0.05);save();return;
      }
    }
  }
  /* collect every loose bit sitting in the clicked square (or right beside the cursor) */
  var got=0,lastx=0,lasty=0,gotKinds={};
  for(i=S.loose.length-1;i>=0;i--){var l=S.loose[i];
    if(!l.land)continue;
    var sameTile=Math.floor((l.x-OX)/TS)===mouse.gx&&Math.floor((l.y-OY)/TS)===mouse.gy;
    if(sameTile||Math.hypot(mouse.sx-l.x,mouse.sy-(l.y-8*SPR))<TS*0.7){
      lastx=l.x;lasty=l.y;gain(l.kind,1);gotKinds[l.kind]=1;S.loose.splice(i,1);got++;}
  }
  if(got){pop(lastx,lasty-6,'+'+got,gotKinds.sup?COL.sup2:COL.bit2);
    sparkle(lastx,lasty,gotKinds.sup?COL.sup:COL.bit,4+got*2);
    beep(1040,0.05,'sine',0.045);save();return;}
  if(!mouse.in)return;
  var t2=S.tool;
  if(S.stock[t2]<=0){S.hint='No '+itemName(t2).toLowerCase()+' in your inventory - buy one at the stall';S.hintT=2.5;
    beep(160,0.1,'sawtooth',0.04);return;}
  if(!canPlace(t2,mouse.gx,mouse.gy)){S.hint='No room there';S.hintT=1.5;beep(180,0.08,'sawtooth',0.035);return;}
  place(t2,mouse.gx,mouse.gy,S.dir);S.stock[t2]--;
  sparkle(cx(mouse.gx)+TS/2*sizeOf(t2),cy(mouse.gy)+TS/2*sizeOf(t2),COL.gold,6);
  beep(700,0.05,'triangle',0.045);save();
});
function rotateHover(){
  if(S.shop||S.inv||S.parrot||!mouse.in)return;
  var c=cell(mouse.gx,mouse.gy);
  if(c&&c.t==='belt'){c.dir=S.dir;beep(560,0.04,'square',0.03);save();return;}
  if(c&&c.t==='occ'&&(c.s.t==='scan'||c.s.t==='gate')){c.s.dir=S.dir;beep(560,0.04,'square',0.03);save();}
}
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(S.shop&&S.amtFocus){
    if(k>='0'&&k<='9'){if((S.amt||'').length<6)S.amt=(S.amt||'')+k;e.preventDefault();return;}
    if(k==='Backspace'){S.amt=(S.amt||'').slice(0,-1);e.preventDefault();return;}
    if(k==='Enter'){sellTyped();e.preventDefault();return;}
    if(k==='Escape'){S.amtFocus=false;S.shop=false;return;}
  }
  if(k==='1')S.tool='belt';
  else if(k==='2')S.tool='miner';
  else if(k==='3')S.tool='seller';
  else if(k==='i'||k==='I'){S.inv=!S.inv;S.shop=false;S.parrot=false;}
  else if(k==='e'||k==='E'){S.shop=!S.shop;S.inv=false;S.parrot=false;S.sscroll=0;S.amtFocus=S.shop;}
  else if(k==='Escape'){S.shop=false;S.inv=false;S.parrot=false;S.scfg=null;S.ccfg=null;S.linking=null;S.amtFocus=false;}
  else if(k==='r'||k==='R'){S.dir=(S.dir+1)%4;rotateHover();}
  else if(k.indexOf('Arrow')===0){
    e.preventDefault();
    S.dir=k==='ArrowRight'?0:k==='ArrowDown'?1:k==='ArrowLeft'?2:3;
    rotateHover();
  }
});

/* ---------- save ---------- */
function save(){
  try{
    var belts=[];
    for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var c=S.cells[y*GW+x];
      if(c&&c.t==='belt')belts.push([x,y,c.dir]);}
    var st=S.structs.map(function(s){
      var o=[s.t,s.x,s.y,s.dir];
      if(s.t==='seller')o.push({dmg:s.dmg,thr:s.thr,brk:s.brk});
      if(s.t==='scan')o.push({filt:s.filt,mode:s.mode,gates:s.gates});
      if(s.t==='gate')o.push({open:s.open});
      if(s.t==='comp')o.push({buf:s.buf});
      if(s.t==='craft')o.push({ri:s.ri,prog:s.prog});
      return o;});
    localStorage.setItem('bitminer6',JSON.stringify({b:belts,s:st,bag:S.bag,unl:S.unlocked,cur:S.cur,
      coins:S.coins,stock:S.stock,price:S.price,hist:S.hist,mined:S.mined,sold:S.sold,
      pts:S.pts,rew:S.rew,supU:S.supUnlocked,gwU:S.gwUnlocked,tut:S.tut,p:PALMS.map(function(a){return [a.x,a.y];})}));
  }catch(e){}
}
function load(){
  try{
    var d=JSON.parse(localStorage.getItem('bitminer6'));if(!d)return;
    for(var i=0;i<GW*GH;i++)S.cells[i]=null;
    S.structs=[];S.items=[];S.loose=[];
    markStall();setCell(PARROT.x,PARROT.y,{t:'npc'});
    for(var q=0;q<PALMS.length;q++)setCell(PALMS[q].x,PALMS[q].y,{t:'deco'});
    if(d.p){var keep={};d.p.forEach(function(a){keep[a[0]+','+a[1]]=1;});
      for(var q2=PALMS.length-1;q2>=0;q2--){var pp=PALMS[q2];
        if(!keep[pp.x+','+pp.y]){setCell(pp.x,pp.y,null);PALMS.splice(q2,1);}}}
    (d.s||[]).forEach(function(a){
      if(!canPlace(a[0],a[1],a[2]))return;
      var s=place(a[0],a[1],a[2],a[3]||0),ex=a[4];
      if(s&&ex){for(var k in ex)s[k]=ex[k];}
    });
    (d.b||[]).forEach(function(a){if(isLand(a[0],a[1])&&!cell(a[0],a[1]))setCell(a[0],a[1],{t:'belt',dir:a[2]});});
    S.bag=d.bag||S.bag;S.unlocked=d.unl||S.unlocked;S.cur=d.cur||'bit';
    if(!S.unlocked[S.cur])S.cur='bit';
    S.coins=d.coins||0;S.stock=d.stock||S.stock;S.price=clamp(d.price||7.5,5,10);
    S.hist=(d.hist&&d.hist.length>2)?d.hist.map(function(v){return clamp(v,5,10);}):S.hist;
    S.mined=d.mined||0;S.sold=d.sold||0;S.pts=d.pts||0;S.rew=d.rew||0;S.supUnlocked=!!d.supU;S.gwUnlocked=!!d.gwU;
    S.tut=(d.tut===undefined)?TUT.length:d.tut;
    if(S.stock.mini===undefined)S.stock.mini=0;
    if(S.stock.scan===undefined)S.stock.scan=0;
    if(S.stock.gate===undefined)S.stock.gate=0;
    if(S.stock.sup===undefined)S.stock.sup=0;
    if(S.stock.comp===undefined)S.stock.comp=0;
    if(S.stock.craft===undefined)S.stock.craft=0;
    if(S.stock.gw===undefined)S.stock.gw=0;
  }catch(e){}
}
load();
setInterval(save,5000);
window.addEventListener('beforeunload',save);

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  var dt=clamp((now-last)/1000,0,0.05);last=now;T+=dt;

  for(var i=0;i<S.structs.length;i++){var s=S.structs[i];
    if(s.t==='miner'||s.t==='mini'||s.t==='sup'){
      var cad=s.t==='mini'?2.0:(s.t==='sup'?2.8:2.4);
      s.tm+=dt;s.spin+=dt*2.6;
      if(s.tm>cad){s.tm=0;produce(s);}
      s.pop=Math.max(0,s.pop-dt*3);s.puff=Math.max(0,s.puff-dt*1.2);}
    else if(s.t==='seller')s.lid=Math.max(0,s.lid-dt*3);
    else if(s.t==='comp')s.press=Math.max(0,(s.press||0)-dt*2);
    else if(s.t==='craft')s.made=Math.max(0,(s.made||0)-dt*1.5);
  }
  updateItems(dt);updateLoose(dt);updateScanners(dt);market(dt);tutStep(dt);

  M.ph+=dt*2.1;
  M.blink-=dt;if(M.blink<-2.5)M.blink=0.12;
  if(M.talk>0)M.talk-=dt;
  if(S.hintT>0)S.hintT-=dt;
  for(var p=S.pops.length-1;p>=0;p--){var q=S.pops[p];q.y+=q.vy*dt;q.vy*=0.94;q.a-=dt*0.9;if(q.a<=0)S.pops.splice(p,1);}
  for(var k=S.spark.length-1;k>=0;k--){var sp=S.spark[k];sp.t+=dt;sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.vy+=190*dt;
    if(sp.t>sp.l)S.spark.splice(k,1);}

  /* ---- render ---- */
  drawSea();
  drawIsland();
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var c=S.cells[y*GW+x];if(c&&c.t==='belt')drawBelt(x,y,c);}
  for(var f=0;f<S.structs.length;f++){var fs=S.structs[f];
    if(fs.t==='gate')drawGateFlat(fs);
    else if(fs.t==='scan')drawScanFlat(fs);
    else if(fs.t==='gw')drawGwFlat(fs);}
  if(mouse.in&&!S.shop&&!S.inv&&!S.parrot&&S.stock[S.tool]>0){
    var t=S.tool,n=sizeOf(t),ok=canPlace(t,mouse.gx,mouse.gy);
    X.globalAlpha=0.55;
    rr(cx(mouse.gx)+2,cy(mouse.gy)+2,n*TS-4,n*TS-4,7);
    fill(ok?'rgba(120,255,160,.35)':'rgba(255,110,110,.35)');
    line(ok?'#7dffa4':'#ff6e6e',2.5);
    if(t==='belt'||t==='scan'||t==='gate'){
      X.save();X.translate(cx(mouse.gx)+TS/2,cy(mouse.gy)+TS/2);X.rotate(S.dir*Math.PI/2);X.scale(SPR,SPR);
      X.strokeStyle=COL.gold;X.lineWidth=4;X.beginPath();X.moveTo(-6,-7);X.lineTo(4,0);X.lineTo(-6,7);X.stroke();X.restore();}
    X.globalAlpha=1;
  }
  var list=[];
  for(var s3=0;s3<S.structs.length;s3++){var st=S.structs[s3];
    if(st.t==='gate'||st.t==='scan')continue;
    var nn=sizeOf(st.t);
    list.push({wy:cy(st.y)+TS*nn-4,wx:cx(st.x)+TS*nn/2,k:st.t,o:st});}
  list.push({wy:STALL.wy-1,wx:M.x,k:'mantis'});
  list.push({wy:STALL.wy,wx:STALL.wx,k:'stall'});
  list.push({wy:PARROT.wy,wx:PARROT.wx,k:'parrot'});
  for(var pl=0;pl<PALMS.length;pl++)list.push({wy:cy(PALMS[pl].y)+TS-4,wx:cx(PALMS[pl].x)+TS/2,k:'palm',o:PALMS[pl]});
  for(var it3=0;it3<S.items.length;it3++){var it=S.items[it3],bi2=beltInfo(it.cx,it.cy);
    var d2=bi2?bi2.dir:0;
    list.push({wy:cy(it.cy)+TS/2+DY[d2]*(it.p-0.5)*TS,wx:cx(it.cx)+TS/2+DX[d2]*(it.p-0.5)*TS,k:'gem',kind:it.kind});}
  for(var l3=0;l3<S.loose.length;l3++){var lo=S.loose[l3];list.push({wy:lo.y,wx:lo.x,k:'loose',o:lo});}
  list.sort(function(a,b){return a.wy-b.wy;});
  for(var d3=0;d3<list.length;d3++){
    var e3=list[d3];
    X.save();X.translate(e3.wx,e3.wy);X.scale(SPR,SPR);
    if(e3.k==='miner')drawMiner(e3.o);
    else if(e3.k==='mini')drawMini(e3.o);
    else if(e3.k==='sup')drawSuper(e3.o);
    else if(e3.k==='seller')drawSeller(e3.o);
    else if(e3.k==='comp')drawComp(e3.o);
    else if(e3.k==='gw')drawGwRing(e3.o);
    else if(e3.k==='craft')drawCraft(e3.o);
    else if(e3.k==='stall')drawStall();
    else if(e3.k==='mantis')drawMantis();
    else if(e3.k==='parrot')drawParrot();
    else if(e3.k==='palm')drawPalm(e3.o);
    else if(e3.k==='gem'){drawBit(0,0,0.85,true,e3.kind);}
    else if(e3.k==='loose'){shadow(6,2.5);drawBit(0,-8-e3.o.z,0.8,true,e3.o.kind);
      if(e3.o.land){X.globalAlpha=0.35+0.35*Math.sin(T*4+e3.o.bob);X.fillStyle='#fff';
        X.beginPath();X.arc(6,-16,1.7,0,6.3);X.fill();X.globalAlpha=1;}}
    X.restore();
  }
  for(var k2=0;k2<S.spark.length;k2++){var sp2=S.spark[k2];
    X.globalAlpha=clamp(1-sp2.t/sp2.l,0,1);X.fillStyle=sp2.c;
    X.beginPath();X.arc(sp2.x,sp2.y,2.4,0,6.3);X.fill();X.globalAlpha=1;}
  for(var p3=0;p3<S.pops.length;p3++){var q3=S.pops[p3];
    X.globalAlpha=clamp(q3.a,0,1);txt(q3.t,q3.x,q3.y-20,11,q3.c,'center');X.globalAlpha=1;}
  if(S.scfg&&!S.shop&&!S.inv&&!S.parrot)drawScfg();
  if(S.ccfg&&!S.shop&&!S.inv&&!S.parrot)drawCcfg();
  drawTut();
  drawHud();
  if(S.inv)drawInv();
  if(S.parrot)drawParrotPanel();
  if(S.shop)drawShop();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
